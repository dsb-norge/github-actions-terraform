name: "Run terraform docs"
description: |
  Inject terraform docs for modules into README.md, and into the README.md of
  every examples/ subfolder when the repository has an examples/ folder, and
  push the result.

  Where the repository has no .terraform-docs.yml (in its root, or in
  examples/), the action's default config is added and committed with the
  docs. A README.md without the BEGIN_TF_DOCS / END_TF_DOCS delimiters gets
  them appended; delimiters in the wrong order fail the action.

  terraform-docs/gh-actions is a Docker action, so its two steps stay in this
  file; the logic around them lives in the step_*.sh scripts.
author: "Artjoms Laivins"

inputs:
  readme-file-path:
    description: |
      Directory of the README.md to inject terraform docs into, relative to the
      repository root. Default is the root of the repository.
      terraform-docs takes a comma-separated list of directories here, but the
      delimiter check handles a single directory only.
    required: false
    default: "."

outputs:
  number-of-files-changed:
    description: |
      Total number of files changed by this action: the num_changed of the
      project and the examples terraform-docs steps.
      ref. https://github.com/terraform-docs/gh-actions?tab=readme-ov-file#outputs
    value: ${{ steps.report.outputs.number-of-files-changed }}

runs:
  using: "composite"
  steps:
    - id: inject-config-files
      shell: bash
      run: |
        # Add default terraform-docs config files where the repo has none
        set -o allexport
        source "${{ github.action_path }}/step_inject_config_files.sh"

    - id: validate-root-readme
      shell: bash
      env:
        input_readme_file_path: ${{ inputs.readme-file-path }}
      run: |
        # Make sure README.md has the terraform-docs delimiters
        set -o allexport
        source "${{ github.action_path }}/step_validate_root_readme.sh"
      continue-on-error: true

    - id: generate-example-docs
      name: Generate the examples' docs
      if: steps.inject-config-files.outputs.examples-folder-exists == 'true'
      uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1.4.1
      with:
        working-dir: ${{ steps.inject-config-files.outputs.examples-subfolders }}
        git-push: "true"
        config-file: ${{ github.workspace }}/examples/.terraform-docs.yml

    - id: generate-project-docs
      name: Generate the module's docs
      if: steps.validate-root-readme.outcome == 'success'
      uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1.4.1
      with:
        working-dir: ${{ inputs.readme-file-path }}
        git-push: "true"
        config-file: .terraform-docs.yml

    - id: report
      if: always()
      shell: bash
      env:
        input_validate_outcome: ${{ steps.validate-root-readme.outcome }}
        input_examples_outcome: ${{ steps.generate-example-docs.outcome }}
        input_examples_num_changed: ${{ steps.generate-example-docs.outputs.num_changed }}
        input_project_outcome: ${{ steps.generate-project-docs.outcome }}
        input_project_num_changed: ${{ steps.generate-project-docs.outputs.num_changed }}
      run: |
        # Count the files terraform-docs changed and judge the README check
        set -o allexport
        source "${{ github.action_path }}/step_report.sh"
