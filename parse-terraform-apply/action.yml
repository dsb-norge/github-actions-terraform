name: "Parse terraform apply output"
description: |
  Parses the console output of 'terraform apply' (or of applying a
  '-destroy' plan) to extract the resource change counts from its summary
  line, and produces a copy of the console with terraform's progress-tick
  lines removed for embedding in a PR comment.

  Recognised summary lines:
    Apply complete! Resources: <A> added, <C> changed, <D> destroyed.
    Destroy complete! Resources: <D> destroyed.

  A failed apply prints no summary line. Every count is then '?' and
  `completed` is 'false' — never zeros, which would read as "nothing
  happened" for what may be a partially applied infrastructure.
  See docs/Apply-and-destroy-reporting.md §7.2.

  This action never decides whether the apply succeeded: that is the step's
  exit code, and the renderers derive every status from it. The counts are
  decoration, '?' when unavailable. Given `apply-exitcode`, the action emits
  one '::warning title=Terraform output not recognised' when terraform
  exited 0 without a recognised summary line, or when the line carries a
  verb this parser does not know — asking for the console to be reported.
  See docs/Apply-and-destroy-reporting.md §14.
author: "Peder Schmedling"
inputs:
  apply-console-file:
    description: |
      Path of the file with apply output captured from the console
      (terraform-apply's `console-output-file` output). Missing or empty is
      not an error: counts are '?' and `completed` is 'false'.
    required: true
  apply-exitcode:
    description: |
      The raw exit code of 'terraform apply' (terraform-apply's `exitcode`).
      Read only to detect the mismatch worth a human look — exit 0 with no
      recognised summary line — and emit the run-page warning for it. Never
      changes an output. Empty disables the check.
    required: false
    default: ""
outputs:
  count-import:
    description: |
      Number of resources imported. '?' when no summary line was found, '0' when
      terraform emitted no 'imported' segment (it only does so when import
      blocks are in play). Counted in `count-total`: an apply that only adopted
      existing objects is not a no-op.
    value: ${{ steps.parse-apply-output.outputs.import-count }}
  count-add:
    description: Number of resources added. '?' when no summary line was found.
    value: ${{ steps.parse-apply-output.outputs.add-count }}
  count-change:
    description: Number of resources changed. '?' when no summary line was found.
    value: ${{ steps.parse-apply-output.outputs.change-count }}
  count-destroy:
    description: Number of resources destroyed. '?' when no summary line was found.
    value: ${{ steps.parse-apply-output.outputs.destroy-count }}
  count-total:
    description: |
      Sum of import + add + change + destroy. '?' when no summary line was found.
      Terraform's apply summary carries no move / remove segment, but it does
      carry 'imported' — assuming otherwise once made a successful apply of five
      imports report as a failed apply.
    value: ${{ steps.parse-apply-output.outputs.total-count }}
  completed:
    description: |
      'true' when a summary line was found and parsed, 'false' otherwise.
      Says whether the COUNTS are available — consumers render '?' instead
      of a count when it is 'false' — and nothing about whether the apply
      succeeded: that is the step outcome, and a renderer must never turn
      `completed=false` into a failure or `completed=true` into a success
      (docs/Apply-and-destroy-reporting.md §14, P32).
    value: ${{ steps.parse-apply-output.outputs.completed }}
  apply-kind:
    description: |
      'apply' or 'destroy', from which summary line matched. Empty when
      `completed` is 'false'.
    value: ${{ steps.parse-apply-output.outputs.apply-kind }}
  filtered-console-file:
    description: |
      Path of a copy of the console file with terraform's progress-tick
      lines ('<addr>: Still creating... [10s elapsed]') removed. A long
      apply emits thousands of those; a 65k tail of the raw console would
      be almost entirely ticks. Always populated; empty when the input is.
    value: ${{ steps.parse-apply-output.outputs.filtered-console-file }}
runs:
  using: "composite"
  steps:
    - id: parse-apply-output
      shell: bash
      env:
        input_apply_console_file: ${{ inputs.apply-console-file }}
        input_apply_exitcode: ${{ inputs.apply-exitcode }}
      run: |
        # Extract resource change counts and a tick-free copy from the apply console output
        set -o allexport
        source "${{ github.action_path }}/step_parse_apply_output.sh"
