name: "Run terraform init in directory"
description: |
  Given a working directory this will run 'terraform init' within it, and
  optionally in additional directories supplied via JSON. The combined
  stdout/stderr of every init invocation is captured to a single console
  file ('tf-init-console-output-<env>.txt') so downstream steps can scan
  for diagnostics.
author: "Peder Schmedling"
inputs:
  working-directory:
    description: From what directory to invoke terraform.
    required: true
  environment-name:
    description: |
      Name of the current deployment environment. Used when naming the
      console-output file ('tf-init-console-output-<env>.txt').
    required: false
    default: ""
  additional-dirs-json:
    description: |
      JSON array of additional directories (relative to GITHUB_WORKSPACE)
      in which to also run 'terraform init'. Empty array or empty string
      runs only the project init in working-directory.
    required: true
  plugin-cache-directory:
    description: |
      Optional: path to the terraform providers plugin cache directory.
      When set, exported as TF_PLUGIN_CACHE_DIR (with
      TF_PLUGIN_CACHE_MAY_BREAK_DEPENDENCY_LOCK_FILE=true) during the
      additional-dirs init loop so providers are reused across envs.
    required: false
    default: ""
  extra-envs-file:
    description: |
      Path to a JSON file with environment variables to apply to this action's
      invocations only, as produced by the 'resolve-goal-envs' action. A JSON
      null value unsets the variable rather than setting it to the empty
      string.

      A path rather than a payload so that the values — which may be secrets —
      never enter argv, envp, or this step's script text.

      The values are applied before this action's own exports, so an action-managed
      variable set by the step script at runtime (e.g. TF_PLUGIN_CACHE_DIR) wins,
      while one set in the step's env: block (e.g. TF_IN_AUTOMATION) is overridden
      by the caller. See docs/Per-goal-environment-variables.md §6.3.
    required: false
    default: ""
outputs:
  console-output-file:
    description: |
      Absolute path of the file containing the captured stdout/stderr
      from every 'terraform init' invocation done by this step (project
      init + any additional dirs, appended in order).
    value: ${{ steps.init.outputs.tf-init-console-output-file }}
runs:
  using: "composite"
  steps:
    - id: check-prereqs
      shell: bash
      run: |
        # Make sure terraform and the plugin cache directory are available

        set -o allexport; source "${{ github.action_path }}/helpers.sh"; set +o allexport;

        start-group "check prerequisite: terraform binary"
        if ! command -v terraform version &>/dev/null; then
          log-error "terraform is not available on path, please install using the 'setup-terraform' action!"
          exit 1
        else
          log-info "using $(terraform version)"
        fi
        end-group

        start-group "check prerequisite: terraform providers plugin cache directory"
        PLUGIN_CACHE_DIR="${{ inputs.plugin-cache-directory }}"
        if [ "" == "${PLUGIN_CACHE_DIR}" ]; then
          log-info "input 'plugin-cache-directory' not configured."
        else
          log-info "input 'plugin-cache-directory' is '${PLUGIN_CACHE_DIR}'"
          if [ -d "${PLUGIN_CACHE_DIR}" ]; then
            log-info "'plugin-cache-directory' exists."
          else
            log-error "'plugin-dir' configured but does not exists!"
            exit 1
          fi
        fi
        end-group

    - id: init
      shell: bash
      env:
        TF_IN_AUTOMATION: "true"
        input_working_directory: ${{ inputs.working-directory }}
        input_environment_name: ${{ inputs.environment-name }}
        input_plugin_cache_directory: ${{ inputs.plugin-cache-directory }}
        input_extra_envs_file: ${{ inputs.extra-envs-file }}
      run: |
        # Run 'terraform init' in the project and any additional directories
        #
        # JSON input via heredoc — keeps quotes/special chars intact and
        # out of envp (the ARG_MAX guard pattern from CLAUDE.md).
        input_additional_dirs_json=$(cat <<'EOF'
        ${{ inputs.additional-dirs-json }}
        EOF
        )
        export input_additional_dirs_json
        set -o allexport
        source "${{ github.action_path }}/step_init.sh"
