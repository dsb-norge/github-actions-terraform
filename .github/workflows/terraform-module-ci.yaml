name: "DSB Terraform Module CI"
#
# Validates, documents and tests a Terraform module repository: the module at the repository root,
# its examples and its terraform test files. Spec: docs/Module-ci.md; user guide:
# docs/Workflow-terraform-module-ci.md. The project workflow, terraform-ci-cd-default.yml, is its
# sibling for repositories of environments; the two share the test stage (the decision engine's
# module mode, and the test jobs, written out here again and held to the same steps by F20) and the
# seed job, which here posts a refused Dependabot pull request's admission head alone.
#
# The calling job grants:
#   permissions:
#     id-token: write       # OIDC, for the test jobs
#     contents: read        # checkout; the docs job pushes with the App token, not this one
#     pull-requests: write  # the validation, tests and admission heads
#     actions: read         # job links in the tests head
#   secrets: inherit
#
# The docs job's App token reads the organisation's CI App: vars.ORG_TF_CICD_APP_ID and
# secrets.ORG_TF_CICD_APP_PRIVATE_KEY. Test credentials come from lanes only
# (terraform-test-lanes-yml, docs/Module-ci.md §6).
#
on:
  workflow_call:
    inputs:
      terraform-version:
        description: "Terraform version for validation and, unless a lane sets its own, the tests (1.13 or later for tests)."
        required: true
        type: string
      tflint-version:
        description: "TFLint version for the lint step."
        required: true
        type: string
      readme-file-path:
        description: "Directory of the README.md terraform-docs maintains. Default: the repository root."
        type: string
        default: "."
      runs-on:
        description: "Runner of every job but the test jobs (terraform-test-runs-on)."
        type: string
        default: "ubuntu-latest"
      add-pr-comment:
        description: "Post the validation and tests heads on pull requests."
        type: boolean
        default: true
      cache-terraform-modules:
        description: "Cache the modules test roots download (docs/Terraform-module-cache.md); per lane too."
        type: boolean
        default: true
      terraform-test-enabled:
        description: "Run the committed terraform test files (docs/Terraform-tests.md). false removes the test stage."
        type: boolean
        default: true
      terraform-test-required:
        description: |
          A module needs at least one test file, a unit suite (docs/Module-ci.md D9): with none the
          conclusion is red. false lets a repository without test files conclude green.
        type: boolean
        default: true
      allow-failing-terraform-tests:
        description: "A failing or erroring test does not fail the check; rendered as tolerated. Per lane too."
        type: boolean
        default: false
      terraform-test-runs-on:
        description: "Runner of the test jobs. Per lane 'runs-on'."
        type: string
        default: "ubuntu-latest"
      terraform-test-timeout-minutes:
        description: "timeout-minutes of each test job. Per lane 'timeout-minutes'."
        type: number
        default: 30
      terraform-test-lanes-yml:
        description: |
          Lanes: which test files run with which credentials, runner, Terraform version and GitHub
          Environment (docs/Terraform-tests.md §3.2). Without lanes every file runs without
          credentials. The usual module shape, one credential from the repository's secrets:

            terraform-test-lanes-yml: |
              - name: azure
                extra-envs-yml:
                  ARM_USE_OIDC: true
                  ARM_USE_AZUREAD: true
                extra-envs-from-secrets-yml:
                  ARM_TENANT_ID: REPO_AZURE_DSB_TENANT_ID
                  ARM_SUBSCRIPTION_ID: REPO_AZURE_SUBSCRIPTION_ID
                  ARM_CLIENT_ID: REPO_AZURE_TERRAFORM_USER_SERVICE_PRINCIPAL
        type: string
        default: ""
      terraform-test-exclude-paths-yml:
        description: "Glob patterns of test files discovery ignores (docs/Terraform-tests.md §4.4)."
        type: string
        default: ""
      dependabot-admission-enabled:
        description: |
          Whether a run started by Dependabot runs validate and the tests only after the admission admits its pull request;
          an admitted run also runs the credentialed test lanes, whose IDs must then be plain values in the lane, and
          gets its regenerated README committed, for which the App's key must also be an organisation Dependabot secret
          (docs/Dependabot-admission.md §11). Off by default: without it a Dependabot run's credentialed lanes do not run,
          and its README is checked, not committed.
        type: boolean
        default: false
      dependabot-admission-yml:
        description: "The admission's policy, added to its built-in one (docs/Dependabot-admission.md §6)."
        type: string
        default: ""

# One run per ref. The default queue depth (one pending run) is deliberate: a pending run is a
# superseded commit of the same ref and nothing here applies to shared state, so dropping it when
# a newer push arrives is right. The test jobs queue per file on their own group (queue: max).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  TF_IN_AUTOMATION: true

defaults:
  run:
    shell: bash

jobs:
  create-matrix:
    name: "Create test matrix"
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
    outputs:
      tests-matrix-json: ${{ steps.create-matrix.outputs.tests-matrix-json }}
      tests-count: ${{ steps.create-matrix.outputs.tests-count }}
      tests-active: ${{ steps.create-matrix.outputs.tests-active }}
      tests-required-missing: ${{ steps.create-matrix.outputs.tests-required-missing }}
      # The Dependabot admission's verdict, when a caller opts in (docs/Dependabot-admission.md §11).
      admission-refused: ${{ steps.create-matrix.outputs.admission-refused }}
      admission-reason: ${{ steps.create-matrix.outputs.admission-reason }}
      admission-admitted: ${{ steps.create-matrix.outputs.admission-admitted }}
    steps:
      - name: "⬇ Checkout"
        uses: actions/checkout@v7
        with:
          # The merge commit and its first parent: the admission judges the change between them.
          fetch-depth: 2
      - name: "🎰 Create the test matrix"
        id: create-matrix
        uses: dsb-norge/github-actions-terraform/create-tf-vars-matrix@v1
        with:
          inputs-json: ${{ toJSON(inputs) }}
          mode: module
      # The not-run rows of the tests summary read it (create-test-summary's not-run-file).
      - name: "📦 Upload the test decision"
        uses: actions/upload-artifact@v7
        with:
          name: relevance
          path: ${{ steps.create-matrix.outputs.relevance-file }}

  # A refused Dependabot pull request's admission head, and its purge on a later run, posted as the project
  # workflow's seed job posts them: the job is that job but for its if, which F20 in
  # evaluate-automerge-eligibility/run_all_tests.sh holds (docs/Dependabot-admission.md §7, D21).
  # Only a pull request Dependabot opened can hold the head, so no other pull request runs the job.
  seed-pr-comments:
    if: |
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.fork == false
      && github.event.action != 'closed'
      && github.event.action != 'converted_to_draft'
      && github.event.pull_request.user.login == 'dependabot[bot]'
    name: "Seed PR comment heads"
    needs: create-matrix
    runs-on: ${{ inputs.runs-on }}
    permissions:
      pull-requests: write
    defaults:
      run:
        shell: bash
    steps:
      - name: "📥 Download the relevance decision"
        uses: actions/download-artifact@v8
        with:
          name: relevance
          path: ${{ runner.temp }}/relevance
        continue-on-error: true # a missing manifest seeds nothing; the matrix jobs still post their heads
      - name: "📋 Read the head manifest"
        id: compose
        run: |
          # Hand the decision engine's heads and tag purges to the reconcile action as YAML
          #
          # The engine composed them with relevance (docs/Path-relevance.md §6.3): group heads
          # first, then one head per ungrouped commenting environment, a placeholder when it is
          # affected and its final "not affected" body when it is not. Reconcile POSTs in this
          # order, so on a fresh pull request it becomes the conversation's order.
          set -euo pipefail
          manifest="${RUNNER_TEMP}/relevance/relevance.json"
          if [ -f "${manifest}" ]; then
            heads_yml=$(jq '[.comments.heads[] | {marker, body}]' "${manifest}" | yq -P '.')
            gc_yml=$(jq '.comments.gc' "${manifest}" | yq -P '.')
          else
            echo "::warning title=Seed PR comment heads::The relevance decision is missing; no heads are seeded and no tags are purged."
            heads_yml='[]'
            gc_yml='[]'
          fi
          echo "Composed heads-yml:"
          printf '%s\n' "${heads_yml}"
          echo "Composed gc-yml:"
          printf '%s\n' "${gc_yml}"
          write_output() {
            local delim
            delim="EOF_$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
            printf '%s<<%s\n%s\n%s\n' "${1}" "${delim}" "${2}" "${delim}" >>"${GITHUB_OUTPUT}"
          }
          write_output heads-yml "${heads_yml}"
          write_output gc-yml "${gc_yml}"

      - name: "🌱 Seed heads"
        uses: dsb-norge/github-actions-terraform/pr-comments-reconcile@v1
        with:
          repo: ${{ github.repository }}
          issue-number: ${{ github.event.pull_request.number }}
          github-token: ${{ github.token }}
          heads-yml: ${{ steps.compose.outputs.heads-yml }}
          # Only unaffected environments' tags. Each matrix job purges its own environment's
          # prior tags as its first commenting step, which holds when the seed is skipped on
          # "Re-run failed jobs"; purging an affected environment here would delete tags that
          # environments not re-run still show. An unaffected environment's job does not run, so
          # without this a plan from an earlier run would stay under a head saying "not affected".
          gc-yml: ${{ steps.compose.outputs.gc-yml }}
        continue-on-error: true # never fail the workflow over PR comment seeding

  generate-docs:
    name: "Update documentation"
    # The admission's verdict decides whether a Dependabot run may push (docs/Dependabot-admission.md D22);
    # every other run waits for create-matrix for nothing worse than its few seconds, and runs whatever its result.
    needs: create-matrix
    if: ${{ !cancelled() }}
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read # a docs commit is pushed with the App token, which starts the next run
    outputs:
      pushed: ${{ steps.docs.outputs.pushed }}
      status: ${{ steps.docs.outputs.status }}
    steps:
      # Only a pull request from this repository gets a docs commit (docs/Module-ci.md D6): a fork's
      # run has no secrets, and a push, a dispatch or a schedule must never commit to its branch.
      # Dependabot's pull request gets one only when the admission judged and admitted this run: the
      # App's commit starts a run that is the App's, not Dependabot's, so nobody judges it, and it
      # must carry nothing the admission has not admitted (docs/Dependabot-admission.md D22). Keyed
      # on the pull request's author as well as the actor: a person's run on Dependabot's pull request
      # (reopened, labelled) is judged by nobody either, and auto-merge accepts the docs commit
      # (docs/Module-auto-merge.md M4).
      # Everywhere else the docs job checks, and needs no App.
      #
      # The App's variable and secret belong to the organisation and reach a repository only when it
      # is on each one's repository access list. Without them the token step fails with "client-id
      # must be set", which names neither, so they are checked first and the job says what to grant.
      - name: "🔐 Check the App's variable and secret"
        id: app-access
        if: |
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && ((github.event.pull_request.user.login != 'dependabot[bot]' && github.actor != 'dependabot[bot]')
              || needs.create-matrix.outputs.admission-admitted == 'true')
        env:
          APP_ID: ${{ vars.ORG_TF_CICD_APP_ID }}
          PRIVATE_KEY_SET: ${{ secrets.ORG_TF_CICD_APP_PRIVATE_KEY != '' }}
          ACTOR: ${{ github.actor }}
        run: |
          # Fail naming each organisation variable or secret this repository cannot read
          missing=0
          if [ -z "${APP_ID}" ]; then
            echo "::error title=GitHub App::This repository cannot read the organisation variable ORG_TF_CICD_APP_ID. Add the repository to the variable's repository access: organisation settings, Secrets and variables, Actions, Variables, ORG_TF_CICD_APP_ID."
            missing=1
          fi
          if [ "${PRIVATE_KEY_SET}" != "true" ] && [ "${ACTOR}" = "dependabot[bot]" ]; then
            # A Dependabot run reads Dependabot secrets only (docs/Dependabot-admission.md D22).
            echo "::error title=GitHub App::This Dependabot run cannot read the organisation secret ORG_TF_CICD_APP_PRIVATE_KEY. A Dependabot run reads Dependabot secrets only: add the App's key as an organisation Dependabot secret of that name (organisation settings, Secrets and variables, Dependabot) with this repository in its repository access, and pass 'secrets: inherit' in the calling job."
            missing=1
          elif [ "${PRIVATE_KEY_SET}" != "true" ]; then
            echo "::error title=GitHub App::This repository cannot read the organisation secret ORG_TF_CICD_APP_PRIVATE_KEY. Add the repository to the secret's repository access (organisation settings, Secrets and variables, Actions, Secrets, ORG_TF_CICD_APP_PRIVATE_KEY), and pass 'secrets: inherit' in the calling job."
            missing=1
          fi
          exit "${missing}"
      - name: "🔑 Create GitHub App token"
        id: app-token
        if: |
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && ((github.event.pull_request.user.login != 'dependabot[bot]' && github.actor != 'dependabot[bot]')
              || needs.create-matrix.outputs.admission-admitted == 'true')
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.ORG_TF_CICD_APP_ID }}
          private-key: ${{ secrets.ORG_TF_CICD_APP_PRIVATE_KEY }}
          permission-contents: write
        continue-on-error: true # explained by the next step, which fails the job
      # Only the App can ask GitHub whether it is installed on this repository, and the token step
      # is that question: with the variable and the secret present, its failure is the installation
      # or the key.
      - name: "🔐 Explain the failed App token"
        if: steps.app-token.outcome == 'failure'
        run: |
          # The variable and the secret reach this repository, so the App or its key is what failed
          echo "::error title=GitHub App::The App whose ID is ORG_TF_CICD_APP_ID gave no token for this repository. The variable and the secret reach the repository, so either the App is not installed on it (organisation settings, GitHub Apps, the App, Configure, Repository access), or ORG_TF_CICD_APP_PRIVATE_KEY is not a key of that App. The token step's log above has GitHub's answer."
          exit 1

      - name: "⬇ Checkout"
        uses: actions/checkout@v7
        with:
          # the pull request's branch, not the merge commit, so a docs commit lands on it
          ref: ${{ steps.app-token.outcome == 'success' && github.event.pull_request.head.ref || '' }}
          token: ${{ steps.app-token.outputs.token || github.token }}

      # The branch's tip may have moved past the commit this run evaluated, by a push or by Dependabot
      # rebasing; a commit on top of it would carry what nobody judged (docs/Dependabot-admission.md P23).
      # The push itself is a plain git push, which GitHub refuses when the branch moves after this check.
      - name: "📌 Pin the docs commit to the evaluated head"
        id: pin
        if: steps.app-token.outcome == 'success'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Push only on top of the commit this run evaluated; a newer commit's own run regenerates the README
          if [ "$(git rev-parse HEAD)" = "${HEAD_SHA}" ]; then
            echo "at-head=true" >>"${GITHUB_OUTPUT}"
          else
            echo "::notice title=Update documentation::The branch has moved past ${HEAD_SHA}, the commit this run evaluated; its newer commit's run regenerates the README."
            echo "at-head=false" >>"${GITHUB_OUTPUT}"
          fi

      - name: "📝 Validate and update the README"
        id: docs
        uses: dsb-norge/github-actions-terraform/terraform-docs@v1
        with:
          readme-file-path: ${{ inputs.readme-file-path }}
          push: ${{ steps.app-token.outcome == 'success' && steps.pin.outputs.at-head == 'true' && 'true' || 'false' }}
          # '[dependabot skip]' keeps Dependabot rebasing and updating its pull request despite the commit
          commit-message: "${{ github.actor == 'dependabot[bot]' && 'terraform-docs: automated action [dependabot skip]' || 'terraform-docs: automated action' }}"

  validate:
    name: "Validate module"
    needs: [generate-docs, create-matrix]
    # A docs commit starts a run of its own, which validates it; this run's tree is superseded. Validation runs
    # the pull request's providers, so a Dependabot run validates only once create-matrix has decided and the
    # admission did not refuse it (docs/Dependabot-admission.md D16).
    if: |
      !cancelled() && needs.generate-docs.outputs.pushed != 'true'
      && (github.actor != 'dependabot[bot]'
          || (needs.create-matrix.result == 'success' && needs.create-matrix.outputs.admission-refused != 'true'))
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
      pull-requests: write # the validation head, and the legacy per-file test comments removed
    steps:
      - name: "🧹 Clean workspace"
        uses: dsb-norge/directory-recreate@v1

      - name: "⬇ Checkout"
        uses: actions/checkout@v7

      - name: "📥 Setup Terraform"
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ inputs.terraform-version }}
          # the wrapper mangles the output and the exit code
          terraform_wrapper: false

      - name: "🗄️ Setup Terraform provider plugin cache"
        id: setup-terraform-cache
        uses: dsb-norge/github-actions-terraform/setup-terraform-plugin-cache@v1

      - name: "📥 Setup TFLint"
        id: setup-tflint
        uses: dsb-norge/github-actions-terraform/setup-tflint@v1
        with:
          tflint-version: ${{ inputs.tflint-version }}
          working-directory: ${{ github.workspace }}

      - name: "🚀 Cache Terraform provider plugins"
        uses: actions/cache@v6
        with:
          path: ${{ steps.setup-terraform-cache.outputs.plugin-cache-directory }}
          key: ${{ steps.setup-terraform-cache.outputs.plugin-cache-key-monthly-rolling }}

      - name: "⚙️ Terraform Init"
        id: init
        uses: dsb-norge/github-actions-terraform/terraform-init@v1
        with:
          working-directory: ${{ github.workspace }}
          additional-dirs-json: null
          plugin-cache-directory: ${{ steps.setup-terraform-cache.outputs.plugin-cache-directory }}
          # Authenticates terraform's remote-module clones, which are otherwise charged to a per-IP
          # budget shared by every runner behind the same NAT address.
          github-token: ${{ github.token }}
        continue-on-error: true # evaluated by the gates below

      - name: "🖌 Terraform Format"
        id: fmt
        uses: dsb-norge/github-actions-terraform/terraform-fmt@v1
        with:
          working-directory: ${{ github.workspace }}
          format-check-in-root-dir: true
        continue-on-error: true # evaluated by the gates below

      - name: "✔ Terraform Validate"
        id: validate
        uses: dsb-norge/github-actions-terraform/terraform-validate@v1
        with:
          working-directory: ${{ github.workspace }}
        continue-on-error: true # evaluated by the gates below

      - name: "🧹 Lint with TFLint"
        id: lint
        uses: dsb-norge/github-actions-terraform/lint-with-tflint@v1
        with:
          working-directory: ${{ github.workspace }}
        continue-on-error: true # evaluated by the gates below

      - name: "⚠️ Parse init warnings"
        id: parse-init-warnings
        if: always() && steps.init.outputs.console-output-file != ''
        uses: dsb-norge/github-actions-terraform/parse-terraform-warnings@v1
        with:
          console-output-file: ${{ steps.init.outputs.console-output-file }}
          step-label: init
          environment-name: module
        continue-on-error: true # reporting only

      - name: "⚠️ Parse validate warnings"
        id: parse-validate-warnings
        if: always() && steps.validate.outputs.console-output-file != ''
        uses: dsb-norge/github-actions-terraform/parse-terraform-warnings@v1
        with:
          console-output-file: ${{ steps.validate.outputs.console-output-file }}
          step-label: validate
          environment-name: module
        continue-on-error: true # reporting only

      - name: "⚠️ Sum the warnings"
        id: warnings
        if: always()
        env:
          INIT_COUNT: ${{ steps.parse-init-warnings.outputs.warning-count }}
          VALIDATE_COUNT: ${{ steps.parse-validate-warnings.outputs.warning-count }}
        run: |
          # Add the init and validate warning counts; a count a skipped parse left empty is 0
          total=0
          for count in "${INIT_COUNT}" "${VALIDATE_COUNT}"; do
            if [[ "${count}" =~ ^[0-9]+$ ]]; then
              total=$((total + count))
            fi
          done
          echo "warning-count=${total}" >>"${GITHUB_OUTPUT}"

      # Rendered on every event: the step summary is the run page's report; the head is posted on a
      # pull request only.
      - name: "📝 Create validation summary"
        id: create-validation-summary
        if: always()
        uses: dsb-norge/github-actions-terraform/create-validation-summary@v1
        with:
          # the head reads "Terraform validation summary for module: `<repository>`"
          environment-name: ${{ github.event.repository.name }}
          subject: module
          status-init: ${{ steps.init.outcome }}
          status-fmt: ${{ steps.fmt.outcome }}
          status-validate: ${{ steps.validate.outcome }}
          status-lint: ${{ steps.lint.outcome }}
          # a module has no lock file and no plan: no rows for them
          status-verify-lock: absent
          status-plan: absent
          warning-count: ${{ steps.warnings.outputs.warning-count }}
        continue-on-error: true # reporting only

      - name: "📋 Add the validation summary to the job summary"
        if: always() && steps.create-validation-summary.outputs.step-summary-file != ''
        env:
          STEP_SUMMARY_FILE: ${{ steps.create-validation-summary.outputs.step-summary-file }}
        run: |
          # Append the rendered validation block to the job's step summary
          cat "${STEP_SUMMARY_FILE}" >>"${GITHUB_STEP_SUMMARY}"
        continue-on-error: true # reporting only

      - name: "🏷️ Upsert the validation head"
        if: |
          always()
          && steps.create-validation-summary.outcome == 'success'
          && inputs.add-pr-comment == true
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.fork == false
          && github.event.action != 'closed'
          && github.event.action != 'converted_to_draft'
        uses: dsb-norge/github-actions-terraform/pr-comment@v1
        with:
          repo: ${{ github.repository }}
          issue-number: ${{ github.event.pull_request.number }}
          github-token: ${{ github.token }}
          mode: upsert
          marker: "<!-- tf:head:module -->"
          body-file: ${{ steps.create-validation-summary.outputs.head-summary-file }}
        continue-on-error: true # never fail the workflow over PR comments

      # v0 posted one comment per test file; the tests head replaces them. The marker's colon after
      # 'test' keeps the tests head, '<!-- tf:head:tests:', out of the match.
      - name: "🧹 Remove the per-file test comments of v0"
        if: |
          always()
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.fork == false
        uses: dsb-norge/github-actions-terraform/pr-comment@v1
        with:
          repo: ${{ github.repository }}
          issue-number: ${{ github.event.pull_request.number }}
          github-token: ${{ github.token }}
          mode: delete
          marker: "<!-- tf:head:test:"
        continue-on-error: true # never fail the workflow over PR comments

      - name: "🧐 Validation outcome: ⚙️ Init"
        if: always() && steps.init.outcome != 'success'
        run: exit 1

      - name: "🧐 Validation outcome: 🖌 Format"
        if: always() && steps.fmt.outcome != 'success'
        run: exit 1

      - name: "🧐 Validation outcome: ✔ Validate"
        if: always() && steps.validate.outcome != 'success'
        run: exit 1

      - name: "🧐 Validation outcome: 🧹 TFLint"
        if: always() && steps.lint.outcome != 'success'
        run: exit 1

  terraform-test:
    name: ${{ matrix.test.name }}
    # The run a docs commit starts tests that commit; this one would test a superseded tree.
    needs: [create-matrix, generate-docs]
    if: |
      !cancelled()
      && needs.create-matrix.result == 'success'
      && needs.create-matrix.outputs.tests-active == 'true'
      && needs.generate-docs.outputs.pushed != 'true'
    runs-on: ${{ matrix.test.runs-on }}
    timeout-minutes: ${{ matrix.test.timeout-minutes }}
    permissions:
      contents: read
      id-token: write # the azurerm and azuread providers mint their own OIDC tokens
    environment:
      name: ${{ matrix.test.github-environment }}
      deployment: false # keeps the secrets, records no deployment
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.create-matrix.outputs.tests-matrix-json) }}
    # Per file, not per lane: a per-lane group would cancel the rest of this run's own matrix.
    # GitHub's default queue depth is one: a third run entering the group cancels the pending job
    # to take its place, and a cancelled test job turns the conclusion red. `queue: max` keeps up
    # to 100 pending jobs in (best-effort) arrival order instead, as for the stage jobs. It is only
    # valid together with cancel-in-progress false.
    concurrency:
      group: ${{ github.repository }}-terraform-test-${{ matrix.slug }}
      cancel-in-progress: false
      queue: max
    defaults:
      run:
        shell: bash
    steps:
      - name: "⬇ Checkout"
        uses: actions/checkout@v7

      - name: "🎰 Export lane environment variables"
        uses: dsb-norge/github-actions-terraform/export-env-vars@v1
        with:
          extra-envs: ${{ toJSON(matrix.test.extra-envs) }}
          extra-envs-from-secrets: ${{ toJSON(matrix.test.extra-envs-from-secrets) }}
          secrets-json: ${{ toJSON(secrets) }}
          # An environment lane's ARM_* and TF_VAR_* secrets under their own names; nothing for other lanes.
          export-secrets-with-prefixes-json: ${{ toJSON(matrix.test.github-environment != '' && fromJSON('["ARM_","TF_VAR_"]') || fromJSON('[]')) }}
          # GitHub upper-cases secret names; the copy sets the snake_case variable a test declares.
          lower-case-copies-for-prefixes-json: ${{ toJSON(matrix.test.github-environment != '' && fromJSON('["TF_VAR_"]') || fromJSON('[]')) }}

      - name: "🔐 Verify lane credentials"
        id: verify-credentials
        if: matrix.test.github-environment != ''
        env:
          LANE_ENVIRONMENT: ${{ matrix.test.github-environment }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          # Name a missing credential, with the commands that set it, instead of letting init fail obscurely
          if [ -n "${ARM_TENANT_ID:-}" ] && [ -n "${ARM_CLIENT_ID:-}" ]; then
            echo "The lane's environment '${LANE_ENVIRONMENT}' provides ARM_TENANT_ID and ARM_CLIENT_ID."
            exit 0
          fi
          # A Dependabot run reads no environment secret, set or not (docs/Dependabot-admission.md D20, P19).
          if [ "${ACTOR}" = "dependabot[bot]" ]; then
            echo "::error title=Terraform test::Environment secrets do not reach a Dependabot run, so the lane's environment '${LANE_ENVIRONMENT}' gives it no ARM_TENANT_ID or ARM_CLIENT_ID."
            echo "Give the lane its IDs as plain values in its extra-envs-yml; they are not secret (docs/Dependabot-admission.md D20)."
            exit 1
          fi
          echo "::error title=Terraform test::The environment '${LANE_ENVIRONMENT}' has no ARM_TENANT_ID or ARM_CLIENT_ID secret yet."
          echo "Set them, then re-run (docs/Terraform-tests.md §3.6):"
          echo "  gh secret set ARM_TENANT_ID --env '${LANE_ENVIRONMENT}' --repo '${REPOSITORY}'"
          echo "  gh secret set ARM_CLIENT_ID --env '${LANE_ENVIRONMENT}' --repo '${REPOSITORY}'"
          exit 1
        continue-on-error: true # reported by the test step and gated below

      - name: "🔑 Login to Azure"
        uses: azure/login@v3
        if: |
          steps.verify-credentials.outcome != 'failure'
          && env.ARM_TENANT_ID != '' && env.ARM_SUBSCRIPTION_ID != '' && env.ARM_CLIENT_ID != ''
        with:
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}
          client-id: ${{ env.ARM_CLIENT_ID }}
        continue-on-error: true # the providers log in on their own; a failed login shows in the test

      - name: "📥 Setup Terraform"
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ matrix.test.terraform-version }}
          # the wrapper mangles the -json stream and the exit code
          terraform_wrapper: false

      - name: "📋 Provide provider versions"
        id: copy-lock
        env:
          ROOT: ${{ matrix.test.root }}
          ROOT_KIND: ${{ matrix.test.root-kind }}
          SET_LOCK: ${{ matrix.test.provider-set-lock }}
        run: |
          # Copy the provider set's environment lock into a non-environment test root; name the runner's platform
          if [ "${ROOT_KIND}" != 'environment' ] && [ -n "${SET_LOCK}" ]; then
            cp "${SET_LOCK}" "${ROOT}/.terraform.lock.hcl"
            echo "Copied '${SET_LOCK}' into '${ROOT}'."
          fi
          case "${RUNNER_OS}" in Linux) os=linux ;; macOS) os=darwin ;; Windows) os=windows ;; *) os="${RUNNER_OS,,}" ;; esac
          case "${RUNNER_ARCH}" in X64) arch=amd64 ;; ARM64) arch=arm64 ;; X86) arch=386 ;; ARM) arch=arm ;; *) arch="${RUNNER_ARCH,,}" ;; esac
          lock="${ROOT}/.terraform.lock.hcl"
          # The check reads the lock where it is committed, so its fix command names that directory.
          lock_directory="${ROOT}"
          [ "${ROOT_KIND}" != 'environment' ] && [ -n "${SET_LOCK}" ] && lock_directory="$(dirname "${SET_LOCK}")"
          {
            echo "platform=${os}_${arch}"
            echo "lock-present=$([ -f "${lock}" ] && echo true || echo false)"
            echo "lock-directory=${lock_directory}"
          } >>"${GITHUB_OUTPUT}"

      - name: "🗄️ Setup Terraform provider plugin cache"
        id: setup-terraform-cache
        uses: dsb-norge/github-actions-terraform/setup-terraform-plugin-cache@v1

      # Its own key, falling back to the environment job's: actions/cache saves only the first entry
      # for a key, so with the environment job's key the test-only providers would never be cached (P41).
      - name: "🚀 Cache Terraform provider plugins"
        if: steps.copy-lock.outputs.lock-present == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ steps.setup-terraform-cache.outputs.plugin-cache-directory }}
          key: "terraform-provider-plugin-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('{0}/.terraform.lock.hcl', matrix.test.root)) }}-tftest"
          restore-keys: |
            terraform-provider-plugin-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('{0}/.terraform.lock.hcl', matrix.test.root)) }}

      # Every lock a test job uses must record the runner's platform: without it the plugin cache fails
      # a warm init, and a read-only init leaves a package terraform test refuses (P39). Lock-only, as
      # nothing is initialised yet, and after the restore so a warm cache spares the download.
      - name: "🔏 Verify the lock covers this runner"
        id: provider-versions
        if: steps.copy-lock.outputs.lock-present == 'true'
        uses: dsb-norge/github-actions-terraform/verify-terraform-lock@v1
        with:
          working-directory: ${{ steps.copy-lock.outputs.lock-directory }}
          platforms: ${{ steps.copy-lock.outputs.platform }}
          lock-only: "true"
          plugin-cache-directory: ${{ steps.setup-terraform-cache.outputs.plugin-cache-directory }}
        continue-on-error: true # reported by the test step and gated below

      - name: "🗄️ Resolve terraform module cache"
        id: module-cache
        if: matrix.test.cache-terraform-modules == 'true'
        uses: dsb-norge/github-actions-terraform/terraform-module-cache@v1
        with:
          phase: resolve
          project-dir: ${{ matrix.test.root }}
          additional-dirs-json: "[]"
          # one entry per root: init installs the run-block modules of every test file in it
          environment: tftest-${{ matrix.test.root }}
          test-directory: tests
        continue-on-error: true # caching is an optimisation, never a reason to fail a run

      - name: "🚀 Restore terraform module cache"
        id: restore-module-cache
        if: steps.module-cache.outputs.cache-enabled == 'true'
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.module-cache.outputs.cache-paths }}
          key: ${{ steps.module-cache.outputs.cache-key }}
        continue-on-error: true # caching is an optimisation, never a reason to fail a run

      - name: "📸 Snapshot restored module manifests"
        id: snapshot-module-cache
        if: steps.module-cache.outputs.cache-enabled == 'true'
        uses: dsb-norge/github-actions-terraform/terraform-module-cache@v1
        with:
          phase: snapshot
          cache-paths: ${{ steps.module-cache.outputs.cache-paths }}
          cache-hit: ${{ steps.restore-module-cache.outputs.cache-hit }}
        continue-on-error: true # only feeds a warning; must never block init

      - name: "⚙️ Terraform Init"
        id: init
        if: steps.verify-credentials.outcome != 'failure' && steps.provider-versions.outcome != 'failure'
        uses: dsb-norge/github-actions-terraform/terraform-init@v1
        with:
          working-directory: ${{ matrix.test.root }}
          environment-name: ${{ matrix.slug }}
          additional-dirs-json: "[]"
          # terraform test keeps state in memory; a backend block must not make init reach for storage
          backend: false
          lockfile-mode: ${{ matrix.test.root-kind == 'environment' && 'readonly-if-present' || 'default' }}
          plugin-cache-directory: ${{ steps.setup-terraform-cache.outputs.plugin-cache-directory }}
          plugin-cache-may-break-lock-file: true
          github-token: ${{ github.token }}
        continue-on-error: true # reported by the test step and gated below

      - name: "🔍 Check terraform module cache"
        id: post-init-check
        if: steps.module-cache.outputs.cache-enabled == 'true'
        uses: dsb-norge/github-actions-terraform/terraform-module-cache@v1
        with:
          phase: verify
          cache-paths: ${{ steps.module-cache.outputs.cache-paths }}
          cache-hit: ${{ steps.restore-module-cache.outputs.cache-hit }}
          snapshot-dir: ${{ steps.snapshot-module-cache.outputs.snapshot-dir }}
        continue-on-error: true # if this cannot run, safe-to-save stays unset and nothing is saved

      - name: "🧹 Prune git metadata from the module cache"
        id: prune-module-cache
        if: |
          steps.module-cache.outputs.cache-enabled == 'true'
          && steps.init.outcome == 'success'
          && steps.restore-module-cache.outputs.cache-hit != 'true'
          && steps.post-init-check.outputs.safe-to-save == 'true'
        uses: dsb-norge/github-actions-terraform/terraform-module-cache@v1
        with:
          phase: prune
          cache-paths: ${{ steps.module-cache.outputs.cache-paths }}
        continue-on-error: true # a prune that cannot run must not stop the save

      # Right after init, before the test writes into module directories.
      - name: "💾 Save terraform module cache"
        if: |
          steps.module-cache.outputs.cache-enabled == 'true'
          && steps.init.outcome == 'success'
          && steps.restore-module-cache.outputs.cache-hit != 'true'
          && steps.post-init-check.outputs.safe-to-save == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.module-cache.outputs.cache-paths }}
          key: ${{ steps.module-cache.outputs.cache-key }}
        continue-on-error: true # a lost cache write must not fail the run

      # Runs whatever happened before: the earlier steps' outcomes are how it reports no credentials,
      # a lock without the runner's platform or a failed init.
      - name: "🧪 Terraform test"
        id: test
        if: "!cancelled()"
        uses: dsb-norge/github-actions-terraform/terraform-test@v1
        with:
          working-directory: ${{ matrix.test.root }}
          test-file: ${{ matrix.test.rel }}
          slug: ${{ matrix.slug }}
          status-credentials: ${{ steps.verify-credentials.outcome }}
          status-lock: ${{ steps.provider-versions.outcome }}
          status-init: ${{ steps.init.outcome }}
          environments-lock-file: ${{ matrix.test.root-kind == 'environment' && format('{0}/.terraform.lock.hcl', matrix.test.root) || matrix.test.provider-set-lock }}
        continue-on-error: true # gated below, after every reporting step

      - name: "📤 Upload test output"
        id: upload-test-output
        if: always() && steps.test.outputs.report-file != ''
        uses: actions/upload-artifact@v7
        with:
          name: terraform-test-log-${{ matrix.slug }}
          path: |
            ${{ steps.test.outputs.json-file }}
            ${{ steps.test.outputs.report-file }}
            ${{ steps.test.outputs.junit-file }}
          if-no-files-found: ignore
        continue-on-error: true # never fail the job over an upload

      # Uploads the artifact terraform-test-meta-<slug> itself; the summary job reads it.
      - name: "📦 Capture and upload test job metadata"
        id: capture-metadata
        if: always()
        uses: dsb-norge/github-actions-terraform/capture-matrix-job-meta@v1
        with:
          entity-name: ${{ matrix.slug }}
          artifact-name: terraform-test-meta-${{ matrix.slug }}
          matrix-context-json: ${{ toJSON(matrix) }}
          github-context-json: ${{ toJSON(github) }}
          steps-context-json: ${{ toJSON(steps) }}
        continue-on-error: true # never fail the job due to metadata capture

      # The gates come after every reporting step: a gate exits 1 and would otherwise skip the upload
      # that explains the failure.
      - name: "🧐 Validation outcome: 🔐 Credentials"
        if: steps.verify-credentials.outcome == 'failure'
        run: exit 1
        continue-on-error: ${{ fromJSON(matrix.test.allow-failing-terraform-tests) }}

      - name: "🧐 Validation outcome: ⚙️ Init"
        if: steps.init.outcome != 'success'
        run: exit 1
        continue-on-error: ${{ fromJSON(matrix.test.allow-failing-terraform-tests) }}

      - name: "🧐 Validation outcome: 🧪 Test"
        if: steps.test.outputs.status != 'pass'
        run: exit 1
        continue-on-error: ${{ fromJSON(matrix.test.allow-failing-terraform-tests) }}

  # One PR comment and one run-summary block for the whole stage (docs/Terraform-tests.md §6). Never in
  # the conclusion's needs: a reporting job must never redden a run.
  terraform-test-summary:
    name: "Terraform tests summary"
    # After validation, so the validation head is posted first; and not when a docs commit started
    # a run of its own, whose tests this run skipped.
    needs: [create-matrix, generate-docs, validate, terraform-test]
    if: |
      always()
      && needs.create-matrix.result == 'success'
      && inputs.terraform-test-enabled == true
      && (needs.create-matrix.outputs.tests-count != '0' || github.event_name == 'pull_request')
      && needs.generate-docs.outputs.pushed != 'true'
    runs-on: ${{ inputs.runs-on }} # global setting
    permissions:
      pull-requests: write # the tests head
      actions: read        # the Jobs API, for the job links
    defaults:
      run:
        shell: bash
    steps:
      - name: "📥 Download test job metadata"
        uses: actions/download-artifact@v8
        with:
          pattern: terraform-test-meta-*
          merge-multiple: true
        continue-on-error: true # zero matches is a valid input
      - name: "📥 Download the relevance decision"
        uses: actions/download-artifact@v8
        with:
          name: relevance
          path: ${{ runner.temp }}/relevance
        # A download by name throws when the artifact is missing (P8); the summary then has no
        # not-run rows.
        continue-on-error: true
      - name: "🧾 Summarise the tests"
        id: summary
        uses: dsb-norge/github-actions-terraform/create-test-summary@v1
        with:
          tests-matrix-json: ${{ needs.create-matrix.outputs.tests-matrix-json }}
          not-run-file: ${{ runner.temp }}/relevance/relevance.json
          github-token: ${{ github.token }}
        continue-on-error: true # never fail the workflow over reporting
      - name: "💬 Post the tests summary"
        if: |
          steps.summary.outcome == 'success'
          && needs.create-matrix.outputs.tests-count != '0'
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.fork == false
          && github.event.action != 'closed'
          && github.event.action != 'converted_to_draft'
          && inputs.add-pr-comment == true
        uses: dsb-norge/github-actions-terraform/pr-comment@v1
        with:
          repo: ${{ github.repository }}
          issue-number: ${{ github.event.pull_request.number }}
          github-token: ${{ github.token }}
          mode: upsert
          marker: ${{ steps.summary.outputs.head-marker }}
          body-file: ${{ steps.summary.outputs.body-file }}
        continue-on-error: true # never fail the workflow over PR comments
      # The last test file removed on an open pull request: the head would otherwise show a stale
      # result. A stage switched off skips this job, so its head stays as it was.
      - name: "🧹 Remove the tests summary"
        if: |
          steps.summary.outcome == 'success'
          && needs.create-matrix.outputs.tests-count == '0'
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.fork == false
          && github.event.action != 'closed'
          && github.event.action != 'converted_to_draft'
        uses: dsb-norge/github-actions-terraform/pr-comment@v1
        with:
          repo: ${{ github.repository }}
          issue-number: ${{ github.event.pull_request.number }}
          github-token: ${{ github.token }}
          mode: delete
          marker: ${{ steps.summary.outputs.head-marker }}
        continue-on-error: true # never fail the workflow over PR comments

  # The one check a caller requires (docs/Module-ci.md §8). It judges named results and the engine's
  # outputs, as the project workflow's conclusion does; reporting jobs stay out of needs.
  conclusion:
    if: always()
    name: "Terraform conclusion"
    needs: [create-matrix, generate-docs, validate, terraform-test]
    runs-on: ${{ inputs.runs-on }}
    permissions: {}
    steps:
      - name: "🛑 Verify everything that should have run, ran and passed"
        env:
          CREATE_MATRIX_RESULT: ${{ needs.create-matrix.result }}
          DOCS_RESULT: ${{ needs.generate-docs.result }}
          DOCS_PUSHED: ${{ needs.generate-docs.outputs.pushed }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          TESTS_ACTIVE: ${{ needs.create-matrix.outputs.tests-active }}
          TESTS_COUNT: ${{ needs.create-matrix.outputs.tests-count }}
          TESTS_REQUIRED_MISSING: ${{ needs.create-matrix.outputs.tests-required-missing }}
          TESTS_RESULT: ${{ needs.terraform-test.result }}
          ADMISSION_REFUSED: ${{ needs.create-matrix.outputs.admission-refused }}
          ADMISSION_REASON: ${{ needs.create-matrix.outputs.admission-reason }}
        run: |
          # Judge the run from the named results and the engine's outputs (docs/Module-ci.md §8)
          set -euo pipefail
          verdict=red
          if [ "${CREATE_MATRIX_RESULT}" != "success" ]; then
            why="the test matrix could not be built (${CREATE_MATRIX_RESULT})"
          elif [ "${ADMISSION_REFUSED:-}" = "true" ]; then
            # Nothing ran: neither validation nor the tests (docs/Dependabot-admission.md D16).
            why="Dependabot pull request not admitted: ${ADMISSION_REASON:-?}; see the admission comment"
          elif [ "${DOCS_RESULT}" != "success" ]; then
            why="the documentation check's result is ${DOCS_RESULT}"
          elif [ "${DOCS_PUSHED}" = "true" ]; then
            # The docs commit started a run of its own, which validates and tests it.
            verdict=green why="documentation regenerated and pushed; the run it started decides"
          elif [ "${VALIDATE_RESULT}" != "success" ]; then
            why="validation's result is ${VALIDATE_RESULT}"
          elif [ "${TESTS_REQUIRED_MISSING}" = "true" ]; then
            why="a module needs at least one test file, a unit suite (terraform-test-required: false opts out)"
          else
            case "${TESTS_RESULT}" in
              success) verdict=green why="validation succeeded" ;;
              skipped)
                if [ "${TESTS_ACTIVE}" = "true" ]; then
                  why="the tests should have run but were skipped"
                else
                  verdict=green why="validation succeeded"
                fi
                ;;
              *) why="the tests' result is ${TESTS_RESULT}" ;;
            esac
          fi
          line="conclusion: ${verdict} — ${why}; tests: ${TESTS_COUNT:-0}"
          echo "${line}"
          echo "${line}" >>"${GITHUB_STEP_SUMMARY}"
          if [ "${verdict}" = green ]; then
            echo "::notice title=Terraform conclusion::${line}"
          else
            echo "::error title=Terraform conclusion::${line}"
            exit 1
          fi
