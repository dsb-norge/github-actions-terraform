name: "DSB terraform CI/CD workflow"
#
# A requirement for this workflow to run is that the following 'permissions' are granted by the calling workflow:
#   permissions:
#     id-token: write       # required for Azure password-less auth
#     contents: read        # required for actions/checkout, and for the compare endpoint that
#                           # lists a push's changed files (path relevance)
#     pull-requests: write  # required for commenting on PRs; 'create-matrix' uses it read-only
#                           # to list a pull request's changed files (path relevance)
#     actions: read         # required by aggregate-validation-summaries to call
#                           # the Jobs API and resolve [job log] URLs for the
#                           # per-group head's Links column. Without it the
#                           # [log extract] anchor still works (it's based on
#                           # PR comment ids), but the [job log] line is dropped.
#
# Additionally for the workflow to have access to secrets (required when using the input 'extra-envs-from-secrets-yml'),
# all secrets available to the calling workflow must be passed down to this one by:
#   secrets: inherit
#
on:
  workflow_call:
    inputs:
      environments-yml:
        type: string
        description: |
          Specification of environments to run this terraform workflow and it's stages for. Minimum 1 environment must be specified.

          Type: YAML list (as string) with specifications of environments to execute stages for.
          Example:
            environments-yml: |
              - environment: "dsb-digiros"
              - environment: "dsb-norge"
                url: "https://github.com/dsb-norge"

          Required fields are:
            - environment
                string, name of environment to run terraform for.
                1 to 255 of the characters A-Z a-z 0-9 . _ -, starting with a letter or a digit; names are unique.

          Optional fields are:
            (a bool field takes true or false, quoted or not, and anything else is an error; a string field that
            overrides a workflow input must be a string, so quote a value YAML reads as a number, ex. terraform-version: "1.10")
            - project-dir
                string, path to a directory to run terraform commands within, the path should be relative to the calling repos root, ex. './envs/dev'.
                note: if this is omitted the workflow will default to use the directory '[repo root]/envs/[workflow input 'environment']'.
            - github-environment
                string, name of the deployment environment in github to run the workflow in context of.
                note: if this is omitted the workflow will default to using deployment environment with name  specified by workflow input 'environment'.
                note: the same characters as 'environment', and no two environments may share one (compared without case).
            - url
                string, a url to display in github's deployment environment UI.
            - add-pr-comment
                bool, whether to add validation summary as comment on PR, see the workflow input 'add-pr-comment'.
                note: this is a per environment setting, use the workflow input for a global setting that applies to all environments.
            - verify-lock-file
                bool, whether to verify lock file platform coverage on PRs, see the workflow input 'verify-lock-file'.
                note: this is a per environment setting, use the workflow input for a global setting that applies to all environments.
            - cache-terraform-modules
                bool, whether to cache terraform modules between runs, see the workflow input 'cache-terraform-modules'.
                note: this is a per environment setting, use the workflow input for a global setting that applies to all environments.
            - apply-extract-include-outputs
                bool, whether the apply/destroy PR comments include terraform's 'Outputs:' section, see the workflow input 'apply-extract-include-outputs'.
                note: this is a per environment setting, use the workflow input for a global setting that applies to all environments.
            - pr-comment-group
                string, name of a group this environment belongs to for PR-comment aggregation, see the workflow input 'pr-comment-group'.
                Environments with the same non-empty group value share a single grouped validation-summary PR comment (one column per environment).
                Their per-environment comments drop the validation table and keep only the plan extract.
                Default behavior (empty string) is unchanged from prior versions — each environment gets its own table+plan comment.
                See docs/Workflow-pr-comments.md for full details.
                note: this is a per environment setting, use the workflow input for a global default that applies to all environments.
            - allow-failing-terraform-operations
                bool, defaults to false, if true: the workflow will not terminate with failure even if job steps fails.
                This parameter allows for ignoring failing results of terraform operations for select environments.
            - extra-envs-from-secrets-yml
                YAML objects, make environment variables with secrets available, see the workflow input 'extra-envs-from-secrets-yml'.
                note: this is a per environment setting, use the workflow input for a global setting that applies to all environments.
            - extra-envs-from-secrets-per-goal-yml
                YAML objects keyed by goal, make environment variables with secrets available to a single goal, see the workflow input 'extra-envs-from-secrets-per-goal-yml'.
                note: this is a per environment setting, use the workflow input for a global setting that applies to all environments.
                note: merged with the global value per goal key, so overriding one variable for one goal keeps that goal's other variables.
            - extra-envs-per-goal-yml
                YAML objects keyed by goal, make environment variables available to a single goal, see the workflow input 'extra-envs-per-goal-yml'.
                note: this is a per environment setting, use the workflow input for a global setting that applies to all environments.
                note: merged with the global value per goal key, so overriding one variable for one goal keeps that goal's other variables.
            - extra-envs-yml
                YAML objects, make environment variables available, see the workflow input 'extra-envs-yml'.
                note: this is a per environment setting, use the workflow input for a global setting that applies to all environments.
            - format-check-in-root-dir
                bool, whether to perform format check from the root of the repo, see the workflow input 'format-check-in-root-dir'.
                note: this is a per environment setting, use the workflow input for a global setting that applies to all environments.
            - goals-yml
                YAML array (as string), steps/stages of the workflow to perform for the given environment, see the workflow input 'goals-yml'.
                note: this is a per environment setting, use the workflow input for a global setting that applies to all environments.
            - runs-on
                string, name of the runner group to run the job on, see the workflow input 'runs-on'.
                note: this is a per environment setting, use the workflow input for a global setting that applies to all environments.
            - terraform-init-additional-dirs-yml
                YAML array (as string), additional directories for 'terraform init', see the workflow input 'terraform-init-additional-dirs-yml'.
                note: this is a per environment setting, use the workflow input for a global setting that applies to all environments.
            - terraform-version
                string, version of terraform to use, see the workflow input 'terraform-version'.
                note: this is a per environment setting, use the workflow input for a global setting that applies to all environments.
            - tflint-version
                string, version of TFLint to use, see the workflow input 'tflint-version'.
                note: this is a per environment setting, use the workflow input for a global setting that applies to all environments.
        required: true
      goals-yml:
        type: string
        description: |
          The Terraform "goals", these specify what steps/stages of the workflow that will be performed.
          The goals specified in 'goals-yml' will be used for all environments defined in 'environments-yml' if not explicitly overridden for a given environment specification.

          Available goals are (in order of execution):
            standard goals
              - init
              - format
              - validate
              - lint
              - plan, this causes the 'plan' stage to run. Additional requirements for 'plan' stage to run:
                - The 'init' goal was specified and the 'init' stage was successful.
              - apply, this causes the 'apply' stage to run, deploying the plan from the 'plan' stage. Additional requirements for 'apply' stage to run:
                - The 'plan' goal was specified and the 'plan' stage was successful (which also implies 'init').
                - AND workflow was not called from a pull request. This behavior can be overridden adding the goal 'apply-on-pr'.
                - AND workflow was called from the default branch of the calling repo.
            special goals
              - all, this is the default, a shorthand version for all standard goals.
              - apply-on-pr, specify this to make the 'apply' goal have effect also when the workflow was called from a pull request.
              - destroy-plan, this causes an additional 'plan' stage to run with the terraform flag '-destroy'. Additional requirements for 'plan' stage to run:
                - The 'init' goal was specified and the 'init' stage was successful.
              - destroy, this causes an additional 'apply' stage to run, deploying the plan created as a result of the 'destroy-plan' goal. Additional requirements for 'destroy' stage to run:
                - The 'destroy-plan' goal was specified and the 'plan' stage with the terraform flag '-destroy' was successful (which also implies 'init').
                - AND workflow was not called from a pull request. This behavior can be overridden adding the goal 'destroy-on-pr'.
                - AND workflow was called from the default branch of the calling repo.
              - destroy-on-pr, specify this to make the 'destroy' goal have effect also when the workflow was called from a pull request.

          Type: YAML array (as string).
          Example:
            goals-yml: "[init, format, validate]"

          NOTE: This applies to all environments, for single environment specify this directly in the environment specification.
        required: false
        default: "[all]"
      terraform-init-additional-dirs-yml:
        type: string
        description: |
          Additional directories to include during the 'init' stage. 'terraform init' will be executed within each of these.
          The path should be relative to the calling repos root, ex. './modules/my-module'.

          Type: YAML array (as string).
          Example:
            terraform-init-additional-dirs-yml: |
              - "./main"
              - "./modules/my-module"

          NOTE: This applies to all environments, for single environment specify this directly in the environment specification.
        required: false
        default: ""
      extra-envs-yml:
        type: string
        description: |
          Key value pairs of environment variables to make available to all stages og all environments.

          Type: YAML object:
            key:    env name
            value:  value of env
          Example:
            extra-envs-yml: |
              ARM_USE_OIDC: true

          NOTE: This applies to all environments, for single environment specify this directly in the environment specification.
        required: false
        default: "{}" # empty object
      extra-envs-from-secrets-yml:
        type: string
        description: |
          Key value pairs of environment variables to make available to all stages og all environments.
          The value of the environment variables will be retrieved from github secrets.

          Type: YAML object:
            key:    env name
            value:  secret name to get value from
          Example:
            extra-envs-from-secrets-yml: |
              ARM_CLIENT_ID: NAME_OF_GITHUB_SECRET_WITH_SERVICE_PRINCIPAL_CLIENT_ID
              ARM_SUBSCRIPTION_ID: NAME_OF_GITHUB_SECRET_WITH_AZURE_SUBSCRIPTION_ID

          NOTE: This applies to all environments, for single environment specify this directly in the environment specification.
        required: false
        default: "{}" # empty object
      extra-envs-per-goal-yml:
        type: string
        description: |
          Key value pairs of environment variables to make available to a single terraform goal only, as opposed to 'extra-envs-yml' which applies to every goal.

          Motivating case is memory tuning: 'plan' may need a much higher GOMEMLIMIT than 'validate', and a GOGC low enough to keep 'plan' inside a runner's memory would needlessly slow down 'lint'.

          The values are applied to the goal's own process only, they do not reach any other step in the job. A YAML null value ('~') unsets the variable for that goal rather than setting it to the empty string.

          Type: YAML object of objects, keyed by goal:
            key:    goal name, one of: init, format, validate, lint, plan, apply, destroy-plan, destroy
                    note: 'all' is NOT a valid key — it is not a stage. Use 'extra-envs-yml' for values that apply to every goal.
                    note: the key is 'format', even though the workflow step is named 'fmt'.
                    note: 'destroy-plan' / 'destroy' are separate from 'plan' / 'apply', which is what lets a destroy plan be tuned independently.
            value:  YAML object of environment variables, as in 'extra-envs-yml'
          Example:
            extra-envs-per-goal-yml: |
              plan:
                GOMEMLIMIT: 12GiB
                GOGC: 25
              apply:
                GOMEMLIMIT: ~     # unset for apply
              lint:
                GOGC: 400

          An unknown goal key is a hard error, so a typo fails loudly instead of silently doing nothing.

          Consider terraform's own 'TF_CLI_ARGS_<subcommand>' via 'extra-envs-yml' first — it covers anything expressible as CLI flags with no per-goal configuration at all. Caveat: it applies to both plan invocations, 'plan' and 'destroy-plan'.

          NOTE: This applies to all environments, for single environment specify this directly in the environment specification.
          Per environment values are deep merged with the global ones, so overriding one variable for one goal keeps that goal's other variables.

          See docs/Workflow-terraform-ci-default.md for details.
        required: false
        default: "{}" # empty object
      extra-envs-from-secrets-per-goal-yml:
        type: string
        description: |
          Key value pairs of environment variables to make available to a single terraform goal only, with values retrieved from github secrets. The secret-sourced counterpart to 'extra-envs-per-goal-yml'.

          IMPORTANT: these values reach the terraform/tflint process for that goal, NOT the workflow's 'Login to Azure' step.
          A reader service principal for 'plan' and a contributor for 'apply' therefore does NOT work through this input: 'azure/login' runs once, early, and reads job-wide environment variables. Handing terraform a different ARM_CLIENT_ID after the OIDC token was already minted for another identity changes nothing. Use this for values terraform or a provider reads directly.

          Type: YAML object of objects, keyed by goal (same keys as 'extra-envs-per-goal-yml'):
            key:    goal name, one of: init, format, validate, lint, plan, apply, destroy-plan, destroy
            value:  YAML object mapping environment variable name -> secret name to get the value from
          Example:
            extra-envs-from-secrets-per-goal-yml: |
              plan:
                TF_VAR_readonly_token: NAME_OF_GITHUB_SECRET

          A secret name that is not available to the workflow is a hard error.

          NOTE: This applies to all environments, for single environment specify this directly in the environment specification.
          Per environment values are deep merged with the global ones.

          See docs/Workflow-terraform-ci-default.md for details.
        required: false
        default: "{}" # empty object
      terraform-version:
        type: string
        description: |
          What version of terraform to use for terraform operations.
          The default is to use the 'latest' release, see https://github.com/hashicorp/terraform/releases
          This is passed to the 'hashicorp/setup-terraform' action and thus wildcards and Semver ranges are supported, see https://github.com/hashicorp/setup-terraform#inputs.
        required: false
        default: latest
      tflint-version:
        type: string
        description: |
          What version of TFLint to use during the 'lint' stage.
          The default is to use the 'latest' release, see https://github.com/terraform-linters/tflint/releases
          Wildcards and patterns not supported. Must be 'latest' or explicit version.
        required: false
        default: latest
      format-check-in-root-dir:
        type: boolean
        description: |
          The default behavior is to perform format check using directories:
            1.  Either supplied by terraform, given by the file '[project-dir]/.terraform/modules/modules.json' created during the 'init' stage.
                The advantage to this approach is that any modules declared will implicitly also be checked.
            2.  Or if no 'module.json' was found run format check within '[project-dir]'.
          This behavior can be altered to perform format check recursively from the root of the repo by setting this to 'true'.
        required: false
        default: false
      add-pr-comment:
        type: boolean
        description: |
          The default is to add validation summary as comment on PR if the workflow triggered by a pull request event.
          Set this to false to avoid a comment being added.
        required: false
        default: true
      verify-lock-file:
        type: boolean
        description: |
          Whether to verify that the committed '.terraform.lock.hcl' contains h1: hashes for all required platforms.
          The check runs after 'terraform init' on pull_request events; push/dispatch/schedule runs on the default branch
          skip it since verification has already happened at PR time.

          Set this to 'false' to disable lock file verification. For per environment control specify this directly in the environment specification.
        required: false
        default: true
      terraform-test-enabled:
        type: boolean
        description: |
          Whether to run the 'terraform test' stage: one job per committed test file (*.tftest.hcl, *.tftest.json), in
          parallel with the environments, on pull requests and pushes only. A repository without test files is
          unaffected. See docs/Terraform-tests.md.
        required: false
        default: true
      allow-failing-terraform-tests:
        type: boolean
        description: |
          Whether a failing or erroring test job is tolerated instead of failing the check. Rendered as tolerated.
          Per-lane override with the same key in 'terraform-test-lanes-yml'.
        required: false
        default: false
      terraform-test-runs-on:
        type: string
        description: |
          The runner for test jobs. Deliberately not 'runs-on': test jobs are many and short. Per-lane override
          'runs-on'.
        required: false
        default: "ubuntu-latest"
      terraform-test-timeout-minutes:
        type: number
        description: |
          'timeout-minutes' of each test job. A job killed mid-apply leaves objects no state file knows about, so keep
          it short. Per-lane override 'timeout-minutes'.
        required: false
        default: 30
      terraform-test-lanes-yml:
        type: string
        description: |
          YAML list of lanes: which test files a lane covers ('match', globs; first match wins, a lane without 'match'
          is the fallback) and what they run with ('extra-envs-yml', 'extra-envs-from-secrets-yml',
          'github-environment: auto' for a GitHub Environment 'tftest-<lane>', 'runs-on', 'terraform-version',
          'timeout-minutes', 'allow-failing-terraform-tests', 'providers-from', 'cache-terraform-modules').
          The workflow's own 'extra-envs-*' inputs never reach a test job. See docs/Terraform-tests.md §3.2.
        required: false
        default: ""
      terraform-test-exclude-paths-yml:
        type: string
        description: |
          YAML list of glob patterns of test files the stage ignores, beside the built-in exclusion of any path with a
          segment starting with '.'.
        required: false
        default: ""
      path-relevance-enabled:
        type: boolean
        description: |
          Whether to run only the environments a change is relevant to. On pull requests and pushes an environment runs
          when a changed file matches its 'paths' (default 'auto': its project directory, 'main/', 'modules/', its
          additional init directories and the root '.tflint.hcl') and none of its 'paths-ignore' (default '**/*.md'
          with 'auto'). Any uncertainty runs every environment. See docs/Path-relevance.md.

          Set this to 'false' to run every environment on every run. This setting applies to all environments; to run one
          environment on every change, set its 'paths' to ['**'].
        required: false
        default: true
      cache-terraform-modules:
        type: boolean
        description: |
          Whether to cache terraform modules between runs. Each directory that 'terraform init' runs in gets its own
          '.terraform/modules' tree cached, so repeated runs stop re-downloading modules that have not changed.

          A directory is only cached when every module source reachable from it — including everything reached through
          local module sources — resolves to immutable content. A directory that can reach a moving git ref is left
          uncached and behaves exactly as it does today, because a warm module tree is never re-fetched and would
          silently pin such a module to whatever commit was current when the cache was written.

          Set this to 'false' to disable module caching. For per environment control specify this directly in the
          environment specification.

          See docs/Terraform-module-cache.md for the full design.
        required: false
        default: true
      apply-extract-include-outputs:
        type: boolean
        description: |
          Whether the apply and destroy PR comments include terraform's 'Outputs:' section.

          The default is false: the section is stripped and the comment says so. 'terraform apply' prints every
          non-sensitive output's actual VALUE there — 'terraform plan' never does — so posting it would publish
          values the plan comment has always kept hidden, in repositories whose maintainers have only ever
          reviewed the plan comment's exposure. Set to true only for environments whose outputs are safe to
          show on a pull request.

          For per environment control specify this directly in the environment specification.
          See docs/Apply-and-destroy-reporting.md P3.
        required: false
        default: false
      pr-comment-group:
        type: string
        description: |
          Optional global default for the per-environment 'pr-comment-group' field. Rarely useful as a global value — you almost always want to set this per environment in 'environments-yml'.

          When an environment's effective value is non-empty, the workflow:
            - Removes the validation table from that environment's per-environment PR comment (keeping plan extract and footer only).
            - Adds the environment as a column to a per-group PR comment shared with all other environments using the same group name.

          See docs/Workflow-pr-comments.md for the full grouped-comment spec.
        required: false
        default: ""
      pr-auto-merge-enabled:
        type: boolean
        description: |
          Whether to enable automatic pull request merging when the workflow is triggered by a pull request event.
          The configuration for automatic pull request merging is further controlled by the input 'pr-auto-merge-from-actors-yml' and 'pr-auto-merge-limits-yml'

          NOTE: This setting applies to all environments, there is no per environment setting for this.
        required: false
        default: false
      pr-auto-merge-from-actors-yml:
        type: string
        description: |
          Configuration for automatic pull request merging. Defines which actors for which automatic merging of PRs is considered.

          Together with the input 'pr-auto-merge-enabled' this controls whether automatic pull request merging is considered when the workflow is triggered by a pull request event.

          When automatic pull request merging is considered, the input 'pr-auto-merge-limits-yml' is used to evaluate if merging should actually be performed.

          Data:
            Type: YAML array (as string) of github actor names that are allowed to have their pull requests automatically merged.
            Default (empty array) means that all actors are allowed.

          NOTE: This setting applies to all environments, there is no per environment setting for this.
        required: false
        default: "[]" # empty array, means all actors allowed
      pr-auto-merge-limits-yml:
        type: string
        description: |
          Configuration for when automatic pull request merging should occur. Defines limits that must be met for automatic merging to be performed.

          The various limits are evaluated against terraform plan output for each environment.

          Only if limits are met for all environments automatic merging be performed. Given that, automatic merging is only considered when the workflow is triggered by a pull request event and the input 'pr-auto-merge-enabled' is set to true and the input 'pr-auto-merge-from-actors-yml' allows the actor.

          How the limits work:
          - For each limit, if the value is set to '-1' that limit is ignored.
          - For each limit, if the value is set to '0' the corresponding count in the terraform plan must be zero.
          - For each limit, if the value is set to a positive integer 'N', the corresponding count in the terraform plan must be less than or equal to 'N'.

          Data:
            Type: YAML object with the following fields (all optional):
              - plan-max-count-add
                  integer, maximum number of resources to be added allowed in the terraform plan for automatic merging to occur.
              - plan-max-count-change
                  integer, maximum number of resources to be changed allowed in the terraform plan for automatic merging to occur.
              - plan-max-count-destroy
                  integer, maximum number of resources to be destroyed allowed in the terraform plan for automatic merging to occur.
              - plan-max-count-import
                  integer, maximum number of resources to be imported allowed in the terraform plan for automatic merging to occur.
              - plan-max-count-move
                  integer, maximum number of resources to be moved allowed in the terraform plan for automatic merging to occur.
              - plan-max-count-remove
                  integer, maximum number of resources to be removed allowed in the terraform plan for automatic merging to occur.
            Default:
              Is to allow non-destructive changes. I.e. only import and move operations allowed, no add/change/destroy/remove.

          NOTE: This applies to all environments, for single environment specify this directly in the environment specification.

          ALSO NOTE: If you specify this input as common for all environments, you must specify all fields. Values can still be overridden per environment.
        required: false
        default: |
          plan-max-count-add: 0
          plan-max-count-change: 0
          plan-max-count-destroy: 0
          plan-max-count-import: -1
          plan-max-count-move: -1
          plan-max-count-remove: 0
      pr-auto-merge-app-id:
        type: string
        description: |
          GitHub App ID for the app used to perform auto-merge operations.
          Required when 'pr-auto-merge-enabled' is true.

          NOTE: This setting applies to all environments, there is no per environment setting for this.
        required: false
        default: ""
      pr-auto-merge-app-private-key-secret:
        type: string
        description: |
          Name of the GitHub Actions secret containing the private key for the auto-merge GitHub App.
          The secret must be available to the calling workflow (via 'secrets: inherit').
          Required when 'pr-auto-merge-enabled' is true.

          This input holds the NAME of the secret, not the secret value itself.
          The actual secret value is resolved at runtime from the secrets passed to this workflow.

          Example:
            pr-auto-merge-app-private-key-secret: "MY_APP_PRIVATE_KEY"

          NOTE: This setting applies to all environments, there is no per environment setting for this.
        required: false
        default: ""
      runs-on:
        type: string
        description: |
          The runner group to run jobs on, see https://docs.github.com/en/actions/hosting-your-own-runners/about-self-hosted-runners#about-self-hosted-runners.

          This applies to all environments, if you need to specify this per environment, specify this directly in the environment specification.

          Note: some jobs are 'global' and thus always run on the group specified here, e.g. the 'create-matrix' job and the final 'terraform-conclusion' job.
        required: false
        default: "ubuntu-latest"

jobs:
  create-matrix:
    name: Create job matrix
    runs-on: ${{ inputs.runs-on }} # global setting
    permissions:
      contents: read      # checkout, and the compare endpoint for a push's changed files
      pull-requests: read # a pull request's changed files (docs/Path-relevance.md §4.4)
    defaults:
      run:
        shell: bash
    # Small values only. Every environment's verdict, the comment manifest and the decision record
    # travel in the 'relevance' artifact: a job output enters every downstream interpolation, and
    # nothing caps it.
    outputs:
      matrix-json: ${{ steps.create-matrix.outputs.matrix-json }}
      affected-count: ${{ steps.create-matrix.outputs.affected-count }}
      unaffected-count: ${{ steps.create-matrix.outputs.unaffected-count }}
      relevance-mode: ${{ steps.create-matrix.outputs.relevance-mode }}
      relevance-reason: ${{ steps.create-matrix.outputs.relevance-reason }}
      changed-count: ${{ steps.create-matrix.outputs.changed-count }}
      tests-matrix-json: ${{ steps.create-matrix.outputs.tests-matrix-json }}
      tests-count: ${{ steps.create-matrix.outputs.tests-count }}
      tests-active: ${{ steps.create-matrix.outputs.tests-active }}
    steps:
      - name: "🧹 Clean workspace"
        uses: dsb-norge/directory-recreate@v1
      - name: "⬇ Checkout working branch"
        uses: actions/checkout@v6
      - name: "🎰 Create env matrix"
        id: create-matrix
        uses: dsb-norge/github-actions-terraform/create-tf-vars-matrix@preview/pr-64-2978b0f
        with:
          inputs-json: ${{ toJSON(inputs) }}
      - name: "📦 Upload the relevance decision"
        uses: actions/upload-artifact@v7
        with:
          name: relevance
          path: ${{ steps.create-matrix.outputs.relevance-file }}

  # Pre-allocate per-group and per-env "head" comments at the top of the PR
  # conversation in a deterministic order. Heads are PATCHed in place across
  # runs (created_at fixes their position from run 1 onwards), so seeding here
  # — before any matrix job starts — is what guarantees the comment order
  # never flips between runs. Plan-extract "tag" cleanup is intentionally
  # NOT done here — it lives at the top of each matrix job instead, so it
  # still fires on "Re-run failed jobs" paths where this seed step may
  # already be `completed` and skipped on the re-run.
  # See docs/Workflow-pr-comments.md for the full heads + tags model.
  seed-pr-comments:
    if: |
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.fork == false
      && github.event.action != 'closed'
      && github.event.action != 'converted_to_draft'
    name: "Seed PR comment heads"
    needs: create-matrix
    runs-on: ${{ inputs.runs-on }} # global setting
    permissions:
      pull-requests: write
    defaults:
      run:
        shell: bash
    steps:
      - name: "📥 Download the relevance decision"
        uses: actions/download-artifact@v4
        with:
          name: relevance
          path: ${{ runner.temp }}/relevance
        continue-on-error: true # a missing manifest seeds nothing; the matrix jobs still post their heads
      - name: "📋 Read the head manifest"
        id: compose
        run: |
          # Hand the decision engine's heads and tag purges to the reconcile action as YAML
          #
          # The engine composed them with relevance (docs/Path-relevance.md §6.3): group heads
          # first, then one head per ungrouped commenting environment, a placeholder when it is
          # affected and its final "not affected" body when it is not. Reconcile POSTs in this
          # order, so on a fresh pull request it becomes the conversation's order.
          set -euo pipefail
          manifest="${RUNNER_TEMP}/relevance/relevance.json"
          if [ -f "${manifest}" ]; then
            heads_yml=$(jq '[.comments.heads[] | {marker, body}]' "${manifest}" | yq -P '.')
            gc_yml=$(jq '.comments.gc' "${manifest}" | yq -P '.')
          else
            echo "::warning title=Seed PR comment heads::The relevance decision is missing; no heads are seeded and no tags are purged."
            heads_yml='[]'
            gc_yml='[]'
          fi
          echo "Composed heads-yml:"
          printf '%s\n' "${heads_yml}"
          echo "Composed gc-yml:"
          printf '%s\n' "${gc_yml}"
          write_output() {
            local delim
            delim="EOF_$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
            printf '%s<<%s\n%s\n%s\n' "${1}" "${delim}" "${2}" "${delim}" >>"${GITHUB_OUTPUT}"
          }
          write_output heads-yml "${heads_yml}"
          write_output gc-yml "${gc_yml}"

      - name: "🌱 Seed heads"
        uses: dsb-norge/github-actions-terraform/pr-comments-reconcile@preview/pr-64-2978b0f
        with:
          repo: ${{ github.repository }}
          issue-number: ${{ github.event.pull_request.number }}
          github-token: ${{ github.token }}
          heads-yml: ${{ steps.compose.outputs.heads-yml }}
          # Only unaffected environments' tags. Each matrix job purges its own environment's
          # prior tags as its first commenting step, which holds when the seed is skipped on
          # "Re-run failed jobs"; purging an affected environment here would delete tags that
          # environments not re-run still show. An unaffected environment's job does not run, so
          # without this a plan from an earlier run would stay under a head saying "not affected".
          gc-yml: ${{ steps.compose.outputs.gc-yml }}
        continue-on-error: true # never fail the workflow over PR comment seeding

  terraform-ci-cd:
    name: "Terraform"
    # seed-pr-comments is in needs for ordering only: the heads must exist before any matrix job
    # upserts them. Its result is deliberately not tested: its steps never fail the job, it is
    # skipped on every event but pull_request, and a broken seed must not skip the matrix while
    # the conclusion stays green (docs/Path-relevance.md §5.3, P3). The status function
    # !cancelled() replaces the implicit success(), which a skipped seed would fail.
    #
    # The count keeps an empty matrix away from GitHub, which rejects one: a false job-level
    # condition is evaluated before the matrix, so no sentinel row is needed (P13).
    needs: [create-matrix, seed-pr-comments]
    if: |
      !cancelled()
      && needs.create-matrix.result == 'success'
      && needs.create-matrix.outputs.affected-count != '0'
    runs-on: ${{ matrix.vars.runs-on }}
    strategy:
      fail-fast: false # Allow jobs to continue even though one more env(s) fail
      matrix: ${{ fromJSON(needs.create-matrix.outputs.matrix-json) }}
    environment:
      name: ${{ matrix.vars.github-environment }}
      url: ${{ matrix.vars.url }}
    # One job at a time for a given environment. GitHub's default queue depth
    # is one: a third run entering the group cancels the pending one to take
    # its place, and the cancelled run's `Terraform conclusion` check fails,
    # indistinguishable from a real failure. That once dropped the run queued
    # behind a production apply in a calling repository. `queue: max` keeps
    # up to 100 pending runs in (best-effort) arrival order instead. It is
    # only valid together with cancel-in-progress false, which is what we
    # want anyway. The group is the bare environment name, shared by every
    # workflow in the calling repository that uses it.
    concurrency:
      group: ${{ matrix.vars.github-environment }}
      cancel-in-progress: false # never cancel an in-progress apply
      queue: max
    defaults:
      run:
        shell: bash
    steps:
      - name: "⬇ Checkout"
        uses: actions/checkout@v6

      # First post-checkout step so prior runs' plan-extract comments are
      # gone from the PR conversation within seconds of this attempt
      # starting, not after init+plan finishes. The heads sit at "Awaiting
      # results" (from the seed job) and the stale plan output disappears
      # immediately under them — instead of lingering for several minutes
      # while terraform-plan runs. Trade-off: if a later step crashes
      # before the post-plan-tag step runs, the env has no plan tag for
      # this attempt at all. Acceptable — stale plan output is a worse
      # signal than no plan output. Env-scoped marker prefix wipes plan
      # tags from any prior run AND any prior attempt of the current run.
      # Idempotent: pr-comment records action=not-found and returns
      # cleanly when there's nothing to delete (fresh first attempt).
      - name: 🧹 Purge prior plan tags for this env
        id: purge-plan-tags
        if: |
          matrix.vars.add-pr-comment == 'true'
          && github.event_name == 'pull_request'
          && github.event.action != 'closed'
          && github.event.action != 'converted_to_draft'
        uses: dsb-norge/github-actions-terraform/pr-comment@preview/pr-64-2978b0f
        with:
          repo: ${{ github.repository }}
          issue-number: ${{ github.event.pull_request.number }}
          github-token: ${{ github.token }}
          mode: delete
          marker: "<!-- tf:tag:plan:${{ matrix.vars.github-environment }}:"
        continue-on-error: true # allow job to continue, step outcome is ignored

      # Same for the three operation tags. pr-comment's delete matches by
      # substring, so every marker segment is terminated by ':' — without
      # the colon after 'destroy' this purge would also wipe the
      # destroy-plan tag (docs/Apply-and-destroy-reporting.md P8).
      - name: 🧹 Purge prior apply tags for this env
        id: purge-apply-tags
        if: |
          matrix.vars.add-pr-comment == 'true'
          && github.event_name == 'pull_request'
          && github.event.action != 'closed'
          && github.event.action != 'converted_to_draft'
        uses: dsb-norge/github-actions-terraform/pr-comment@preview/pr-64-2978b0f
        with:
          repo: ${{ github.repository }}
          issue-number: ${{ github.event.pull_request.number }}
          github-token: ${{ github.token }}
          mode: delete
          marker: "<!-- tf:tag:apply:${{ matrix.vars.github-environment }}:"
        continue-on-error: true
      - name: 🧹 Purge prior destroy-plan tags for this env
        id: purge-destroy-plan-tags
        if: |
          matrix.vars.add-pr-comment == 'true'
          && github.event_name == 'pull_request'
          && github.event.action != 'closed'
          && github.event.action != 'converted_to_draft'
        uses: dsb-norge/github-actions-terraform/pr-comment@preview/pr-64-2978b0f
        with:
          repo: ${{ github.repository }}
          issue-number: ${{ github.event.pull_request.number }}
          github-token: ${{ github.token }}
          mode: delete
          marker: "<!-- tf:tag:destroy-plan:${{ matrix.vars.github-environment }}:"
        continue-on-error: true
      - name: 🧹 Purge prior destroy tags for this env
        id: purge-destroy-tags
        if: |
          matrix.vars.add-pr-comment == 'true'
          && github.event_name == 'pull_request'
          && github.event.action != 'closed'
          && github.event.action != 'converted_to_draft'
        uses: dsb-norge/github-actions-terraform/pr-comment@preview/pr-64-2978b0f
        with:
          repo: ${{ github.repository }}
          issue-number: ${{ github.event.pull_request.number }}
          github-token: ${{ github.token }}
          mode: delete
          marker: "<!-- tf:tag:destroy:${{ matrix.vars.github-environment }}:"
        continue-on-error: true

      - name: "🎰 Export environment variables and secrets"
        uses: dsb-norge/github-actions-terraform/export-env-vars@preview/pr-64-2978b0f
        with:
          extra-envs: ${{ toJSON(matrix.vars.extra-envs) }}
          extra-envs-from-secrets: ${{ toJSON(matrix.vars.extra-envs-from-secrets) }}
          secrets-json: ${{ toJSON(secrets) }}

      # Resolves the effective environment for every goal into one file per
      # goal under $RUNNER_TEMP, and outputs that directory. The goal steps
      # below receive a path, never a payload — see
      # docs/Per-goal-environment-variables.md §3. This is the only step
      # besides export-env-vars that is handed the secrets bag.
      - name: "🎰 Resolve per-goal environment variables"
        id: goal-envs
        uses: dsb-norge/github-actions-terraform/resolve-goal-envs@preview/pr-64-2978b0f
        with:
          extra-envs: ${{ toJSON(matrix.vars.extra-envs) }}
          extra-envs-from-secrets: ${{ toJSON(matrix.vars.extra-envs-from-secrets) }}
          extra-envs-per-goal: ${{ toJSON(matrix.vars.extra-envs-per-goal) }}
          extra-envs-from-secrets-per-goal: ${{ toJSON(matrix.vars.extra-envs-from-secrets-per-goal) }}
          secrets-json: ${{ toJSON(secrets) }}

      - name: "🔑 Login to Azure"
        uses: azure/login@v3
        if: env.ARM_TENANT_ID != '' && env.ARM_SUBSCRIPTION_ID != '' && env.ARM_CLIENT_ID != ''
        with:
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}
          client-id: ${{ env.ARM_CLIENT_ID }}

      - name: "📥 Setup Terraform"
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ matrix.vars.terraform-version }}
          # workaround for extra gibberish in output https://github.com/hashicorp/setup-terraform/issues/20
          terraform_wrapper: false

      - name: "🗄️ Setup Terraform provider plugin cache"
        id: setup-terraform-cache
        uses: dsb-norge/github-actions-terraform/setup-terraform-plugin-cache@preview/pr-64-2978b0f

      - name: "📥 Setup TFLint"
        id: setup-tflint
        if: contains(matrix.vars.goals, 'all') || contains(matrix.vars.goals, 'lint')
        uses: dsb-norge/github-actions-terraform/setup-tflint@preview/pr-64-2978b0f
        with:
          tflint-version: ${{ matrix.vars.tflint-version }}
          working-directory: ${{ matrix.vars.project-dir }}

      - name: "🚀 Cache Terraform provider plugins"
        if: contains(matrix.vars.goals, 'all') || contains(matrix.vars.goals, 'init')
        uses: actions/cache@v5
        with:
          path: ${{ steps.setup-terraform-cache.outputs.plugin-cache-directory }}
          key: "terraform-provider-plugin-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('{0}/.terraform.lock.hcl', matrix.vars.project-dir)) }}"

      # Works out which of this environment's terraform directories can have
      # their downloaded modules re-used from an earlier run, and what cache key
      # identifies that set of modules.
      #
      # A directory only qualifies if every module it ends up using is pinned to
      # something fixed (an exact version, a tag, a commit). A module that
      # follows a git branch disqualifies it, because a re-used copy would go on
      # being used unchanged after the branch had moved on.
      #
      # "Ends up using" includes modules reached indirectly: an environment that
      # only says source = "../../main" still downloads everything main pulls in,
      # so those are examined too.
      #
      # The steps below all key off this one — when it decides nothing can be
      # cached, or it is skipped entirely, they skip too.
      #
      # Full details: docs/Terraform-module-cache.md
      - name: "🗄️ Resolve terraform module cache"
        id: module-cache
        if: |
          matrix.vars.cache-terraform-modules == 'true'
          && (contains(matrix.vars.goals, 'all') || contains(matrix.vars.goals, 'init'))
        uses: dsb-norge/github-actions-terraform/terraform-module-cache@preview/pr-64-2978b0f
        with:
          phase: resolve
          project-dir: ${{ matrix.vars.project-dir }}
          additional-dirs-json: ${{ toJSON(matrix.vars.terraform-init-additional-dirs) }}
          environment: ${{ matrix.vars.environment }}
          # 'terraform init' installs the run-block modules of test files in a tests/ directory beside the
          # environment too, so the cache must audit them (docs/Terraform-tests.md P37).
          test-directory: tests
        continue-on-error: true # caching is an optimisation, never a reason to fail a run

      # Puts previously downloaded modules back on disk, but only on an exact
      # key match - meaning this environment is using precisely the same set of
      # modules as the run that saved them. There is intentionally no partial
      # match: a close-enough cache would carry along modules that are no longer
      # used, and nothing would ever remove them again.
      #
      # A miss is not a problem, it just means init downloads as it does today.
      - name: "🚀 Restore terraform module cache"
        id: restore-module-cache
        if: steps.module-cache.outputs.cache-enabled == 'true'
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.module-cache.outputs.cache-paths }}
          key: ${{ steps.module-cache.outputs.cache-key }}
        continue-on-error: true # caching is an optimisation, never a reason to fail a run

      # Notes down which modules the cache just supplied, so the step after init
      # can tell whether init had to change anything. Does nothing when there
      # was no cache to restore.
      - name: "📸 Snapshot restored module manifests"
        id: snapshot-module-cache
        if: steps.module-cache.outputs.cache-enabled == 'true'
        uses: dsb-norge/github-actions-terraform/terraform-module-cache@preview/pr-64-2978b0f
        with:
          phase: snapshot
          cache-paths: ${{ steps.module-cache.outputs.cache-paths }}
          cache-hit: ${{ steps.restore-module-cache.outputs.cache-hit }}
        continue-on-error: true # only feeds a warning; must never block init

      - name: ⚙️ Terraform Init
        id: init
        if: contains(matrix.vars.goals, 'all') || contains(matrix.vars.goals, 'init')
        uses: dsb-norge/github-actions-terraform/terraform-init@preview/pr-64-2978b0f
        with:
          working-directory: ${{ matrix.vars.project-dir }}
          environment-name: ${{ matrix.vars.github-environment }}
          additional-dirs-json: ${{ toJSON(matrix.vars.terraform-init-additional-dirs) }}
          plugin-cache-directory: ${{ steps.setup-terraform-cache.outputs.plugin-cache-directory }}
          extra-envs-file: ${{ steps.goal-envs.outputs.envs-dir }}/init.json
          # Authenticates the 'git clone' calls terraform makes for remote
          # modules. Anonymous clones are charged to a 60/hour per-IP budget
          # that every runner behind the same NAT address shares, and a module
          # set of any size exhausts it — see the action's 'github-token' input.
          github-token: ${{ github.token }}
        continue-on-error: true # allow job to continue, step outcome is evaluated later

      # Answers two questions from the modules init actually ended up with:
      #
      #   1. Did init have to fetch something the cache did not supply, even
      #      though the key matched? That means the key is not describing this
      #      environment's modules properly and the cache is doing no good, so
      #      it is called out in the log.
      #
      #   2. Does anything in there follow a moving target such as a git branch?
      #      This is the first point where modules pulled in by other modules can
      #      be seen, so it can catch what the step before init could not. If so,
      #      these modules must not be stored for re-use at all.
      - name: "🔍 Check terraform module cache"
        id: post-init-check
        if: steps.module-cache.outputs.cache-enabled == 'true'
        uses: dsb-norge/github-actions-terraform/terraform-module-cache@preview/pr-64-2978b0f
        with:
          phase: verify
          cache-paths: ${{ steps.module-cache.outputs.cache-paths }}
          cache-hit: ${{ steps.restore-module-cache.outputs.cache-hit }}
          snapshot-dir: ${{ steps.snapshot-module-cache.outputs.snapshot-dir }}
        continue-on-error: true # if this cannot run, safe-to-save stays unset and nothing is saved

      # Terraform installs a module with a git source by cloning it, and the
      # clone's '.git' stays behind afterwards — for one AVM module that is
      # 932 KiB of the 1.5 MiB installed. Terraform never reads it again, so it
      # comes off before the archive is made rather than being carried into
      # every restore.
      #
      # Conditioned exactly like the save below: a run that is not saving keeps
      # its module trees exactly as init produced them.
      - name: "🧹 Prune git metadata from the module cache"
        id: prune-module-cache
        if: |
          steps.module-cache.outputs.cache-enabled == 'true'
          && steps.init.outcome == 'success'
          && steps.restore-module-cache.outputs.cache-hit != 'true'
          && steps.post-init-check.outputs.safe-to-save == 'true'
        uses: dsb-norge/github-actions-terraform/terraform-module-cache@preview/pr-64-2978b0f
        with:
          phase: prune
          cache-paths: ${{ steps.module-cache.outputs.cache-paths }}
        continue-on-error: true # a prune that cannot run must not stop the save

      # Stores the modules for the next run, when init succeeded, nothing was
      # stored under this key already, and the check above found nothing that
      # can move.
      #
      # This sits here, right after init, rather than at the end of the job on
      # purpose: the later steps (plan and apply especially) can write files
      # inside the module directories, and those files must not end up being
      # handed to a future run as if init had produced them.
      - name: "💾 Save terraform module cache"
        if: |
          steps.module-cache.outputs.cache-enabled == 'true'
          && steps.init.outcome == 'success'
          && steps.restore-module-cache.outputs.cache-hit != 'true'
          && steps.post-init-check.outputs.safe-to-save == 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.module-cache.outputs.cache-paths }}
          key: ${{ steps.module-cache.outputs.cache-key }}
        continue-on-error: true # a lost cache write must not fail the run

      # Verify the committed .terraform.lock.hcl covers all required platforms.
      # Only runs on PR events — once merged to the default branch the
      # verification has already happened at PR-time, so push/dispatch/schedule
      # runs skip this step. Can be disabled globally or per-env via the
      # 'verify-lock-file' workflow input / env setting.
      - name: "🔒 Verify lock file platform coverage"
        id: verify-lock
        if: |
          matrix.vars.verify-lock-file == 'true'
          && steps.init.outcome == 'success'
          && github.event_name == 'pull_request'
          && github.event.action != 'closed'
          && github.event.action != 'converted_to_draft'
        uses: dsb-norge/github-actions-terraform/verify-terraform-lock@preview/pr-64-2978b0f
        with:
          working-directory: ${{ matrix.vars.project-dir }}
        continue-on-error: true # allow job to continue, step outcome is evaluated later

      - name: 🖌 Terraform Format
        id: fmt
        if: contains(matrix.vars.goals, 'all') || contains(matrix.vars.goals, 'format')
        uses: dsb-norge/github-actions-terraform/terraform-fmt@preview/pr-64-2978b0f
        with:
          working-directory: ${{ matrix.vars.project-dir }}
          format-check-in-root-dir: ${{ matrix.vars.format-check-in-root-dir }}
          extra-envs-file: ${{ steps.goal-envs.outputs.envs-dir }}/format.json
        continue-on-error: true # allow job to continue, step outcome is evaluated later

      - name: ✔ Terraform Validate
        id: validate
        if: contains(matrix.vars.goals, 'all') || contains(matrix.vars.goals, 'validate')
        uses: dsb-norge/github-actions-terraform/terraform-validate@preview/pr-64-2978b0f
        with:
          working-directory: ${{ matrix.vars.project-dir }}
          environment-name: ${{ matrix.vars.github-environment }}
          extra-envs-file: ${{ steps.goal-envs.outputs.envs-dir }}/validate.json
        continue-on-error: true # allow job to continue, step outcome is evaluated later

      - name: 🧹 Lint with TFLint
        id: lint
        if: contains(matrix.vars.goals, 'all') || contains(matrix.vars.goals, 'lint')
        uses: dsb-norge/github-actions-terraform/lint-with-tflint@preview/pr-64-2978b0f
        with:
          working-directory: ${{ matrix.vars.project-dir }}
          extra-envs-file: ${{ steps.goal-envs.outputs.envs-dir }}/lint.json
        continue-on-error: true # allow job to continue, step outcome is evaluated later

      - name: 📖 Terraform Plan
        id: plan
        if: steps.init.outcome == 'success' && ( contains(matrix.vars.goals, 'all') || contains(matrix.vars.goals, 'plan') )
        uses: dsb-norge/github-actions-terraform/terraform-plan@preview/pr-64-2978b0f
        with:
          working-directory: ${{ matrix.vars.project-dir }}
          environment-name: ${{ matrix.vars.github-environment }}
          extra-envs-file: ${{ steps.goal-envs.outputs.envs-dir }}/plan.json
        continue-on-error: true # allow job to continue, step outcome is evaluated later

      - name: "🔍 Parse terraform plan"
        id: parse-plan
        if: steps.plan.outcome != 'cancelled' && steps.plan.outcome != 'skipped'
        uses: dsb-norge/github-actions-terraform/parse-terraform-plan@preview/pr-64-2978b0f
        with:
          plan-console-file: ${{ steps.plan.outputs.console-output-file }}
        continue-on-error: true # allow job to continue, step outcome is ignored

      # Warning extraction — one parse-terraform-warnings invocation per step
      # whose console output got captured. Three invocations rather than one
      # consolidated scan so each gets its own 10-annotation GHA budget;
      # consolidating would mean a noisy init crowds out plan-warning
      # annotations. Each emits one ::warning per detected block (with
      # file=/line= when source context is present) and writes a markdown
      # body file for embedding in the PR plan-tag comment.
      # See docs/Plan-warnings.md.
      - name: "⚠️ Parse init warnings"
        id: parse-init-warnings
        if: always() && steps.init.outputs.console-output-file != ''
        uses: dsb-norge/github-actions-terraform/parse-terraform-warnings@preview/pr-64-2978b0f
        with:
          console-output-file: ${{ steps.init.outputs.console-output-file }}
          step-label: init
          environment-name: ${{ matrix.vars.github-environment }}
        continue-on-error: true # allow job to continue, step outcome is ignored

      - name: "⚠️ Parse validate warnings"
        id: parse-validate-warnings
        if: always() && steps.validate.outputs.console-output-file != ''
        uses: dsb-norge/github-actions-terraform/parse-terraform-warnings@preview/pr-64-2978b0f
        with:
          console-output-file: ${{ steps.validate.outputs.console-output-file }}
          step-label: validate
          environment-name: ${{ matrix.vars.github-environment }}
        continue-on-error: true

      - name: "⚠️ Parse plan warnings"
        id: parse-plan-warnings
        if: always() && steps.plan.outputs.console-output-file != ''
        uses: dsb-norge/github-actions-terraform/parse-terraform-warnings@preview/pr-64-2978b0f
        with:
          console-output-file: ${{ steps.plan.outputs.console-output-file }}
          step-label: plan
          environment-name: ${{ matrix.vars.github-environment }}
        continue-on-error: true

      # Aggregate the three per-step parse-terraform-warnings outputs into
      # a single markdown file (init → validate → plan order) plus a single
      # warning-count integer that's the sum across all three steps.
      # Done as one shell step because GHA workflow expressions don't
      # support arithmetic — '+' between fromJSON() calls is rejected by
      # the expression parser. Empty / missing per-step files are skipped
      # so the concatenation also works when an upstream step didn't run
      # (e.g. plan skipped because init failed).
      - name: "⚠️ Aggregate warnings (concat + sum)"
        id: concat-warnings-md
        if: always()
        shell: bash
        env:
          init_md: ${{ steps.parse-init-warnings.outputs.warnings-markdown-file }}
          validate_md: ${{ steps.parse-validate-warnings.outputs.warnings-markdown-file }}
          plan_md: ${{ steps.parse-plan-warnings.outputs.warnings-markdown-file }}
          init_count: ${{ steps.parse-init-warnings.outputs.warning-count }}
          validate_count: ${{ steps.parse-validate-warnings.outputs.warning-count }}
          plan_count: ${{ steps.parse-plan-warnings.outputs.warning-count }}
          env_name: ${{ matrix.vars.github-environment }}
        run: |
          out="${GITHUB_WORKSPACE}/tf-warnings-${env_name}.md"
          : > "${out}"
          for f in "${init_md}" "${validate_md}" "${plan_md}"; do
            if [ -n "${f}" ] && [ -s "${f}" ]; then
              cat "${f}" >> "${out}"
            fi
          done
          # Sum the per-step counts. Treat empty/non-numeric values as 0
          # so a missing step output never breaks the arithmetic.
          total=0
          for c in "${init_count}" "${validate_count}" "${plan_count}"; do
            if [[ "${c}" =~ ^[0-9]+$ ]]; then
              total=$((total + c))
            fi
          done
          echo "warnings-markdown-file=${out}" >> "${GITHUB_OUTPUT}"
          echo "warning-count=${total}" >> "${GITHUB_OUTPUT}"

      - name: 📝 Create validation summary
        id: create-validation-summary
        # always() so the comment refreshes even when an earlier infrastructure
        # step (setup-tflint, azure/login, plugin-cache fetch, ...) fails. Skipped
        # earlier steps surface as steps.<id>.outcome == '' and render as
        # <kbd></kbd> in the validation table — better than leaving a stale
        # comment from the previous run on the PR.
        if: |
          always()
          && matrix.vars.add-pr-comment == 'true'
          && github.event_name == 'pull_request'
          && github.event.action != 'closed'
          && github.event.action != 'converted_to_draft'
        uses: dsb-norge/github-actions-terraform/create-validation-summary@preview/pr-64-2978b0f
        with:
          environment-name: ${{ matrix.vars.github-environment }}
          plan-txt-output-file: ${{ steps.plan.outputs.txt-output-file }} # created by terraform by parsing the plan file, not available when plan fails
          plan-console-file: ${{ steps.plan.outputs.console-output-file }} # captured from console output, possibly available even if plan fails
          status-init: ${{ steps.init.outcome }}
          status-verify-lock: ${{ steps.verify-lock.outcome }}
          status-fmt: ${{ steps.fmt.outcome }}
          status-validate: ${{ steps.validate.outcome }}
          status-lint: ${{ steps.lint.outcome }}
          status-plan: ${{ steps.plan.outcome }}
          # When non-empty, omits the validation table from the per-env comment
          # body (it appears in the per-group comment instead). See docs/Workflow-pr-comments.md §3.2.
          pr-comment-group: ${{ matrix.vars.pr-comment-group }}
          # include details when parse step actually returned data
          include-plan-details: ${{ steps.parse-plan.outcome == 'success' }}
          plan-count-add: ${{ steps.parse-plan.outputs.count-add }}
          plan-count-change: ${{ steps.parse-plan.outputs.count-change }}
          plan-count-destroy: ${{ steps.parse-plan.outputs.count-destroy }}
          plan-count-import: ${{ steps.parse-plan.outputs.count-import }}
          plan-count-move: ${{ steps.parse-plan.outputs.count-move }}
          plan-count-remove: ${{ steps.parse-plan.outputs.count-remove }}
          # Used by create-validation-summary to short-circuit the plan-extract
          # block: 'Plan: no changes ✅' when total==0 and no output-only changes,
          # '<details>Plan: N changes ℹ️' when >0, '<details>Plan: output-only
          # changes ℹ️' when total==0 but outputs changed, legacy fallback when
          # count is missing/'?' (see docs/Workflow-pr-comments.md).
          plan-count-total: ${{ steps.parse-plan.outputs.count-total }}
          plan-has-output-only-changes: ${{ steps.parse-plan.outputs.has-output-only-changes }}
          # Wall-clock duration of the terraform plan command (mm:ss). Always
          # populated by terraform-plan@v0 — even when plan fails — so the
          # Plan time row in the PR comment surfaces "slow + failing" at a
          # glance instead of forcing a click into the job log.
          plan-time: ${{ steps.plan.outputs.plan-time }}
          # Warning surfaces — see docs/Plan-warnings.md. warning-count is the
          # sum across init+validate+plan (each parse-terraform-warnings
          # invocation emits its own count). The markdown file holds the
          # rendered warning bodies; create-validation-summary appends them
          # as a <details> collapser inside the plan-tag comment, with
          # warnings taking priority over plan-extract in the 65k budget.
          warning-count: ${{ steps.concat-warnings-md.outputs.warning-count }}
          warnings-markdown-file: ${{ steps.concat-warnings-md.outputs.warnings-markdown-file }}
          # Mode row and plan-tag banner are goal-driven, so they are part
          # of the very first render — the warning is on the PR before the
          # apply has happened (docs/Apply-and-destroy-reporting.md §8.2).
          goals-json: ${{ toJSON(matrix.vars.goals) }}
          # Distinct per invocation within the job — see the upsert-head
          # step's fallback and docs/Apply-and-destroy-reporting.md P12.
          output-file-suffix: phase1
        continue-on-error: true # allow job to continue, step outcome is ignored

      - name: 📋 Post per-env plan-extract tag
        id: post-plan-tag
        # POST fresh — the 'Purge prior plan tags' step at the top of the
        # matrix job wiped every existing plan tag for this env minutes
        # ago, so pr-comment's upsert resolves to a fresh POST here.
        # Marker is run-id + attempt scoped so the per-group head's Links
        # anchor (resolved by aggregate-validation-summaries via env-prefix
        # lookup) can find this specific run/attempt's tag. Posted BEFORE
        # the per-env head so the head's Links row can anchor at this
        # comment's id.
        if: always() && steps.create-validation-summary.outcome == 'success'
        uses: dsb-norge/github-actions-terraform/pr-comment@preview/pr-64-2978b0f
        with:
          repo: ${{ github.repository }}
          issue-number: ${{ github.event.pull_request.number }}
          github-token: ${{ github.token }}
          mode: upsert
          marker: "<!-- tf:tag:plan:${{ matrix.vars.github-environment }}:run-id-${{ github.run_id }}:attempt-${{ github.run_attempt }} -->"
          body-file: ${{ steps.create-validation-summary.outputs.plan-extract-file }}
        continue-on-error: true # allow job to continue, step outcome is ignored

      - name: 📝 Re-render validation summary with Links row
        id: create-validation-summary-final
        # Second invocation of create-validation-summary, this time with the
        # just-POSTed plan-extract tag's comment id supplied. The action
        # responds by appending a Links row to the head-summary table
        # ([log extract] → plan tag, [job log] → this job's #logs anchor)
        # and dropping the standalone [Job log] footer. See
        # docs/Workflow-pr-comments.md §6.1.
        #
        # Only ungrouped envs need this — grouped envs have no per-env head
        # so the head-summary output is unused. The plan-extract output of
        # this second call is identical to the first call's and is ignored.
        if: |
          always()
          && matrix.vars.add-pr-comment == 'true'
          && github.event_name == 'pull_request'
          && github.event.action != 'closed'
          && github.event.action != 'converted_to_draft'
          && matrix.vars.pr-comment-group == ''
        uses: dsb-norge/github-actions-terraform/create-validation-summary@preview/pr-64-2978b0f
        with:
          environment-name: ${{ matrix.vars.github-environment }}
          plan-txt-output-file: ${{ steps.plan.outputs.txt-output-file }}
          plan-console-file: ${{ steps.plan.outputs.console-output-file }}
          status-init: ${{ steps.init.outcome }}
          status-verify-lock: ${{ steps.verify-lock.outcome }}
          status-fmt: ${{ steps.fmt.outcome }}
          status-validate: ${{ steps.validate.outcome }}
          status-lint: ${{ steps.lint.outcome }}
          status-plan: ${{ steps.plan.outcome }}
          pr-comment-group: ${{ matrix.vars.pr-comment-group }}
          include-plan-details: ${{ steps.parse-plan.outcome == 'success' }}
          plan-count-add: ${{ steps.parse-plan.outputs.count-add }}
          plan-count-change: ${{ steps.parse-plan.outputs.count-change }}
          plan-count-destroy: ${{ steps.parse-plan.outputs.count-destroy }}
          plan-count-import: ${{ steps.parse-plan.outputs.count-import }}
          plan-count-move: ${{ steps.parse-plan.outputs.count-move }}
          plan-count-remove: ${{ steps.parse-plan.outputs.count-remove }}
          plan-count-total: ${{ steps.parse-plan.outputs.count-total }}
          plan-has-output-only-changes: ${{ steps.parse-plan.outputs.has-output-only-changes }}
          plan-time: ${{ steps.plan.outputs.plan-time }}
          # Mirror the warning inputs from the first invocation so the
          # re-rendered head also carries the ⚠️ Warnings row. Without this
          # the second render would drop the warnings row from the head
          # body that ultimately PATCHes the per-env head.
          warning-count: ${{ steps.concat-warnings-md.outputs.warning-count }}
          warnings-markdown-file: ${{ steps.concat-warnings-md.outputs.warnings-markdown-file }}
          # The input that differs from the first call. Triggers the Links
          # row branch in render_head_summary.
          plan-tag-comment-id: ${{ steps.post-plan-tag.outputs.comment-id }}
          goals-json: ${{ toJSON(matrix.vars.goals) }}
          output-file-suffix: phase1-final
        continue-on-error: true

      - name: 🏷️ Upsert per-env head comment
        id: upsert-head
        # Only ungrouped envs get a per-env head; grouped envs are
        # represented in their per-group head and skip this step (every env
        # still gets its plan-extract tag above). See
        # docs/Workflow-pr-comments.md §6.1 grouped mode.
        #
        # Consumes the head body file from the *second*
        # create-validation-summary call (which carries the Links row).
        # Falls back to the first call's file if the second call didn't run
        # (e.g. degraded), so a transient failure mid-pipeline still updates
        # the head with the best body we have. The two files have distinct
        # suffixes (phase1 / phase1-final) precisely so this fallback can
        # never resolve to a path the later call overwrote — see
        # docs/Apply-and-destroy-reporting.md P12.
        #
        # always() so that, paired with the always() on create-validation-summary
        # above, the per-env head refreshes even when an earlier infrastructure
        # step fails. Without it the head would stay frozen at the previous run's
        # state. Marker-based upsert (PATCH-in-place) preserves created_at so
        # the head keeps its position at the top of the PR conversation across
        # runs.
        if: |
          always()
          && steps.create-validation-summary.outcome == 'success'
          && matrix.vars.pr-comment-group == ''
        uses: dsb-norge/github-actions-terraform/pr-comment@preview/pr-64-2978b0f
        with:
          repo: ${{ github.repository }}
          issue-number: ${{ github.event.pull_request.number }}
          github-token: ${{ github.token }}
          mode: upsert
          marker: "<!-- tf:head:env:${{ matrix.vars.github-environment }} -->"
          body-file: ${{ steps.create-validation-summary-final.outputs.head-summary-file || steps.create-validation-summary.outputs.head-summary-file }}
        continue-on-error: true # allow job to continue, step outcome is ignored

      # Terminate the job with 'failure' if any validation check did not succeed.
      # If 'allow-failing-terraform-operations' is 'true' for the environment the job will not terminate.

      - name: "🧐 Validation outcome: ⚙️ Init"
        if: contains(matrix.vars.goals, 'all') || contains(matrix.vars.goals, 'init')
        run: |
          if [ ! "${{ steps.init.outcome }}" == 'success' ]; then
            echo "::error title=Init failed::Outcome of terraform init step was '${{ steps.init.outcome }}' for environment '${{ matrix.vars.github-environment }}'!"
            exit 1
          fi
        # do not terminate if configured to ignore, fromJSON ensures bool
        continue-on-error: ${{ fromJSON(matrix.vars.allow-failing-terraform-operations) }}
      - name: "🧐 Validation outcome: 🔒 Lock file"
        # Only checked when verify-lock actually ran (lock file verification
        # enabled, PR event, init succeeded).
        if: |
          matrix.vars.verify-lock-file == 'true'
          && steps.init.outcome == 'success'
          && github.event_name == 'pull_request'
          && github.event.action != 'closed'
          && github.event.action != 'converted_to_draft'
        run: |
          if [ ! "${{ steps.verify-lock.outcome }}" == 'success' ]; then
            echo "::error title=Lock file verification failed::Outcome of lock file verification step was '${{ steps.verify-lock.outcome }}' for environment '${{ matrix.vars.github-environment }}'!"
            exit 1
          fi
        # do not terminate if configured to ignore, fromJSON ensures bool
        continue-on-error: ${{ fromJSON(matrix.vars.allow-failing-terraform-operations) }}
      - name: "🧐 Validation outcome: 🖌 Format"
        if: contains(matrix.vars.goals, 'all') || contains(matrix.vars.goals, 'format')
        run: |
          if [ ! "${{ steps.fmt.outcome }}" == 'success' ]; then
            echo "::error title=Format check failed::Outcome of terraform fmt step was '${{ steps.fmt.outcome }}' for environment '${{ matrix.vars.github-environment }}'!"
            exit 1
          fi
        # do not terminate if configured to ignore, fromJSON ensures bool
        continue-on-error: ${{ fromJSON(matrix.vars.allow-failing-terraform-operations) }}
      - name: "🧐 Validation outcome: ✔ Validate"
        if: contains(matrix.vars.goals, 'all') || contains(matrix.vars.goals, 'validate')
        run: |
          if [ ! "${{ steps.validate.outcome }}" == 'success' ]; then
            echo "::error title=Validate failed::Outcome of terraform validate step was '${{ steps.validate.outcome }}' for environment '${{ matrix.vars.github-environment }}'!"
            exit 1
          fi
        # do not terminate if configured to ignore, fromJSON ensures bool
        continue-on-error: ${{ fromJSON(matrix.vars.allow-failing-terraform-operations) }}
      - name: "🧐 Validation outcome: 🧹 TFLint"
        if: contains(matrix.vars.goals, 'all') || contains(matrix.vars.goals, 'lint')
        run: |
          if [ ! "${{ steps.lint.outcome }}" == 'success' ]; then
            echo "::error title=Lint failed::Outcome of TFLint step was '${{ steps.lint.outcome }}' for environment '${{ matrix.vars.github-environment }}'!"
            exit 1
          fi
        # do not terminate if configured to ignore, fromJSON ensures bool
        continue-on-error: ${{ fromJSON(matrix.vars.allow-failing-terraform-operations) }}
      - name: "🧐 Validation outcome: 📖 Plan"
        if: contains(matrix.vars.goals, 'all') || contains(matrix.vars.goals, 'plan')
        run: |
          if [ ! "${{ steps.plan.outcome }}" == 'success' ]; then
            echo "::error title=Plan failed::Outcome of terraform plan step was '${{ steps.plan.outcome }}' for environment '${{ matrix.vars.github-environment }}'!"
            exit 1
          fi
        # do not terminate if configured to ignore, fromJSON ensures bool
        continue-on-error: ${{ fromJSON(matrix.vars.allow-failing-terraform-operations) }}

      - name: 🐙 Terraform Apply
        id: apply
        # Run step when:
        #   - plan succeeded AND:
        #     1. one of the goals [all, apply]
        #        AND push or manual on default branch
        #     2. goal 'apply-on-pr'
        #        AND pull request to default branch
        #        except when PR is being closed or converted to draft
        if: |
          steps.plan.outcome == 'success'
          && (
            ( ( contains(matrix.vars.goals, 'all') || contains(matrix.vars.goals, 'apply') )
              && ( github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' )
              && matrix.vars.caller-repo-is-on-default-branch == 'true'
            ) || (
              contains(matrix.vars.goals, 'apply-on-pr')
              && github.event_name == 'pull_request'
              && github.event.action != 'closed'
              && github.event.action != 'converted_to_draft'
              && github.base_ref == matrix.vars.caller-repo-default-branch
          ) )
        uses: dsb-norge/github-actions-terraform/terraform-apply@preview/pr-64-2978b0f
        with:
          working-directory: ${{ matrix.vars.project-dir }}
          terraform-plan-file: ${{ steps.plan.outputs.terraform-plan-file }}
          # Names the console file. The destroy step below shares this action
          # and passes '<env>-destroy', so the two files never collide.
          environment-name: ${{ matrix.vars.github-environment }}
          extra-envs-file: ${{ steps.goal-envs.outputs.envs-dir }}/apply.json
        # do not terminate if configured to ignore, fromJSON ensures bool
        continue-on-error: ${{ fromJSON(matrix.vars.allow-failing-terraform-operations) }}

      # Counts from the 'Apply complete!' line plus a tick-free copy of the
      # console for the PR comment. Runs whenever apply ran, including on
      # failure — a failed apply has no summary line, and the parser reports
      # that as '?' / completed=false rather than as zeros.
      #
      # always() is load-bearing here and on the other two parse steps, and
      # it is a difference from parse-plan: plan runs with continue-on-error
      # true, so a failed plan never fails the job and parse-plan's plain
      # if: is enough. apply's continue-on-error is allow-failing-terraform-
      # operations (default false), so a failed apply fails the job on the
      # spot — and an if: without always() is then skipped even when it
      # evaluates true. Without always() the first real failed apply lost
      # its counts and its console, and the apply tag read 'not available'
      # (docs/Apply-and-destroy-reporting.md P31).
      - name: "🔍 Parse terraform apply"
        id: parse-apply
        if: always() && steps.apply.outcome != 'cancelled' && steps.apply.outcome != 'skipped'
        uses: dsb-norge/github-actions-terraform/parse-terraform-apply@preview/pr-64-2978b0f
        with:
          apply-console-file: ${{ steps.apply.outputs.console-output-file }}
          # The exit code is the outcome; the parser only reads it to warn
          # when a successful apply's console was not recognised (§14).
          apply-exitcode: ${{ steps.apply.outputs.exitcode }}
        continue-on-error: true # allow job to continue, step outcome is ignored

      # Fourth warning count, kept separate from the init+validate+plan sum:
      # the head row and the bodies live in the apply block / apply tag, so
      # the number stays attributable to the comment it came from
      # (docs/Apply-and-destroy-reporting.md §7.7, P18).
      - name: "⚠️ Parse apply warnings"
        id: parse-apply-warnings
        if: always() && steps.apply.outputs.console-output-file != ''
        uses: dsb-norge/github-actions-terraform/parse-terraform-warnings@preview/pr-64-2978b0f
        with:
          console-output-file: ${{ steps.apply.outputs.console-output-file }}
          step-label: apply
          environment-name: ${{ matrix.vars.github-environment }}
        continue-on-error: true

      - name: ☠📖 Terraform Destroy Plan
        id: destroy-plan
        if: |
          steps.init.outcome == 'success'
          && contains(matrix.vars.goals, 'destroy-plan')
        uses: dsb-norge/github-actions-terraform/terraform-plan@preview/pr-64-2978b0f
        with:
          working-directory: ${{ matrix.vars.project-dir }}
          environment-name: "${{ matrix.vars.github-environment }}-destroy"
          extra-plan-args: -destroy
          extra-envs-file: ${{ steps.goal-envs.outputs.envs-dir }}/destroy-plan.json
        # do not terminate if configured to ignore, fromJSON ensures bool
        continue-on-error: ${{ fromJSON(matrix.vars.allow-failing-terraform-operations) }}

      # The step id is load-bearing: evaluate-automerge-eligibility reads
      # .steps["parse-destroy-plan"].outputs.count-* out of the captured
      # metadata by this literal name. Before this step existed every
      # destroy-plan-max-count-* auto-merge limit compared against an empty
      # string and was never enforced (docs/Apply-and-destroy-reporting.md
      # §5.1, P7). Renaming it re-breaks that silently.
      - name: "🔍 Parse terraform destroy plan"
        id: parse-destroy-plan
        if: always() && steps.destroy-plan.outcome != 'cancelled' && steps.destroy-plan.outcome != 'skipped'
        uses: dsb-norge/github-actions-terraform/parse-terraform-plan@preview/pr-64-2978b0f
        with:
          plan-console-file: ${{ steps.destroy-plan.outputs.console-output-file }}
        continue-on-error: true # allow job to continue, step outcome is ignored

      - name: "⚠️ Parse destroy-plan warnings"
        id: parse-destroy-plan-warnings
        if: always() && steps.destroy-plan.outputs.console-output-file != ''
        uses: dsb-norge/github-actions-terraform/parse-terraform-warnings@preview/pr-64-2978b0f
        with:
          console-output-file: ${{ steps.destroy-plan.outputs.console-output-file }}
          step-label: destroy-plan
          environment-name: ${{ matrix.vars.github-environment }}
        continue-on-error: true

      - name: ☠ Terraform Destroy
        id: destroy
        # Run step when:
        #   - destroy plan succeeded AND:
        #     1. goal 'destroy'
        #        AND push or manual on default branch
        #     2. goal 'destroy-on-pr'
        #        AND pull request to default branch
        #        except when PR is being closed or converted to draft
        if: |
          steps.destroy-plan.outcome == 'success'
          && (
            ( contains(matrix.vars.goals, 'destroy')
              && ( github.event_name == 'push' || github.event_name == 'workflow_dispatch' )
              && matrix.vars.caller-repo-is-on-default-branch == 'true'
            ) || (
              contains(matrix.vars.goals, 'destroy-on-pr')
              && github.event_name == 'pull_request'
              && github.event.action != 'closed'
              && github.event.action != 'converted_to_draft'
              && github.base_ref == matrix.vars.caller-repo-default-branch
          ) )
        uses: dsb-norge/github-actions-terraform/terraform-apply@preview/pr-64-2978b0f
        with:
          working-directory: ${{ matrix.vars.project-dir }}
          terraform-plan-file: ${{ steps.destroy-plan.outputs.terraform-plan-file }}
          # '<env>-destroy', matching the destroy-plan step above, so this
          # console file does not overwrite the apply step's.
          environment-name: "${{ matrix.vars.github-environment }}-destroy"
          extra-envs-file: ${{ steps.goal-envs.outputs.envs-dir }}/destroy.json
        # do not terminate if configured to ignore, fromJSON ensures bool
        continue-on-error: ${{ fromJSON(matrix.vars.allow-failing-terraform-operations) }}

      - name: "🔍 Parse terraform destroy"
        id: parse-destroy-apply
        if: always() && steps.destroy.outcome != 'cancelled' && steps.destroy.outcome != 'skipped'
        uses: dsb-norge/github-actions-terraform/parse-terraform-apply@preview/pr-64-2978b0f
        with:
          apply-console-file: ${{ steps.destroy.outputs.console-output-file }}
          apply-exitcode: ${{ steps.destroy.outputs.exitcode }}
        continue-on-error: true # allow job to continue, step outcome is ignored

      - name: "⚠️ Parse destroy warnings"
        id: parse-destroy-warnings
        if: always() && steps.destroy.outputs.console-output-file != ''
        uses: dsb-norge/github-actions-terraform/parse-terraform-warnings@preview/pr-64-2978b0f
        with:
          console-output-file: ${{ steps.destroy.outputs.console-output-file }}
          step-label: destroy
          environment-name: ${{ matrix.vars.github-environment }}
        continue-on-error: true

      # ======================================================================
      # Phase 2 — re-render the head and post the operation tags, now that
      # apply / destroy-plan / destroy have run. A second pass rather than a
      # relocation of phase 1: the head is a marker upsert, so this is one
      # idempotent PATCH, and it keeps the first feedback at plan time.
      #
      # Every step here carries always(): the six phase-1 outcome gates run
      # before apply and may already have failed the job, and the head must
      # still be brought to the run's final state (P15). The three new gates
      # come AFTER these steps, not before — a gate exits 1, and with
      # allow-failing-terraform-operations=false that skips every later step
      # without always(); putting the apply gate first would make a failed
      # apply the one case that skips its own reporting (P1).
      # See docs/Apply-and-destroy-reporting.md §7.5.
      # ======================================================================
      # Unconditional (always(), no PR guard): the renderer is pure and
      # cheap, and its step-summary-file is what the annotate step below
      # writes to the job page — on push, schedule and dispatch runs, on
      # fork PRs, and for add-pr-comment=false envs, that job page is the
      # only surface there is (P11). The POST/PATCH steps that follow keep
      # the full pull_request guard.
      - name: 📝 Create validation summary (phase 2)
        id: cvs-apply
        if: always()
        uses: dsb-norge/github-actions-terraform/create-validation-summary@preview/pr-64-2978b0f
        with:
          environment-name: ${{ matrix.vars.github-environment }}
          plan-txt-output-file: ${{ steps.plan.outputs.txt-output-file }}
          plan-console-file: ${{ steps.plan.outputs.console-output-file }}
          status-init: ${{ steps.init.outcome }}
          status-verify-lock: ${{ steps.verify-lock.outcome }}
          status-fmt: ${{ steps.fmt.outcome }}
          status-validate: ${{ steps.validate.outcome }}
          status-lint: ${{ steps.lint.outcome }}
          status-plan: ${{ steps.plan.outcome }}
          pr-comment-group: ${{ matrix.vars.pr-comment-group }}
          include-plan-details: ${{ steps.parse-plan.outcome == 'success' }}
          plan-count-add: ${{ steps.parse-plan.outputs.count-add }}
          plan-count-change: ${{ steps.parse-plan.outputs.count-change }}
          plan-count-destroy: ${{ steps.parse-plan.outputs.count-destroy }}
          plan-count-import: ${{ steps.parse-plan.outputs.count-import }}
          plan-count-move: ${{ steps.parse-plan.outputs.count-move }}
          plan-count-remove: ${{ steps.parse-plan.outputs.count-remove }}
          plan-count-total: ${{ steps.parse-plan.outputs.count-total }}
          plan-has-output-only-changes: ${{ steps.parse-plan.outputs.has-output-only-changes }}
          plan-time: ${{ steps.plan.outputs.plan-time }}
          warning-count: ${{ steps.concat-warnings-md.outputs.warning-count }}
          warnings-markdown-file: ${{ steps.concat-warnings-md.outputs.warnings-markdown-file }}
          plan-tag-comment-id: ${{ steps.post-plan-tag.outputs.comment-id }}
          goals-json: ${{ toJSON(matrix.vars.goals) }}
          # --- the operation blocks (docs/Apply-and-destroy-reporting.md §7.4) ---
          status-apply: ${{ steps.apply.outcome }}
          apply-time: ${{ steps.apply.outputs.apply-time }}
          apply-count-import: ${{ steps.parse-apply.outputs.count-import }}
          apply-count-add: ${{ steps.parse-apply.outputs.count-add }}
          apply-count-change: ${{ steps.parse-apply.outputs.count-change }}
          apply-count-destroy: ${{ steps.parse-apply.outputs.count-destroy }}
          apply-count-total: ${{ steps.parse-apply.outputs.count-total }}
          apply-completed: ${{ steps.parse-apply.outputs.completed }}
          # Tick-filtered copy when the parser ran; the raw console otherwise, so a
          # parser problem can never turn a failed apply's console into 'not available'.
          apply-console-file: ${{ steps.parse-apply.outputs.filtered-console-file || steps.apply.outputs.console-output-file }}
          apply-warning-count: ${{ steps.parse-apply-warnings.outputs.warning-count }}
          apply-warnings-markdown-file: ${{ steps.parse-apply-warnings.outputs.warnings-markdown-file }}
          status-destroy-plan: ${{ steps.destroy-plan.outcome }}
          destroy-plan-time: ${{ steps.destroy-plan.outputs.plan-time }}
          destroy-plan-count-add: ${{ steps.parse-destroy-plan.outputs.count-add }}
          destroy-plan-count-change: ${{ steps.parse-destroy-plan.outputs.count-change }}
          destroy-plan-count-destroy: ${{ steps.parse-destroy-plan.outputs.count-destroy }}
          destroy-plan-count-import: ${{ steps.parse-destroy-plan.outputs.count-import }}
          destroy-plan-count-move: ${{ steps.parse-destroy-plan.outputs.count-move }}
          destroy-plan-count-remove: ${{ steps.parse-destroy-plan.outputs.count-remove }}
          destroy-plan-count-total: ${{ steps.parse-destroy-plan.outputs.count-total }}
          destroy-plan-console-file: ${{ steps.destroy-plan.outputs.console-output-file }}
          destroy-plan-txt-output-file: ${{ steps.destroy-plan.outputs.txt-output-file }}
          destroy-plan-warning-count: ${{ steps.parse-destroy-plan-warnings.outputs.warning-count }}
          destroy-plan-warnings-markdown-file: ${{ steps.parse-destroy-plan-warnings.outputs.warnings-markdown-file }}
          status-destroy: ${{ steps.destroy.outcome }}
          destroy-time: ${{ steps.destroy.outputs.apply-time }}
          destroy-count-destroy: ${{ steps.parse-destroy-apply.outputs.count-destroy }}
          destroy-count-total: ${{ steps.parse-destroy-apply.outputs.count-total }}
          destroy-completed: ${{ steps.parse-destroy-apply.outputs.completed }}
          # Tick-filtered copy when the parser ran; the raw console otherwise, so a
          # parser problem can never turn a failed destroy's console into 'not available'.
          destroy-console-file: ${{ steps.parse-destroy-apply.outputs.filtered-console-file || steps.destroy.outputs.console-output-file }}
          destroy-warning-count: ${{ steps.parse-destroy-warnings.outputs.warning-count }}
          destroy-warnings-markdown-file: ${{ steps.parse-destroy-warnings.outputs.warnings-markdown-file }}
          apply-extract-include-outputs: ${{ matrix.vars.apply-extract-include-outputs }}
          output-file-suffix: phase2
        continue-on-error: true # allow job to continue, step outcome is ignored

      # One tag per invocation that ran (§7.6). Gated on the step OUTCOME, not
      # on goals: a skipped apply must not post an 'Apply not available' tag.
      - name: 🐙 Post per-env apply tag
        id: post-apply-tag
        if: |
          always() && steps.cvs-apply.outcome == 'success'
          && matrix.vars.add-pr-comment == 'true'
          && github.event_name == 'pull_request'
          && github.event.action != 'closed'
          && github.event.action != 'converted_to_draft'
          && steps.apply.outcome != 'skipped' && steps.apply.outcome != ''
        uses: dsb-norge/github-actions-terraform/pr-comment@preview/pr-64-2978b0f
        with:
          repo: ${{ github.repository }}
          issue-number: ${{ github.event.pull_request.number }}
          github-token: ${{ github.token }}
          mode: upsert
          marker: "<!-- tf:tag:apply:${{ matrix.vars.github-environment }}:run-id-${{ github.run_id }}:attempt-${{ github.run_attempt }} -->"
          body-file: ${{ steps.cvs-apply.outputs.apply-extract-file }}
        continue-on-error: true
      - name: ☠📖 Post per-env destroy-plan tag
        id: post-destroy-plan-tag
        if: |
          always() && steps.cvs-apply.outcome == 'success'
          && matrix.vars.add-pr-comment == 'true'
          && github.event_name == 'pull_request'
          && github.event.action != 'closed'
          && github.event.action != 'converted_to_draft'
          && steps.destroy-plan.outcome != 'skipped' && steps.destroy-plan.outcome != ''
        uses: dsb-norge/github-actions-terraform/pr-comment@preview/pr-64-2978b0f
        with:
          repo: ${{ github.repository }}
          issue-number: ${{ github.event.pull_request.number }}
          github-token: ${{ github.token }}
          mode: upsert
          marker: "<!-- tf:tag:destroy-plan:${{ matrix.vars.github-environment }}:run-id-${{ github.run_id }}:attempt-${{ github.run_attempt }} -->"
          body-file: ${{ steps.cvs-apply.outputs.destroy-plan-extract-file }}
        continue-on-error: true
      - name: ☠ Post per-env destroy tag
        id: post-destroy-tag
        if: |
          always() && steps.cvs-apply.outcome == 'success'
          && matrix.vars.add-pr-comment == 'true'
          && github.event_name == 'pull_request'
          && github.event.action != 'closed'
          && github.event.action != 'converted_to_draft'
          && steps.destroy.outcome != 'skipped' && steps.destroy.outcome != ''
        uses: dsb-norge/github-actions-terraform/pr-comment@preview/pr-64-2978b0f
        with:
          repo: ${{ github.repository }}
          issue-number: ${{ github.event.pull_request.number }}
          github-token: ${{ github.token }}
          mode: upsert
          marker: "<!-- tf:tag:destroy:${{ matrix.vars.github-environment }}:run-id-${{ github.run_id }}:attempt-${{ github.run_attempt }} -->"
          body-file: ${{ steps.cvs-apply.outputs.destroy-extract-file }}
        continue-on-error: true

      # Re-render with the tag ids so the Links row anchors every tag. Only
      # ungrouped envs have a per-env head to update.
      - name: 📝 Re-render phase 2 with Links
        id: cvs-apply-final
        if: |
          always()
          && matrix.vars.add-pr-comment == 'true'
          && github.event_name == 'pull_request'
          && github.event.action != 'closed'
          && github.event.action != 'converted_to_draft'
          && matrix.vars.pr-comment-group == ''
        uses: dsb-norge/github-actions-terraform/create-validation-summary@preview/pr-64-2978b0f
        with:
          environment-name: ${{ matrix.vars.github-environment }}
          plan-txt-output-file: ${{ steps.plan.outputs.txt-output-file }}
          plan-console-file: ${{ steps.plan.outputs.console-output-file }}
          status-init: ${{ steps.init.outcome }}
          status-verify-lock: ${{ steps.verify-lock.outcome }}
          status-fmt: ${{ steps.fmt.outcome }}
          status-validate: ${{ steps.validate.outcome }}
          status-lint: ${{ steps.lint.outcome }}
          status-plan: ${{ steps.plan.outcome }}
          pr-comment-group: ${{ matrix.vars.pr-comment-group }}
          include-plan-details: ${{ steps.parse-plan.outcome == 'success' }}
          plan-count-add: ${{ steps.parse-plan.outputs.count-add }}
          plan-count-change: ${{ steps.parse-plan.outputs.count-change }}
          plan-count-destroy: ${{ steps.parse-plan.outputs.count-destroy }}
          plan-count-import: ${{ steps.parse-plan.outputs.count-import }}
          plan-count-move: ${{ steps.parse-plan.outputs.count-move }}
          plan-count-remove: ${{ steps.parse-plan.outputs.count-remove }}
          plan-count-total: ${{ steps.parse-plan.outputs.count-total }}
          plan-has-output-only-changes: ${{ steps.parse-plan.outputs.has-output-only-changes }}
          plan-time: ${{ steps.plan.outputs.plan-time }}
          warning-count: ${{ steps.concat-warnings-md.outputs.warning-count }}
          warnings-markdown-file: ${{ steps.concat-warnings-md.outputs.warnings-markdown-file }}
          plan-tag-comment-id: ${{ steps.post-plan-tag.outputs.comment-id }}
          goals-json: ${{ toJSON(matrix.vars.goals) }}
          status-apply: ${{ steps.apply.outcome }}
          apply-time: ${{ steps.apply.outputs.apply-time }}
          apply-count-import: ${{ steps.parse-apply.outputs.count-import }}
          apply-count-add: ${{ steps.parse-apply.outputs.count-add }}
          apply-count-change: ${{ steps.parse-apply.outputs.count-change }}
          apply-count-destroy: ${{ steps.parse-apply.outputs.count-destroy }}
          apply-count-total: ${{ steps.parse-apply.outputs.count-total }}
          apply-completed: ${{ steps.parse-apply.outputs.completed }}
          # Tick-filtered copy when the parser ran; the raw console otherwise, so a
          # parser problem can never turn a failed apply's console into 'not available'.
          apply-console-file: ${{ steps.parse-apply.outputs.filtered-console-file || steps.apply.outputs.console-output-file }}
          apply-warning-count: ${{ steps.parse-apply-warnings.outputs.warning-count }}
          apply-warnings-markdown-file: ${{ steps.parse-apply-warnings.outputs.warnings-markdown-file }}
          status-destroy-plan: ${{ steps.destroy-plan.outcome }}
          destroy-plan-time: ${{ steps.destroy-plan.outputs.plan-time }}
          destroy-plan-count-add: ${{ steps.parse-destroy-plan.outputs.count-add }}
          destroy-plan-count-change: ${{ steps.parse-destroy-plan.outputs.count-change }}
          destroy-plan-count-destroy: ${{ steps.parse-destroy-plan.outputs.count-destroy }}
          destroy-plan-count-import: ${{ steps.parse-destroy-plan.outputs.count-import }}
          destroy-plan-count-move: ${{ steps.parse-destroy-plan.outputs.count-move }}
          destroy-plan-count-remove: ${{ steps.parse-destroy-plan.outputs.count-remove }}
          destroy-plan-count-total: ${{ steps.parse-destroy-plan.outputs.count-total }}
          destroy-plan-console-file: ${{ steps.destroy-plan.outputs.console-output-file }}
          destroy-plan-txt-output-file: ${{ steps.destroy-plan.outputs.txt-output-file }}
          destroy-plan-warning-count: ${{ steps.parse-destroy-plan-warnings.outputs.warning-count }}
          destroy-plan-warnings-markdown-file: ${{ steps.parse-destroy-plan-warnings.outputs.warnings-markdown-file }}
          status-destroy: ${{ steps.destroy.outcome }}
          destroy-time: ${{ steps.destroy.outputs.apply-time }}
          destroy-count-destroy: ${{ steps.parse-destroy-apply.outputs.count-destroy }}
          destroy-count-total: ${{ steps.parse-destroy-apply.outputs.count-total }}
          destroy-completed: ${{ steps.parse-destroy-apply.outputs.completed }}
          # Tick-filtered copy when the parser ran; the raw console otherwise, so a
          # parser problem can never turn a failed destroy's console into 'not available'.
          destroy-console-file: ${{ steps.parse-destroy-apply.outputs.filtered-console-file || steps.destroy.outputs.console-output-file }}
          destroy-warning-count: ${{ steps.parse-destroy-warnings.outputs.warning-count }}
          destroy-warnings-markdown-file: ${{ steps.parse-destroy-warnings.outputs.warnings-markdown-file }}
          apply-extract-include-outputs: ${{ matrix.vars.apply-extract-include-outputs }}
          # The inputs that differ from cvs-apply: the three tag ids.
          apply-tag-comment-id: ${{ steps.post-apply-tag.outputs.comment-id }}
          destroy-plan-tag-comment-id: ${{ steps.post-destroy-plan-tag.outputs.comment-id }}
          destroy-tag-comment-id: ${{ steps.post-destroy-tag.outputs.comment-id }}
          output-file-suffix: phase2-final
        continue-on-error: true

      # Second PATCH of the per-env head this run. pr-comment short-circuits
      # on an unchanged body, so a plan-only env costs one API read and no
      # write (P16). Falls back through phase-2 → phase-1 bodies, each in its
      # own suffixed file (P12).
      - name: 🏷️ Upsert per-env head comment (phase 2)
        id: upsert-head-apply
        if: |
          always()
          && (steps.cvs-apply-final.outcome == 'success' || steps.cvs-apply.outcome == 'success')
          && matrix.vars.add-pr-comment == 'true'
          && github.event_name == 'pull_request'
          && github.event.action != 'closed'
          && github.event.action != 'converted_to_draft'
          && matrix.vars.pr-comment-group == ''
        uses: dsb-norge/github-actions-terraform/pr-comment@preview/pr-64-2978b0f
        with:
          repo: ${{ github.repository }}
          issue-number: ${{ github.event.pull_request.number }}
          github-token: ${{ github.token }}
          mode: upsert
          marker: "<!-- tf:head:env:${{ matrix.vars.github-environment }} -->"
          body-file: ${{ steps.cvs-apply-final.outputs.head-summary-file || steps.cvs-apply.outputs.head-summary-file }}
        continue-on-error: true

      # The run-page surface. No pull_request guard on purpose — see the
      # cvs-apply comment above (P11). Never fails the job (P20 in spirit:
      # reporting must not redden a deploy).
      - name: "📣 Annotate outcome"
        id: annotate
        if: always()
        uses: dsb-norge/github-actions-terraform/annotate-terraform-outcome@preview/pr-64-2978b0f
        with:
          environment-name: ${{ matrix.vars.github-environment }}
          step-summary-file: ${{ steps.cvs-apply-final.outputs.step-summary-file || steps.cvs-apply.outputs.step-summary-file }}
          status-apply: ${{ steps.apply.outcome }}
          apply-count-import: ${{ steps.parse-apply.outputs.count-import }}
          apply-count-add: ${{ steps.parse-apply.outputs.count-add }}
          apply-count-change: ${{ steps.parse-apply.outputs.count-change }}
          apply-count-destroy: ${{ steps.parse-apply.outputs.count-destroy }}
          apply-time: ${{ steps.apply.outputs.apply-time }}
          status-destroy: ${{ steps.destroy.outcome }}
          destroy-count-destroy: ${{ steps.parse-destroy-apply.outputs.count-destroy }}
          destroy-time: ${{ steps.destroy.outputs.apply-time }}
        continue-on-error: true # never fail the job over run-page reporting

      # Outcome gates for the mutating steps (§5.2). Without these a failed
      # apply under allow-failing-terraform-operations=true was green
      # everywhere with no annotation. They change no job outcome: with
      # allow-failing=false the apply step itself already failed the job.
      # Each gate's if: mirrors its step's own if:, so it never fires for a
      # step that legitimately did not run. Placed AFTER the phase-2
      # comment steps — see the phase-2 banner comment above (P1).
      - name: "🧐 Validation outcome: 🐙 Apply"
        if: |
          always() && steps.apply.outcome != 'skipped' && steps.apply.outcome != ''
        run: |
          if [ ! "${{ steps.apply.outcome }}" == 'success' ]; then
            echo "::error title=Apply failed::Outcome of terraform apply step was '${{ steps.apply.outcome }}' for environment '${{ matrix.vars.github-environment }}' — infrastructure may be partially applied!"
            exit 1
          fi
        # do not terminate if configured to ignore, fromJSON ensures bool
        continue-on-error: ${{ fromJSON(matrix.vars.allow-failing-terraform-operations) }}
      - name: "🧐 Validation outcome: ☠📖 Destroy Plan"
        if: |
          always() && steps.destroy-plan.outcome != 'skipped' && steps.destroy-plan.outcome != ''
        run: |
          if [ ! "${{ steps.destroy-plan.outcome }}" == 'success' ]; then
            echo "::error title=Destroy plan failed::Outcome of terraform destroy plan step was '${{ steps.destroy-plan.outcome }}' for environment '${{ matrix.vars.github-environment }}'!"
            exit 1
          fi
        # do not terminate if configured to ignore, fromJSON ensures bool
        continue-on-error: ${{ fromJSON(matrix.vars.allow-failing-terraform-operations) }}
      - name: "🧐 Validation outcome: ☠ Destroy"
        if: |
          always() && steps.destroy.outcome != 'skipped' && steps.destroy.outcome != ''
        run: |
          if [ ! "${{ steps.destroy.outcome }}" == 'success' ]; then
            echo "::error title=Destroy failed::Outcome of terraform destroy step was '${{ steps.destroy.outcome }}' for environment '${{ matrix.vars.github-environment }}' — infrastructure may be partially destroyed!"
            exit 1
          fi
        # do not terminate if configured to ignore, fromJSON ensures bool
        continue-on-error: ${{ fromJSON(matrix.vars.allow-failing-terraform-operations) }}

      - name: "📊 Capture matrix job metadata"
        id: capture-metadata
        if: always()
        uses: dsb-norge/github-actions-terraform/capture-matrix-job-meta@preview/pr-64-2978b0f
        with:
          environment-name: ${{ matrix.vars.github-environment }}
          matrix-context-json: ${{ toJSON(matrix) }}
          github-context-json: ${{ toJSON(github) }}
          steps-context-json: ${{ toJSON(steps) }}
        continue-on-error: true # never fail the job due to metadata capture

      # The resolved files hold plaintext secret values. $RUNNER_TEMP is
      # documented as emptied per job, but 'runs-on' is caller-overridable to
      # self-hosted groups and composite actions cannot declare 'post:' steps,
      # so cleanup is explicit rather than delegated to runner behavior.
      - name: "🧹 Shred resolved environment files"
        if: always()
        run: |
          dir='${{ steps.goal-envs.outputs.envs-dir }}'
          [ -n "${dir}" ] && [ -d "${dir}" ] && rm -rf "${dir}" || :
        continue-on-error: true # never fail the job over cleanup

  # Reconciles per-group PR comments according to the desired set computed from
  # matrix-job-meta-*.json artifacts. Runs unconditionally on PR events (not gated
  # on whether any env declares a pr-comment-group) so that toggling grouping off
  # for an env reliably cleans up its stale group comment on the very next run.
  # See docs/Workflow-pr-comments.md §4.6 for the reconcile algorithm and the
  # cost discussion behind the unconditional gate.
  pr-comment-aggregator:
    if: |
      always()
      && github.event_name == 'pull_request'
      && github.event.action != 'closed'
      && github.event.action != 'converted_to_draft'
    name: "PR comment aggregator"
    needs: [create-matrix, terraform-ci-cd]
    runs-on: ${{ inputs.runs-on }} # global setting
    permissions:
      pull-requests: write # PATCH the per-group head comment
      actions: read        # call the Jobs API to resolve [job log] URLs
                           # for the per-group head's Links column
    defaults:
      run:
        shell: bash
    steps:
      - name: "📥 Download matrix job metadata"
        uses: actions/download-artifact@v4
        with:
          pattern: matrix-job-meta-*
          merge-multiple: true
        # An empty artifact set is a valid input (sweep-only mode still
        # needs to run to clean up any orphan group comments).
        continue-on-error: true
      - name: "📥 Download the relevance decision"
        uses: actions/download-artifact@v4
        with:
          name: relevance
          path: ${{ runner.temp }}/relevance
        # A download by name throws when the artifact is missing (P8); the action then behaves as
        # it did before relevance.
        continue-on-error: true
      - name: "🧮 Reconcile per-group PR comments"
        uses: dsb-norge/github-actions-terraform/aggregate-validation-summaries@preview/pr-64-2978b0f
        with:
          metadata-files-pattern: "matrix-job-meta-*.json"
          # Groups whose members are all unaffected have no metadata; the file keeps them rendered.
          relevance-file: ${{ runner.temp }}/relevance/relevance.json
          pr-number: ${{ github.event.pull_request.number }}
          github-token: ${{ github.token }}
        continue-on-error: true # never fail the workflow over PR comment rendering

  # Run-level rollup on the run page: one table with every environment as a
  # row. Each matrix job can only describe itself on its own job page; this
  # is the whole run at a glance — and on push / schedule / dispatch, where
  # there is no PR comment, the only place it exists. Runs on every event.
  #
  # A dedicated job rather than a step in 'conclusion' (which repos wire into
  # branch protection and which must stay trivially correct) or a relaxation
  # of pr-comment-aggregator (named and permissioned for PR comments; it
  # would then run on push). Must never fail the workflow: continue-on-error
  # on every step, and deliberately NOT in conclusion's needs (P20).
  # See docs/Apply-and-destroy-reporting.md §7.9.
  run-summary:
    if: always()
    name: "Run summary"
    needs: [create-matrix, terraform-ci-cd]
    runs-on: ${{ inputs.runs-on }} # global setting
    # No pull-requests permission — this job never touches the PR.
    permissions: {}
    defaults:
      run:
        shell: bash
    steps:
      - name: "📥 Download matrix job metadata"
        uses: actions/download-artifact@v4
        with:
          pattern: matrix-job-meta-*
          merge-multiple: true
        # No artifacts (matrix skipped) is a valid input.
        continue-on-error: true
      - name: "📥 Download the relevance decision"
        uses: actions/download-artifact@v4
        with:
          name: relevance
          path: ${{ runner.temp }}/relevance
        # A download by name throws when the artifact is missing (P8); the action then behaves as
        # it did before relevance.
        continue-on-error: true
      - name: "📋 Write the run summary"
        uses: dsb-norge/github-actions-terraform/create-run-summary@preview/pr-64-2978b0f
        with:
          metadata-files-pattern: "matrix-job-meta-*.json"
          relevance-file: ${{ runner.temp }}/relevance/relevance.json
        continue-on-error: true # never fail the workflow over run-page reporting

  # One job per test file (and provider set), in parallel with the environments; nothing waits for
  # them (docs/Terraform-tests.md §5). The row's github-environment is the job's environment: an empty
  # name means none, so lanes without one get no environment and a unit lane can never read an
  # environment's secrets.
  terraform-test:
    name: ${{ matrix.test.name }}
    # seed-pr-comments for ordering only, as the environment job: its result is deliberately not tested.
    needs: [create-matrix, seed-pr-comments]
    if: |
      !cancelled()
      && needs.create-matrix.result == 'success'
      && needs.create-matrix.outputs.tests-active == 'true'
    runs-on: ${{ matrix.test.runs-on }}
    timeout-minutes: ${{ matrix.test.timeout-minutes }}
    permissions:
      contents: read
      id-token: write # the azurerm and azuread providers mint their own OIDC tokens
    environment:
      name: ${{ matrix.test.github-environment }}
      deployment: false # keeps the secrets, records no deployment
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.create-matrix.outputs.tests-matrix-json) }}
    # Per file, not per lane: a per-lane group would cancel the rest of this run's own matrix.
    concurrency:
      group: ${{ github.repository }}-terraform-test-${{ matrix.slug }}
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    steps:
      - name: "⬇ Checkout"
        uses: actions/checkout@v6

      - name: "🎰 Export lane environment variables"
        uses: dsb-norge/github-actions-terraform/export-env-vars@preview/pr-64-2978b0f
        with:
          extra-envs: ${{ toJSON(matrix.test.extra-envs) }}
          extra-envs-from-secrets: ${{ toJSON(matrix.test.extra-envs-from-secrets) }}
          secrets-json: ${{ toJSON(secrets) }}
          # An environment lane's ARM_* and TF_VAR_* secrets under their own names; nothing for other lanes.
          export-secrets-with-prefixes-json: ${{ toJSON(matrix.test.github-environment != '' && fromJSON('["ARM_","TF_VAR_"]') || fromJSON('[]')) }}
          # GitHub upper-cases secret names; the copy sets the snake_case variable a test declares.
          lower-case-copies-for-prefixes-json: ${{ toJSON(matrix.test.github-environment != '' && fromJSON('["TF_VAR_"]') || fromJSON('[]')) }}

      - name: "🔐 Verify lane credentials"
        id: verify-credentials
        if: matrix.test.github-environment != ''
        env:
          LANE_ENVIRONMENT: ${{ matrix.test.github-environment }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # Name a missing credential, with the commands that set it, instead of letting init fail obscurely
          if [ -n "${ARM_TENANT_ID:-}" ] && [ -n "${ARM_CLIENT_ID:-}" ]; then
            echo "The lane's environment '${LANE_ENVIRONMENT}' provides ARM_TENANT_ID and ARM_CLIENT_ID."
            exit 0
          fi
          echo "::error title=Terraform test::The environment '${LANE_ENVIRONMENT}' has no ARM_TENANT_ID or ARM_CLIENT_ID secret yet."
          echo "Set them, then re-run (docs/Terraform-tests.md §3.6):"
          echo "  gh secret set ARM_TENANT_ID --env '${LANE_ENVIRONMENT}' --repo '${REPOSITORY}'"
          echo "  gh secret set ARM_CLIENT_ID --env '${LANE_ENVIRONMENT}' --repo '${REPOSITORY}'"
          exit 1
        continue-on-error: true # reported by the test step and gated below

      - name: "🔑 Login to Azure"
        uses: azure/login@v3
        if: |
          steps.verify-credentials.outcome != 'failure'
          && env.ARM_TENANT_ID != '' && env.ARM_SUBSCRIPTION_ID != '' && env.ARM_CLIENT_ID != ''
        with:
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}
          client-id: ${{ env.ARM_CLIENT_ID }}
        continue-on-error: true # the providers log in on their own; a failed login shows in the test

      - name: "📥 Setup Terraform"
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ matrix.test.terraform-version }}
          # the wrapper mangles the -json stream and the exit code
          terraform_wrapper: false

      - name: "📋 Provide provider versions"
        id: copy-lock
        env:
          ROOT: ${{ matrix.test.root }}
          ROOT_KIND: ${{ matrix.test.root-kind }}
          SET_LOCK: ${{ matrix.test.provider-set-lock }}
        run: |
          # Copy the provider set's environment lock into a non-environment test root; name the runner's platform
          if [ "${ROOT_KIND}" != 'environment' ] && [ -n "${SET_LOCK}" ]; then
            cp "${SET_LOCK}" "${ROOT}/.terraform.lock.hcl"
            echo "Copied '${SET_LOCK}' into '${ROOT}'."
          fi
          case "${RUNNER_OS}" in Linux) os=linux ;; macOS) os=darwin ;; Windows) os=windows ;; *) os="${RUNNER_OS,,}" ;; esac
          case "${RUNNER_ARCH}" in X64) arch=amd64 ;; ARM64) arch=arm64 ;; X86) arch=386 ;; ARM) arch=arm ;; *) arch="${RUNNER_ARCH,,}" ;; esac
          lock="${ROOT}/.terraform.lock.hcl"
          # The check reads the lock where it is committed, so its fix command names that directory.
          lock_directory="${ROOT}"
          [ "${ROOT_KIND}" != 'environment' ] && [ -n "${SET_LOCK}" ] && lock_directory="$(dirname "${SET_LOCK}")"
          {
            echo "platform=${os}_${arch}"
            echo "lock-present=$([ -f "${lock}" ] && echo true || echo false)"
            echo "lock-directory=${lock_directory}"
          } >>"${GITHUB_OUTPUT}"

      - name: "🗄️ Setup Terraform provider plugin cache"
        id: setup-terraform-cache
        uses: dsb-norge/github-actions-terraform/setup-terraform-plugin-cache@preview/pr-64-2978b0f

      # Its own key, falling back to the environment job's: actions/cache saves only the first entry
      # for a key, so with the environment job's key the test-only providers would never be cached (P41).
      - name: "🚀 Cache Terraform provider plugins"
        if: steps.copy-lock.outputs.lock-present == 'true'
        uses: actions/cache@v5
        with:
          path: ${{ steps.setup-terraform-cache.outputs.plugin-cache-directory }}
          key: "terraform-provider-plugin-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('{0}/.terraform.lock.hcl', matrix.test.root)) }}-tftest"
          restore-keys: |
            terraform-provider-plugin-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('{0}/.terraform.lock.hcl', matrix.test.root)) }}

      # Every lock a test job uses must record the runner's platform: without it the plugin cache fails
      # a warm init, and a read-only init leaves a package terraform test refuses (P39). Lock-only, as
      # nothing is initialised yet, and after the restore so a warm cache spares the download.
      - name: "🔏 Verify the lock covers this runner"
        id: provider-versions
        if: steps.copy-lock.outputs.lock-present == 'true'
        uses: dsb-norge/github-actions-terraform/verify-terraform-lock@preview/pr-64-2978b0f
        with:
          working-directory: ${{ steps.copy-lock.outputs.lock-directory }}
          platforms: ${{ steps.copy-lock.outputs.platform }}
          lock-only: "true"
          plugin-cache-directory: ${{ steps.setup-terraform-cache.outputs.plugin-cache-directory }}
        continue-on-error: true # reported by the test step and gated below

      - name: "🗄️ Resolve terraform module cache"
        id: module-cache
        if: matrix.test.cache-terraform-modules == 'true'
        uses: dsb-norge/github-actions-terraform/terraform-module-cache@preview/pr-64-2978b0f
        with:
          phase: resolve
          project-dir: ${{ matrix.test.root }}
          additional-dirs-json: "[]"
          # one entry per root: init installs the run-block modules of every test file in it
          environment: tftest-${{ matrix.test.root }}
          test-directory: tests
        continue-on-error: true # caching is an optimisation, never a reason to fail a run

      - name: "🚀 Restore terraform module cache"
        id: restore-module-cache
        if: steps.module-cache.outputs.cache-enabled == 'true'
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.module-cache.outputs.cache-paths }}
          key: ${{ steps.module-cache.outputs.cache-key }}
        continue-on-error: true # caching is an optimisation, never a reason to fail a run

      - name: "📸 Snapshot restored module manifests"
        id: snapshot-module-cache
        if: steps.module-cache.outputs.cache-enabled == 'true'
        uses: dsb-norge/github-actions-terraform/terraform-module-cache@preview/pr-64-2978b0f
        with:
          phase: snapshot
          cache-paths: ${{ steps.module-cache.outputs.cache-paths }}
          cache-hit: ${{ steps.restore-module-cache.outputs.cache-hit }}
        continue-on-error: true # only feeds a warning; must never block init

      - name: "⚙️ Terraform Init"
        id: init
        if: steps.verify-credentials.outcome != 'failure' && steps.provider-versions.outcome != 'failure'
        uses: dsb-norge/github-actions-terraform/terraform-init@preview/pr-64-2978b0f
        with:
          working-directory: ${{ matrix.test.root }}
          environment-name: ${{ matrix.slug }}
          additional-dirs-json: "[]"
          # terraform test keeps state in memory; a backend block must not make init reach for storage
          backend: false
          lockfile-mode: ${{ matrix.test.root-kind == 'environment' && 'readonly-if-present' || 'default' }}
          plugin-cache-directory: ${{ steps.setup-terraform-cache.outputs.plugin-cache-directory }}
          plugin-cache-may-break-lock-file: true
          github-token: ${{ github.token }}
        continue-on-error: true # reported by the test step and gated below

      - name: "🔍 Check terraform module cache"
        id: post-init-check
        if: steps.module-cache.outputs.cache-enabled == 'true'
        uses: dsb-norge/github-actions-terraform/terraform-module-cache@preview/pr-64-2978b0f
        with:
          phase: verify
          cache-paths: ${{ steps.module-cache.outputs.cache-paths }}
          cache-hit: ${{ steps.restore-module-cache.outputs.cache-hit }}
          snapshot-dir: ${{ steps.snapshot-module-cache.outputs.snapshot-dir }}
        continue-on-error: true # if this cannot run, safe-to-save stays unset and nothing is saved

      - name: "🧹 Prune git metadata from the module cache"
        id: prune-module-cache
        if: |
          steps.module-cache.outputs.cache-enabled == 'true'
          && steps.init.outcome == 'success'
          && steps.restore-module-cache.outputs.cache-hit != 'true'
          && steps.post-init-check.outputs.safe-to-save == 'true'
        uses: dsb-norge/github-actions-terraform/terraform-module-cache@preview/pr-64-2978b0f
        with:
          phase: prune
          cache-paths: ${{ steps.module-cache.outputs.cache-paths }}
        continue-on-error: true # a prune that cannot run must not stop the save

      # Right after init, before the test writes into module directories.
      - name: "💾 Save terraform module cache"
        if: |
          steps.module-cache.outputs.cache-enabled == 'true'
          && steps.init.outcome == 'success'
          && steps.restore-module-cache.outputs.cache-hit != 'true'
          && steps.post-init-check.outputs.safe-to-save == 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.module-cache.outputs.cache-paths }}
          key: ${{ steps.module-cache.outputs.cache-key }}
        continue-on-error: true # a lost cache write must not fail the run

      # Runs whatever happened before: the earlier steps' outcomes are how it reports no credentials,
      # a lock without the runner's platform or a failed init.
      - name: "🧪 Terraform test"
        id: test
        if: "!cancelled()"
        uses: dsb-norge/github-actions-terraform/terraform-test@preview/pr-64-2978b0f
        with:
          working-directory: ${{ matrix.test.root }}
          test-file: ${{ matrix.test.rel }}
          slug: ${{ matrix.slug }}
          status-credentials: ${{ steps.verify-credentials.outcome }}
          status-lock: ${{ steps.provider-versions.outcome }}
          status-init: ${{ steps.init.outcome }}
          environments-lock-file: ${{ matrix.test.root-kind == 'environment' && format('{0}/.terraform.lock.hcl', matrix.test.root) || matrix.test.provider-set-lock }}
        continue-on-error: true # gated below, after every reporting step

      - name: "📤 Upload test output"
        id: upload-test-output
        if: always() && steps.test.outputs.report-file != ''
        uses: actions/upload-artifact@v7
        with:
          name: terraform-test-log-${{ matrix.slug }}
          path: |
            ${{ steps.test.outputs.json-file }}
            ${{ steps.test.outputs.report-file }}
            ${{ steps.test.outputs.junit-file }}
          if-no-files-found: ignore
        continue-on-error: true # never fail the job over an upload

      # Uploads the artifact terraform-test-meta-<slug> itself; the summary job reads it.
      - name: "📦 Capture and upload test job metadata"
        id: capture-metadata
        if: always()
        uses: dsb-norge/github-actions-terraform/capture-matrix-job-meta@preview/pr-64-2978b0f
        with:
          entity-name: ${{ matrix.slug }}
          artifact-name: terraform-test-meta-${{ matrix.slug }}
          matrix-context-json: ${{ toJSON(matrix) }}
          github-context-json: ${{ toJSON(github) }}
          steps-context-json: ${{ toJSON(steps) }}
        continue-on-error: true # never fail the job due to metadata capture

      # The gates come after every reporting step: a gate exits 1 and would otherwise skip the upload
      # that explains the failure.
      - name: "🧐 Validation outcome: 🔐 Credentials"
        if: steps.verify-credentials.outcome == 'failure'
        run: exit 1
        continue-on-error: ${{ fromJSON(matrix.test.allow-failing-terraform-tests) }}

      - name: "🧐 Validation outcome: ⚙️ Init"
        if: steps.init.outcome != 'success'
        run: exit 1
        continue-on-error: ${{ fromJSON(matrix.test.allow-failing-terraform-tests) }}

      - name: "🧐 Validation outcome: 🧪 Test"
        if: steps.test.outputs.status != 'pass'
        run: exit 1
        continue-on-error: ${{ fromJSON(matrix.test.allow-failing-terraform-tests) }}

  # One PR comment and one run-summary block for the whole stage (docs/Terraform-tests.md §6). Never in
  # the conclusion's needs: a reporting job must never redden a run.
  terraform-test-summary:
    name: "Terraform tests summary"
    needs: [create-matrix, terraform-test]
    if: |
      always()
      && needs.create-matrix.result == 'success'
      && inputs.terraform-test-enabled == true
      && (github.event_name == 'pull_request' || github.event_name == 'push')
      && (needs.create-matrix.outputs.tests-count != '0' || github.event_name == 'pull_request')
    runs-on: ${{ inputs.runs-on }} # global setting
    permissions:
      pull-requests: write # the tests head
      actions: read        # the Jobs API, for the job links
    defaults:
      run:
        shell: bash
    steps:
      - name: "📥 Download test job metadata"
        uses: actions/download-artifact@v4
        with:
          pattern: terraform-test-meta-*
          merge-multiple: true
        continue-on-error: true # zero matches is a valid input
      - name: "📥 Download the relevance decision"
        uses: actions/download-artifact@v4
        with:
          name: relevance
          path: ${{ runner.temp }}/relevance
        # A download by name throws when the artifact is missing (P8); the summary then has no
        # not-run rows.
        continue-on-error: true
      - name: "🧾 Summarise the tests"
        id: summary
        uses: dsb-norge/github-actions-terraform/create-test-summary@preview/pr-64-2978b0f
        with:
          tests-matrix-json: ${{ needs.create-matrix.outputs.tests-matrix-json }}
          not-run-file: ${{ runner.temp }}/relevance/relevance.json
          github-token: ${{ github.token }}
        continue-on-error: true # never fail the workflow over reporting
      - name: "💬 Post the tests summary"
        if: |
          steps.summary.outcome == 'success'
          && needs.create-matrix.outputs.tests-count != '0'
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.fork == false
          && github.event.action != 'closed'
          && github.event.action != 'converted_to_draft'
          && inputs.add-pr-comment == true
        uses: dsb-norge/github-actions-terraform/pr-comment@preview/pr-64-2978b0f
        with:
          repo: ${{ github.repository }}
          issue-number: ${{ github.event.pull_request.number }}
          github-token: ${{ github.token }}
          mode: upsert
          marker: ${{ steps.summary.outputs.head-marker }}
          body-file: ${{ steps.summary.outputs.body-file }}
        continue-on-error: true # never fail the workflow over PR comments
      # The last test file removed, or the stage switched off, on an open pull request: the head
      # would otherwise show a stale result.
      - name: "🧹 Remove the tests summary"
        if: |
          steps.summary.outcome == 'success'
          && needs.create-matrix.outputs.tests-count == '0'
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.fork == false
          && github.event.action != 'closed'
          && github.event.action != 'converted_to_draft'
        uses: dsb-norge/github-actions-terraform/pr-comment@preview/pr-64-2978b0f
        with:
          repo: ${{ github.repository }}
          issue-number: ${{ github.event.pull_request.number }}
          github-token: ${{ github.token }}
          mode: delete
          marker: ${{ steps.summary.outputs.head-marker }}
        continue-on-error: true # never fail the workflow over PR comments

  # The one check branch protection requires. Green means everything that should have run, ran
  # and succeeded, including when nothing should have run: a pull request that touches no
  # environment reports green instead of leaving the check pending (docs/Path-relevance.md §7).
  # It reads named results and the matrix builder's counts, because "skipped" alone cannot tell
  # "nothing to verify" from "something upstream broke". Reporting jobs stay out of needs: they
  # must never redden a run.
  conclusion:
    if: always()
    name: "Terraform conclusion"
    needs: [create-matrix, terraform-ci-cd, terraform-test]
    runs-on: ${{ inputs.runs-on }} # global setting
    permissions: {}
    defaults:
      run:
        shell: bash
    steps:
      - name: "🛑 Verify everything that should have run, ran and passed"
        env:
          CREATE_MATRIX_RESULT: ${{ needs.create-matrix.result }}
          AFFECTED_COUNT: ${{ needs.create-matrix.outputs.affected-count }}
          UNAFFECTED_COUNT: ${{ needs.create-matrix.outputs.unaffected-count }}
          RELEVANCE_MODE: ${{ needs.create-matrix.outputs.relevance-mode }}
          RELEVANCE_REASON: ${{ needs.create-matrix.outputs.relevance-reason }}
          ENVIRONMENTS_RESULT: ${{ needs.terraform-ci-cd.result }}
          TESTS_ACTIVE: ${{ needs.create-matrix.outputs.tests-active }}
          TESTS_COUNT: ${{ needs.create-matrix.outputs.tests-count }}
          TESTS_RESULT: ${{ needs.terraform-test.result }}
        run: |
          # Judge the run from the named results and the builder's counts (docs/Path-relevance.md §7.2, docs/Terraform-tests.md §7)
          set -euo pipefail
          environments="environments: ${AFFECTED_COUNT:-?} affected, ${UNAFFECTED_COUNT:-?} not affected (${RELEVANCE_MODE:-?}: ${RELEVANCE_REASON:-?})"
          verdict=red
          if [ "${CREATE_MATRIX_RESULT}" != "success" ]; then
            why="the matrix could not be built (${CREATE_MATRIX_RESULT})"
          else
            case "${ENVIRONMENTS_RESULT}" in
              success) verdict=green why="${environments}" ;;
              skipped)
                if [ "${AFFECTED_COUNT}" = "0" ]; then
                  verdict=green why="nothing to verify for this change; ${environments}"
                else
                  why="the environments should have run but were skipped; ${environments}"
                fi
                ;;
              *) why="the environments' result is ${ENVIRONMENTS_RESULT}; ${environments}" ;;
            esac
            # The tests are judged independently of the environments: skipped is fine only while the
            # stage is inactive (switched off, no test files, an event tests do not run on).
            case "${TESTS_RESULT}" in
              success) ;;
              skipped)
                if [ "${TESTS_ACTIVE}" = "true" ]; then
                  verdict=red why="the tests should have run but were skipped; ${why}"
                fi
                ;;
              *) verdict=red why="the tests' result is ${TESTS_RESULT}; ${why}" ;;
            esac
            why="${why}; tests: ${TESTS_COUNT:-0}"
          fi
          line="conclusion: ${verdict} — ${why}"
          echo "${line}"
          echo "${line}" >>"${GITHUB_STEP_SUMMARY}"
          if [ "${verdict}" = green ]; then
            echo "::notice title=Terraform conclusion::${line}"
          else
            echo "::error title=Terraform conclusion::${line}"
            exit 1
          fi

  automerge:
    # job runs when:
    #   - the conclusion is green AND
    #   - the environments succeeded, or none was affected (docs/Path-relevance.md §8) AND
    #   - global setting pr-auto-merge-enabled is true AND
    #   - workflow triggered by pull request event AND
    #   - pull request is not being closed AND
    #   - pull request is not being converted to draft
    # !cancelled() replaces the implicit success(), which a skipped matrix would fail (P14).
    if: |
      !cancelled()
      && needs.conclusion.result == 'success'
      && (
        needs.terraform-ci-cd.result == 'success'
        || (needs.terraform-ci-cd.result == 'skipped' && needs.create-matrix.outputs.affected-count == '0')
      )
      && inputs.pr-auto-merge-enabled == true
      && github.event_name == 'pull_request'
      && github.event.action != 'closed'
      && github.event.action != 'converted_to_draft'
      && github.event.pull_request.draft != true
    name: "PR auto merger"
    needs: [create-matrix, terraform-ci-cd, conclusion]
    runs-on: ${{ inputs.runs-on }} # global setting
    defaults:
      run:
        shell: bash
    steps:
      - name: "🔐 Validate auto-merge configuration"
        id: validate-automerge-config
        run: |
          if [ -z "${{ inputs.pr-auto-merge-app-id }}" ]; then
            echo "::error::Auto-merge is enabled but 'pr-auto-merge-app-id' is not set. Please provide the GitHub App ID."
            exit 1
          fi
          if [ -z "${{ inputs.pr-auto-merge-app-private-key-secret }}" ]; then
            echo "::error::Auto-merge is enabled but 'pr-auto-merge-app-private-key-secret' is not set. Please provide the name of the secret containing the GitHub App private key."
            exit 1
          fi
      - name: "📥 Download matrix job metadata"
        id: download-metadata
        uses: actions/download-artifact@v4
        with:
          pattern: matrix-job-meta-* # uploaded by capture-matrix-job-meta step in terraform-ci-cd job
          merge-multiple: true
      - name: "📥 Download the relevance decision"
        uses: actions/download-artifact@v4
        with:
          name: relevance
          path: ${{ runner.temp }}/relevance
        # A download by name throws when the artifact is missing (P8); the action then behaves as
        # it did before relevance.
        continue-on-error: true
      - name: "🔍 Evaluate PR auto merge eligibility across all environments"
        id: evaluate-automerge
        uses: dsb-norge/github-actions-terraform/evaluate-automerge-eligibility@preview/pr-64-2978b0f
        with:
          metadata-files-pattern: "matrix-job-meta-*.json"
          # Every affected environment must have its metadata; an unaffected one is judged on
          # its enabled flag and actor allowlist, so a docs-only pull request is never merged blindly.
          relevance-file: ${{ runner.temp }}/relevance/relevance.json
      - name: "🔑 Resolve auto-merge app private key"
        id: resolve-key
        if: steps.evaluate-automerge.outputs.is-eligible == 'true'
        shell: bash
        env:
          SECRET_NAME: ${{ inputs.pr-auto-merge-app-private-key-secret }}
        run: |
          SECRETS_JSON=$(cat <<'TERRAFORM_CI_CD_SECRETS_JSON'
          ${{ toJSON(secrets) }}
          TERRAFORM_CI_CD_SECRETS_JSON
          )
          PRIVATE_KEY=$(echo "${SECRETS_JSON}" | jq --arg key "${SECRET_NAME}" -r '.[$key]')
          if [ -z "${PRIVATE_KEY}" ] || [ "${PRIVATE_KEY}" == "null" ]; then
            echo "::error::Secret '${SECRET_NAME}' not found. Ensure the secret exists and 'secrets: inherit' is set in the calling workflow."
            exit 1
          fi
          # Mask the value so it never appears in logs
          echo "::add-mask::${PRIVATE_KEY}"
          # Set as output using delimiter to handle multiline PEM keys
          EOF_DELIM=$(openssl rand -hex 16)
          echo "private-key<<${EOF_DELIM}" >> $GITHUB_OUTPUT
          echo "${PRIVATE_KEY}" >> $GITHUB_OUTPUT
          echo "${EOF_DELIM}" >> $GITHUB_OUTPUT
      - name: "🎫 Create GitHub App token"
        id: app-token
        if: steps.evaluate-automerge.outputs.is-eligible == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.pr-auto-merge-app-id }}
          private-key: ${{ steps.resolve-key.outputs.private-key }}
          permission-contents: write
          permission-pull-requests: write
      - name: "🤖 Auto merge PR"
        id: auto-merge-pr
        if: steps.evaluate-automerge.outputs.is-eligible == 'true'
        uses: dsb-norge/github-actions-terraform/auto-merge-pr@preview/pr-64-2978b0f
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          github-event-context-json: ${{ toJSON(github.event) }}
