name: "Evaluate automerge eligibility"
description: |
  Evaluates whether a pull request is eligible for automatic merging based on Terraform plan
  changes, configured limits, and actor restrictions. This action processes metadata files
  from multiple matrix job environments and produces an aggregated eligibility decision.

  The decision engine judges (`engine/`, command `evaluate-automerge`, docs/Auto-merge.md §14):
  its adapter reads the files, its core applies the rules below.

  ## Evaluation Order (per environment)

  The evaluation follows this order to fail fast and provide meaningful feedback:
  1. Configuration Validation - Validates limits configuration (fails action on error)
  2. PR Auto-merge Enabled Check - Verifies PR automerge is enabled for this environment
  3. Actor Authorization - Verifies the current actor is in the environment's actor list,
     compared without case. The list is never "everyone": an empty, missing or non-list value
     is not eligible
  4. Plan Creation Validation - Verifies the plans the run granted (`goals-granted`: `plan`,
     `destroy-plan`) were created
  5. Operation Success Check - Verifies apply/destroy succeeded when the run granted them on the
     pull request (`apply`, `destroy` in `goals-granted`, only through apply-on-pr/destroy-on-pr)
  6. Limit Applicability - Determines which limits should be evaluated
  7. Count Validation - Validates counts are available when needed, and that each plan they
     come from was counted from its JSON plan and is complete (`counts-source: json` and
     `plan-complete: true` from parse-plan / parse-destroy-plan); anything else, absent
     included, is not eligible
  8. Count Aggregation - Combines plan and destroy-plan counts if both evaluated
  9. Limit Evaluation - Compares aggregated counts against configured limits
  10. Operation Outcomes - Verifies no Terraform operation step (init, verify-lock, fmt, validate,
      lint, plan, apply, destroy-plan, destroy) ended failure or cancelled, a failure tolerated by
      allow-failing-terraform-operations included
  11. Final Eligibility - All checks must pass for eligibility

  Checks 4-9 read `matrix_context.vars.goals-granted`, the goals the run's gates granted, never
  the raw goals. Metadata without `goals-granted` (or with one that is not a list of the eight
  goals) is not eligible.

  ## Multi-Environment Processing

  This action processes multiple matrix-job-meta-*.json files and evaluates each environment
  independently. The final `is-eligible` output is `true` only if ALL environments are eligible.

  ## With a relevance file

  Given `relevance-file` (the matrix builder's `relevance.json`, docs/Path-relevance.md §8), the
  environments judged are the ones the file lists, matched to metadata on `github-environment`:
  - Affected environment (`verdict: run`) with exactly one metadata file: checks 1-11 above,
    from the metadata, unchanged.
  - Affected environment without a metadata file: not eligible. Its job was cancelled or failed
    before capturing metadata, or, with `stage-results-json`, it was held back: its stage was
    skipped although it has environments, because an earlier stage failed. The reason then says
    so and names the stage that held it back (docs/Environment-ordering.md §7.5).
  - Unaffected environment (`verdict: skip`) without a metadata file: checks 1-3 from the resolved
    `pr-auto-merge-enabled`, `pr-auto-merge-from-actors` and `pr-auto-merge-limits` in the file;
    checks 4-10 are recorded as NOT AFFECTED.
  - Skipped environment the change may concern (docs/Auto-merge.md D6): `verdict: skip` with
    `relevant: true`, typically one whose `trigger-events` lack `pull_request`, so it was never
    planned: checks 1-3 as above, then not eligible. An entry without `relevant` (an older file)
    whose first reason starts with `trigger-events:` is not eligible either.
  - Unaffected environment with a metadata file: judged on the metadata like an affected one,
    because a job that ran produced a plan.
  - More than one metadata file for an environment, a metadata file for an environment the file
    does not list, an invalid metadata file, a relevance file that is not valid JSON or lists no
    environments or has a malformed entry: not eligible.
  A pull request that affected no environment has no metadata at all and is eligible exactly
  when every environment's enabled flag and actor list permit it.

  ## Test jobs

  The conclusion judges the test jobs. Every test metadata file (`test-metadata-files-pattern`)
  whose test ended `fail` or `error` under `allow-failing-terraform-tests` is named in the log and
  in a notice; such a test never makes the pull request ineligible (docs/Auto-merge.md D13).

  ## Behavior Notes

  - Configuration errors (invalid limits JSON) will fail the action step with exit code 1
  - All other validation failures result in is-eligible=false but exit code 0
  - If pr-auto-merge-enabled is false, the environment is marked ineligible regardless of other checks
  - Plan limits are ignored when apply is granted (apply on the pull request)
  - Destroy plan limits are ignored when destroy is granted (destroy on the pull request)
  - When both plan and destroy plan limits are evaluated, counts are aggregated (summed)
  - Empty plan counts are acceptable only when the corresponding limits are ignored; so is a
    plan that was not counted from a complete JSON plan
  - Without a relevance file (input empty, or the path does not exist): if no metadata files are
    found matching the pattern, is-eligible=false
  - With a relevance file, zero metadata files is a valid run; the environments come from the file
author: "Peder Schmedling"
inputs:
  metadata-files-pattern:
    description: |
      Glob pattern to find matrix-job-meta files from the capture-matrix-job-meta action.
      The pattern is matched against files in the current working directory.
      Each matching file should be a JSON file with the structure produced by capture-matrix-job-meta.
      Example: "matrix-job-meta-*.json"
    required: true
  relevance-file:
    description: |
      Path of the `relevance.json` the matrix builder writes, listing every environment of the run
      with its verdict (`run` or `skip`) and resolved `pr-auto-merge-*` values. With it, every
      affected environment must have exactly one metadata file and every unaffected environment is
      checked for configuration, enabled flag and actor authorization (see "With a relevance file").
      Empty, or a path that does not exist (a relevance artifact that was never downloaded), gives
      the behaviour without it: only the metadata files are evaluated.
    required: false
    default: ""
  test-metadata-files-pattern:
    description: |
      Glob pattern of the test jobs' metadata files (capture-matrix-job-meta in the test job,
      artifact `terraform-test-meta-<slug>`), matched in the current working directory. Each
      file whose test step's status is `fail` or `error` and whose row sets
      `allow-failing-terraform-tests` is named in the log and in a notice; eligibility is never
      affected. No matching file names nothing; empty skips the step.
    required: false
    default: "terraform-test-meta-*.json"
  stage-results-json:
    description: |
      The result of each stage job, as a JSON object:
      {"1": "<result>", "2": "<result>", "3": "<result>"}, each one of success, failure,
      cancelled or skipped. With relevance-file it tells an affected environment a failed stage
      held back from one whose job crashed; both are not eligible, and only the reason differs.
      Empty, or not such an object: every affected environment without metadata is reported as
      cancelled or crashed, as without it.
    required: false
    default: ""
outputs:
  is-eligible:
    description: |
      Boolean string ("true" or "false") indicating whether all environments are eligible for
      PR automerge. Returns "true" only if all environments pass all checks: actor authorization,
      plan creation validation, operation success (if applicable), all limit evaluations, and
      the outcomes of the Terraform operations.
      Returns "false" if any environment fails, if no metadata files are found and no relevance
      file is given, or, with a relevance file, if an affected environment has no metadata.
    value: ${{ steps.evaluate.outputs.is-eligible }}
runs:
  using: "composite"
  steps:
    - id: evaluate
      shell: bash
      env:
        METADATA_FILES_PATTERN: ${{ inputs.metadata-files-pattern }}
        RELEVANCE_FILE: ${{ inputs.relevance-file }}
        TEST_METADATA_FILES_PATTERN: ${{ inputs.test-metadata-files-pattern }}
      run: |
        # Evaluate whether every environment is eligible for auto-merge
        #
        # The stage results reach the engine through a file, never a variable or argv. GitHub
        # pastes the expression into this script before bash parses it; the quoted heredoc keeps
        # bash from expanding anything in it. Isolated mode (-I): docs/Decision-engine.md P21.
        stage_results_file="$(mktemp)"
        cat >"${stage_results_file}" <<'EVALUATE_AUTOMERGE_ELIGIBILITY_STAGE_RESULTS_JSON'
        ${{ inputs.stage-results-json }}
        EVALUATE_AUTOMERGE_ELIGIBILITY_STAGE_RESULTS_JSON
        # A value is joined to its option with '=', so one starting with '-' is never read as an option.
        python3 -I -B "${{ github.action_path }}/../engine/run.py" evaluate-automerge \
          --metadata-files-pattern="${METADATA_FILES_PATTERN}" --relevance-file="${RELEVANCE_FILE}" \
          --test-metadata-files-pattern="${TEST_METADATA_FILES_PATTERN}" --stage-results-file="${stage_results_file}"
