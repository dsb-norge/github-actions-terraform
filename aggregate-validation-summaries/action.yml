name: "Aggregate validation summaries into per-group PR comments"
description: |
  Reconciles the set of per-group "validation summary" PR comments on a pull request
  according to the desired set computed from matrix-job-meta-*.json artifacts.

  See docs/Workflow-pr-comments.md for the full spec — this action implements §3.3
  (the aggregator phase) and §5.3 (the per-group comment shape).

  Behavior:
    - Reads every matrix-job-meta-*.json in the current directory.
    - Partitions envs by their matrix_context.vars["pr-comment-group"] value.
    - Lists all PR comments via the GitHub API; finds existing group comments by
      family-prefix match.
    - Deletes existing group comments whose specific prefix is no longer desired
      (orphans from removed/renamed groups), plus existing group comments that
      ARE desired (will be reposted with fresh body).
    - Posts one fresh per-group comment per distinct non-empty group.
    - With relevance-file: also renders the groups relevance.json declares and
      the environments path relevance left out of the run, as columns of dashes
      (docs/Path-relevance.md §6.2, §6.4).
    - With relevance-file and stage-results-json: renders the environments a
      failed stage held back, and finalises the heads of ungrouped ones, which
      no job of the run writes (docs/Environment-ordering.md §7.4).

  Failure isolation:
    - Empty desired set + empty existing set -> no-op.
    - Empty desired set + non-empty existing set -> sweep mode (clean orphans only).
    - GitHub API outage -> degraded mode: skip delete pass, still post fresh bodies.
    - Malformed individual metadata file -> log warning, skip the file.

author: "Peder Schmedling"

inputs:
  metadata-files-pattern:
    description: |
      Glob pattern matched against files in the working directory. Each match must
      be a JSON file with the structure produced by capture-matrix-job-meta.
    required: false
    default: "matrix-job-meta-*.json"
  pr-number:
    description: |
      The pull request number to reconcile group comments against.
    required: true
  relevance-file:
    description: |
      Path of the relevance.json the matrix builder writes (create-tf-vars-matrix's
      relevance-file output, shipped to this job as the `relevance` artifact).

      With it, the desired set of groups is the union of the groups declared in
      the file for environments with add-pr-comment "true" and the groups seen in
      metadata; an environment the file marks unaffected keeps its column in its
      group's table, every cell a dash, and is named in a footer line. Columns
      then follow environments-yml order. A run whose only commenting
      environments are unaffected still reconciles.

      Empty, or a path that does not exist (the artifact download may fail), and
      the action behaves exactly as without relevance.
    required: false
    default: ""
  stage-results-json:
    description: |
      The result of each stage job, as a JSON object:
      {"1": "<result>", "2": "<result>", "3": "<result>"}, each one of success,
      failure, cancelled or skipped. With relevance-file, an affected
      environment without metadata in a skipped stage that has environments was
      held back (docs/Environment-ordering.md §7.4):
        - in a group, it keeps its column, every cell but Links a "⏭️" whose
          tooltip names what held it back, and the group's footer names it on a
          "⏭️ Held back:" line above the workflow-log line;
        - ungrouped with add-pr-comment "true", its own head, which no job of
          this run will write, is finalised here with the held-back body.
      Empty, or not such an object: the action behaves exactly as without it.
    required: false
    default: ""
  github-token:
    description: |
      Token used by the `gh` CLI to call the GitHub API. Needs `pull-requests: write`.

      No default is provided: the `github` context is not available inside a
      composite action's `inputs.<name>.default`, so the caller must pass the
      token explicitly. From a reusable workflow, the canonical value to pass
      is the `github.token` context (or the `secrets.GITHUB_TOKEN` secret).
    required: true

outputs:
  groups-processed-json:
    description: |
      JSON array of objects describing each action taken. Each object has shape:
        {group: <string>, "comment-id": <string>, action: posted|repost|orphan-deleted|post-failed}
      A held-back environment's head is recorded with `environment` in place of `group`.
      Used for logs/tests; not normally consumed by callers.
    value: ${{ steps.aggregate.outputs.groups-processed-json }}

runs:
  using: "composite"
  steps:
    - id: aggregate
      shell: bash
      env:
        input_metadata_files_pattern: ${{ inputs.metadata-files-pattern }}
        input_pr_number: ${{ inputs.pr-number }}
        input_relevance_file: ${{ inputs.relevance-file }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        # Reconcile the group PR comments and finalise held-back env heads

        # A JSON-contract input through a quoted heredoc, before allexport, so it
        # is never exported; step_aggregate.sh reads it as a shell-local.
        input_stage_results_json=$(cat <<'AGGREGATE_VALIDATION_SUMMARIES_STAGE_RESULTS_JSON'
        ${{ inputs.stage-results-json }}
        AGGREGATE_VALIDATION_SUMMARIES_STAGE_RESULTS_JSON
        )

        set -o allexport
        source "${{ github.action_path }}/step_aggregate.sh"
        exit_code=$?
        set +o allexport
        exit ${exit_code}
