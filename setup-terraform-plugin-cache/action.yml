name: "Configure terraform plugin cache directory"
description: |
  Configures the Terraform provider plugin cache: creates ~/.terraform.d/plugin-cache and points
  ~/.terraformrc at it, then publishes the directory and a monthly rolling key for actions/cache.
  Logic: step_setup_plugin_cache.sh.
author: "Peder Schmedling"
outputs:
  plugin-cache-directory:
    description: The path to the plugin cache directory.
    value: ${{ steps.setup.outputs.plugin-cache-directory }}
  plugin-cache-key-monthly-rolling:
    description: A cache key to use for a monthly rolling cache.
    value: ${{ steps.setup.outputs.monthly-rolling }}
runs:
  using: "composite"
  steps:
    - id: setup
      shell: bash
      run: |
        # Configure the terraform provider plugin cache directory and a monthly rolling cache key
        set -o allexport
        source "${{ github.action_path }}/step_setup_plugin_cache.sh"
