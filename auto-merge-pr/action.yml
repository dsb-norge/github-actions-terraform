name: "Auto-merge Pull Request"
description: |
  Automatically merges a pull request using admin privileges when conditions are met.

  This action receives the GitHub event context to determine PR eligibility for auto-merge.
  It checks that the PR is open, not a draft, and in a mergeable state before performing
  the merge operation with admin privileges using rebase strategy.

  The merge is pinned to what the run evaluated (docs/Auto-merge.md §6):
  - Base: the base the plans saw, the first parent of `merge-sha`, must still be the tip of
    the pull request's base branch; otherwise nothing is merged. A lookup that fails refuses
    too.
  - Head: the merge passes `--match-head-commit <head-sha>`, so GitHub refuses it when the
    pull request's head moved.

  ## Prerequisites

  - Must run in pull_request event context
  - The provided github-token must have admin privileges for the repository
  - PR must be open, not a draft, and in a mergeable state

  ## Behavior Notes

  - Uses GitHub CLI (gh) for merge operations
  - Merges with --admin --rebase --delete-branch --match-head-commit <head-sha>
  - Exits with error if PR is not in a valid state for merging, or if `head-sha` or
    `merge-sha` is missing
  - A refused merge (base or head moved, a conflict) is an error annotation, and the PR stays
    open for a person
  - While GitHub has not computed mergeability yet (event `mergeable: null`), retries, reading
    the live value (MERGEABLE, CONFLICTING, UNKNOWN); stops on CONFLICTING, and never retries
    after a refusal for a moved head or base
  - Skips gracefully when PR is being closed or converted to draft

author: "Artjoms Laivins, Peder Schmedling"
inputs:
  github-token:
    description: |
      GitHub token with admin privileges for the repository.
      Required for performing admin merge operation.
    required: true
    default: ${{ github.token }}

  github-event-context-json:
    description: |
      JSON object containing the GitHub event context (github.event).
      This should include pull_request data with state, draft, and mergeable fields.
      Pass as: toJSON(github.event)
    required: true

  head-sha:
    description: |
      The pull request's head SHA the run planned, `github.event.pull_request.head.sha`. The
      merge is made only while the head is still this commit; the step refuses to merge without
      it.
    required: true

  merge-sha:
    description: |
      The run's `github.sha`, the event's merge commit: the head merged with the base as it was
      when the run planned it. Its first parent must still be the base branch's tip; the step
      refuses to merge without it.
    required: true

runs:
  using: "composite"
  steps:
    - id: pr-event-check
      if: github.event_name != 'pull_request'
      shell: bash
      run: |
        # Fail: this action only makes sense on pull_request events
        set -o allexport; source "${{ github.action_path }}/helpers.sh"; set +o allexport;
        log-error "This action can only run in pull request context"
        exit 1

    - id: pr-action-check
      if: |
        github.event_name == 'pull_request'
        && (
          github.event.action == 'closed'
          || github.event.action == 'converted_to_draft'
        )
      shell: bash
      run: |
        # Skip: the PR is being closed or converted to draft
        set -o allexport; source "${{ github.action_path }}/helpers.sh"; set +o allexport;
        log-info "Skipping: PR is being closed or converted to draft"
        exit 0

    - id: auto-merge-pr
      if: |
        github.event_name == 'pull_request'
        && github.event.action != 'closed'
        && github.event.action != 'converted_to_draft'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        input_repo_ref: ${{ github.repository }}
        input_pr_number: ${{ github.event.number }}
        input_head_sha: ${{ inputs.head-sha }}
        input_merge_sha: ${{ inputs.merge-sha }}
      run: |
        # Merge the pull request with admin privileges
        #
        # Heredoc capture (special chars in github.event JSON survive verbatim).
        # Intentionally NOT exported — step_auto_merge_pr.sh is sourced from
        # this same shell and reads ${input_github_event_context_json} as a
        # shell-local, so it never needs to be in envp. github.event for PR
        # events can be 30-100+ KB (long descriptions, large reviewer lists,
        # labels). Exporting that pushed every subsequent gh / jq fork past
        # MAX_ARG_STRLEN (128 KB per envp string on Ubuntu); see
        # docs/Action-implementation-guide.md §"Anti-pattern: exporting
        # heredoc-captured JSON".
        input_github_event_context_json=$(cat <<'AUTO_MERGE_PR_GITHUB_EVENT_CONTEXT_JSON'
        ${{ inputs.github-event-context-json }}
        AUTO_MERGE_PR_GITHUB_EVENT_CONTEXT_JSON
        )

        source "${GITHUB_ACTION_PATH}/step_auto_merge_pr.sh"
        exit_code=$?
        exit ${exit_code}
