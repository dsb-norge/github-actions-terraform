name: "Run terraform test"
description: |
  Runs 'terraform test' for one test file from its test root and classifies
  the outcome from the JSON stream: a status and reason, counts, per-run and
  per-diagnostic files, the provider versions the root resolved, error
  annotations and a block in the job's step summary. Files are written under
  RUNNER_TEMP/<slug>/; outputs carry paths, counts and short strings only.

  The caller logs in and uploads the files; this action does neither.

  Spec: docs/Terraform-tests.md §5.4-§5.8 and §9.2.
author: "Artjoms Laivins, Peder Schmedling"

inputs:
  test-file:
    description: |
      Test file to run, relative to working-directory (e.g.
      'tests/unit-net.tftest.hcl'); used verbatim as the -filter value, a
      leading './' dropped.
    required: true
  working-directory:
    description: |
      The test root to run from, relative to the workspace or absolute; '.'
      for the workspace itself.
    required: true
  junit:
    description: Write a JUnit XML report (takes effect from Terraform 1.11).
    required: false
    default: "true"
  slug:
    description: |
      Directory name under RUNNER_TEMP for this file's output. Default:
      derived from the root and the file as the matrix builder derives slugs.
    required: false
    default: ""
  status-credentials:
    description: |
      Outcome of the job's credential check step, or empty. 'failure' or
      'cancelled' skips terraform and reports status 'error', reason
      'no-credentials'.
    required: false
    default: ""
  status-lock:
    description: |
      Outcome of the job's lock platform check, or empty. 'failure' or
      'cancelled' skips terraform and reports reason 'lock-platform'.
    required: false
    default: ""
  status-init:
    description: |
      Outcome of the job's init step, or empty. Anything but 'success' skips
      terraform and reports reason 'init'. Empty means not supplied (the test
      runs).
    required: false
    default: ""
  environments-lock-file:
    description: |
      The environment lock file the test root's lock was copied from before
      init, or an environment root's own lock; relative to the workspace or
      absolute. Each provider in the lock Terraform wrote is 'environments'
      when this lock records the same version, else 'floating'. Empty: no
      comparison, every provider's origin is 'root'.
    required: false
    default: ""

outputs:
  status:
    description: "'pass', 'fail' or 'error' (docs/Terraform-tests.md §5.5)."
    value: ${{ steps.run-tests.outputs.status }}
  reason:
    description: |
      Empty for 'pass'; 'assertion' for 'fail'; for 'error' one of
      no-credentials, lock-platform, init, terraform-version, not-initialised,
      invalid, not-discovered, file, run.
    value: ${{ steps.run-tests.outputs.reason }}
  passed:
    description: Run blocks passed (test_summary).
    value: ${{ steps.run-tests.outputs.passed }}
  failed:
    description: Run blocks failed (test_summary).
    value: ${{ steps.run-tests.outputs.failed }}
  errored:
    description: Run blocks errored (test_summary).
    value: ${{ steps.run-tests.outputs.errored }}
  skipped:
    description: Run blocks skipped (test_summary).
    value: ${{ steps.run-tests.outputs.skipped }}
  total:
    description: Sum of passed, failed, errored and skipped.
    value: ${{ steps.run-tests.outputs.total }}
  elapsed-ms:
    description: Milliseconds from the test file's start to its completion; empty when unknown.
    value: ${{ steps.run-tests.outputs.elapsed-ms }}
  summary:
    description: The test_summary message, e.g. 'Success! 8 passed, 0 failed.'; empty when Terraform wrote none.
    value: ${{ steps.run-tests.outputs.summary }}
  exit-code:
    description: The exit code of 'terraform test'; empty when it did not run.
    value: ${{ steps.run-tests.outputs.exit-code }}
  terraform-version:
    description: The Terraform version that ran; empty when unknown.
    value: ${{ steps.run-tests.outputs.terraform-version }}
  terraform-version-floor:
    description: The lowest Terraform version the action runs tests with. Always set.
    value: ${{ steps.run-tests.outputs.terraform-version-floor }}
  runner-platform:
    description: The runner's platform as Terraform names it (linux_amd64, linux_arm64, …). Always set.
    value: ${{ steps.run-tests.outputs.runner-platform }}
  test-file-path:
    description: The test file, relative to the workspace.
    value: ${{ steps.run-tests.outputs.test-file-path }}
  json-file:
    description: Path of the 'terraform test -json' log (stdout and stderr); empty when terraform did not run.
    value: ${{ steps.run-tests.outputs.json-file }}
  report-file:
    description: Path of the human-readable report (at most 65 000 bytes).
    value: ${{ steps.run-tests.outputs.report-file }}
  junit-file:
    description: Path of the JUnit XML report; empty when Terraform wrote none.
    value: ${{ steps.run-tests.outputs.junit-file }}
  runs-json-file:
    description: "Path of a JSON array, one object per run block: {run, status, elapsed-ms}."
    value: ${{ steps.run-tests.outputs.runs-json-file }}
  diagnostics-json-file:
    description: "Path of a JSON array, one object per error diagnostic: {run, file, line, summary, detail}; file is relative to the workspace."
    value: ${{ steps.run-tests.outputs.diagnostics-json-file }}
  providers-json-file:
    description: "Path of a JSON array, one object per provider in the lock Terraform wrote: {name, version, origin, environments-version}; origin 'environments', 'floating' or 'root'."
    value: ${{ steps.run-tests.outputs.providers-json-file }}
  providers-summary:
    description: "One line, e.g. 'null 3.2.3 environments · random 3.9.1 floating'; empty when no lock was read."
    value: ${{ steps.run-tests.outputs.providers-summary }}
  providers-floating-count:
    description: Number of providers whose origin is 'floating'.
    value: ${{ steps.run-tests.outputs.providers-floating-count }}
  failed-runs-json:
    description: |
      Compact JSON array of at most 3000 bytes: the file-level diagnostics,
      then each failed or errored run block with its diagnostics and each
      skipped run block, as {run, status, file, line, summary, detail}
      (summary at most 120 and detail 200 characters). Whole elements are
      dropped from the tail to fit.
    value: ${{ steps.run-tests.outputs.failed-runs-json }}
  failed-runs-omitted:
    description: Number of elements dropped from failed-runs-json.
    value: ${{ steps.run-tests.outputs.failed-runs-omitted }}

runs:
  using: "composite"
  steps:
    # Runs whenever the job got this far, also after a failed credential,
    # lock or init step: the step classifies those from its status-* inputs.
    # '!cancelled()' because inside a composite action success() may reflect
    # the job's failed steps, not only this action's.
    - id: run-tests
      if: "!cancelled()"
      shell: bash
      continue-on-error: true
      env:
        TF_IN_AUTOMATION: true
        input_test_file: ${{ inputs.test-file }}
        input_working_directory: ${{ inputs.working-directory }}
        input_junit: ${{ inputs.junit }}
        input_slug: ${{ inputs.slug }}
        input_status_credentials: ${{ inputs.status-credentials }}
        input_status_lock: ${{ inputs.status-lock }}
        input_status_init: ${{ inputs.status-init }}
        input_environments_lock_file: ${{ inputs.environments-lock-file }}
      run: |
        # Run 'terraform test' for one test file and classify the outcome
        set -o allexport
        source "${{ github.action_path }}/step_run_tests.sh"

    - id: test-status
      if: always() && (steps.run-tests.outcome == 'failure' || steps.run-tests.outcome == 'cancelled' || steps.run-tests.outputs.status != 'pass')
      shell: bash
      run: |
        # Fail the action because the test did not pass
        exit 1
