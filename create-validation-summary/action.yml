name: "Create terraform validation summary"
description: |
  Render the per-environment pull request comment bodies: a validation
  summary table ("head") and the last 65k characters of terraform plan
  output ("plan tag"; the GitHub comment limit is 65536 characters).

  Bodies are written to files and their paths published, for posting with
  the `pr-comment` action's `body-file` input.
author: "Peder Schmedling"
inputs:
  environment-name:
    description: Name of the current deployment environment.
  plan-console-file:
    description: Path of file with plan output captured from the console.
    required: false
    default: ""
  plan-txt-output-file:
    description: Path of file with plan output generated by terraform itself.
    required: false
    default: ""
  status-init:
    description: Outcome of init step.
    required: true
  status-verify-lock:
    description: Outcome of the lock file verification step.
    required: true
  status-fmt:
    description: Outcome of fmt step.
    required: true
  status-validate:
    description: Outcome of validate step.
    required: true
  status-lint:
    description: Outcome of lint step.
    required: true
  status-plan:
    description: Outcome of plan step.
    required: true
  pr-comment-group:
    description: |
      Name of the comment group this environment belongs to. When non-empty:
        - The validation table is omitted from the per-env comment body (it appears
          in the per-group comment posted by aggregate-validation-summaries instead).
      The comment prefix is unchanged regardless of this value — see
      docs/Workflow-pr-comments.md §6.2 (prefix continuity invariant).
    required: false
    default: ""
  include-plan-details:
    description: Whether to include plan details in the summary.
    required: false
    default: "false"
  plan-count-add:
    description: Number of resources to be added.
    required: false
    default: "N/A"
  plan-count-change:
    description: Number of resources to be changed.
    required: false
    default: "N/A"
  plan-count-destroy:
    description: Number of resources to be destroyed.
    required: false
    default: "N/A"
  plan-count-import:
    description: Number of resources to be imported.
    required: false
    default: "N/A"
  plan-count-move:
    description: Number of resources to be moved.
    required: false
    default: "N/A"
  plan-count-remove:
    description: Number of resources to be removed.
    required: false
    default: "N/A"
  plan-count-total:
    description: |
      Sum of all change counts (typically wired from parse-terraform-plan's
      `count-total` output). When numeric and zero, the plan-extract block
      is replaced by a single 'Plan: no changes ✅' line UNLESS
      `plan-has-output-only-changes` is true (see below). When numeric and
      non-zero, the <details> summary lists each kind — 'Plan: <A> to add,
      <C> to change, <D> to destroy ℹ️', with import / move / remove appended
      when those counts are non-zero. When
      missing or the literal '?' (parse failed), the action falls back to
      the pre-v0.24 'Show Plan (last 65k characters)' summary.
    required: false
    default: ""
  plan-has-output-only-changes:
    description: |
      "true" when the plan reports changes to outputs but no resource changes
      (typically wired from parse-terraform-plan's `has-output-only-changes`
      output). When true and count-total is 0, the plan-extract block keeps
      the <details> collapser with summary 'Plan: output-only changes ℹ️' so
      reviewers can still see the output diff.
    required: false
    default: "false"
  plan-time:
    description: |
      Wall-clock duration of the `terraform plan` invocation, formatted as
      `mm:ss` (typically wired from terraform-plan's `plan-time` output).
      Rendered as a trailing row of the validation table. Defaults to "N/A"
      when not provided — matches the convention used by `plan-count-*`.
    required: false
    default: "N/A"
  warning-count:
    description: |
      Total terraform warning count across init+validate+plan (typically
      summed in the caller workflow from three parse-terraform-warnings
      invocations). When numeric and > 0, the per-env head-summary table
      gets a "⚠️ Warnings" row between the "📖 Plan" and "📊 Plan Details"
      rows. When 0 / unset / '?', the row is omitted. See
      docs/Plan-warnings.md.
    required: false
    default: "0"
  warnings-markdown-file:
    description: |
      Absolute path to a markdown file containing rendered warning bodies
      (typically the concatenation of the three parse-terraform-warnings
      output files for init+validate+plan). When non-empty and the file
      has content, a `<details>⚠️ N warnings</summary>…</details>`
      collapser is appended to the plan-extract output AFTER the existing
      plan-block. Warnings have priority over the plan extract in the 65k
      char budget — when both can't fit, plan extract is trimmed first.
      See docs/Plan-warnings.md §5 for the budgeting algorithm.
    required: false
    default: ""
  plan-tag-comment-id:
    description: |
      GitHub comment id of the per-env plan-extract tag for this run, used
      to render a Links row inside the per-env head's table:

        | 🔗 | Links | [log extract](#issuecomment-<id>)<br>[job log](<url>) |

      When supplied and the env is ungrouped (`pr-comment-group` empty), the
      Links row is appended to the validation table and the standalone
      `[Job log]` footer is dropped (the same link lives inside the table).
      When empty, `head-summary` renders with the legacy footer style.

      Callers post the plan-extract tag first to obtain its comment id, then
      re-render the head with the id supplied to get the Links shape.
      See docs/Workflow-pr-comments.md §6.1 (per-env head, Links row).
    required: false
    default: ""
  status-apply:
    description: |
      Outcome of the apply step. Non-empty renders the Apply block (status,
      warnings, details, time rows) below Plan time. Empty — the default —
      renders nothing, so an environment that does not apply gets exactly
      the table it always had. See docs/Apply-and-destroy-reporting.md §8.1.
    required: false
    default: ""
  status-destroy-plan:
    description: Outcome of the destroy-plan step. Non-empty renders the Destroy plan block.
    required: false
    default: ""
  status-destroy:
    description: Outcome of the destroy step. Non-empty renders the Destroy block.
    required: false
    default: ""
  apply-time:
    description: Wall-clock duration of terraform apply as mm:ss (terraform-apply's `apply-time`). 'N/A' renders an em-dash.
    required: false
    default: "N/A"
  destroy-plan-time:
    description: Wall-clock duration of the destroy plan as mm:ss (terraform-plan's `plan-time` for the -destroy invocation).
    required: false
    default: "N/A"
  destroy-time:
    description: Wall-clock duration of the destroy apply as mm:ss (terraform-apply's `apply-time` for the destroy invocation).
    required: false
    default: "N/A"
  apply-count-import:
    description: Resources imported by apply (parse-terraform-apply's `count-import`). Rendered, against the plan's import count, only when non-zero — terraform omits the segment unless import blocks are in play.
    required: false
    default: "N/A"
  apply-count-add:
    description: Resources added by apply (parse-terraform-apply's `count-add`). Rendered as the numerator of the applied/planned badge.
    required: false
    default: "N/A"
  apply-count-change:
    description: Resources changed by apply (parse-terraform-apply's `count-change`).
    required: false
    default: "N/A"
  apply-count-destroy:
    description: Resources destroyed by apply (parse-terraform-apply's `count-destroy`).
    required: false
    default: "N/A"
  apply-count-total:
    description: Sum of the three apply counts (parse-terraform-apply's `count-total`). Drives the apply extract's block shape.
    required: false
    default: "N/A"
  apply-completed:
    description: |
      'true' when terraform printed an 'Apply complete!' line
      (parse-terraform-apply's `completed`). Anything else forces every
      applied count in the Apply details row to '?', whatever count
      arrived — a failed apply must never read as '0/N'.
    required: false
    default: ""
  destroy-plan-count-add:
    description: From parse-terraform-plan on the destroy plan. The destroy plan is a plan, so it carries the full plan badge set.
    required: false
    default: "N/A"
  destroy-plan-count-change:
    description: From parse-terraform-plan on the destroy plan.
    required: false
    default: "N/A"
  destroy-plan-count-destroy:
    description: From parse-terraform-plan on the destroy plan. Also the denominator of the Destroy details badge.
    required: false
    default: "N/A"
  destroy-plan-count-import:
    description: From parse-terraform-plan on the destroy plan.
    required: false
    default: "N/A"
  destroy-plan-count-move:
    description: From parse-terraform-plan on the destroy plan.
    required: false
    default: "N/A"
  destroy-plan-count-remove:
    description: From parse-terraform-plan on the destroy plan.
    required: false
    default: "N/A"
  destroy-plan-count-total:
    description: From parse-terraform-plan on the destroy plan. Drives the destroy-plan extract's block shape.
    required: false
    default: "N/A"
  destroy-count-destroy:
    description: Resources destroyed by the destroy apply (parse-terraform-apply's `count-destroy` for that invocation).
    required: false
    default: "N/A"
  destroy-count-total:
    description: parse-terraform-apply's `count-total` for the destroy invocation. Drives the destroy extract's block shape.
    required: false
    default: "N/A"
  destroy-completed:
    description: As `apply-completed`, for the destroy invocation.
    required: false
    default: ""
  apply-warning-count:
    description: |
      Warning count from the apply console (parse-terraform-warnings with
      step-label 'apply'). Its own row in the Apply block; NOT added to
      `warning-count`, whose meaning (init+validate+plan) is unchanged.
      See docs/Apply-and-destroy-reporting.md §7.7.
    required: false
    default: "0"
  destroy-plan-warning-count:
    description: Warning count from the destroy-plan console. Its own row in the Destroy plan block.
    required: false
    default: "0"
  destroy-warning-count:
    description: Warning count from the destroy console. Its own row in the Destroy block.
    required: false
    default: "0"
  goals-json:
    description: |
      The environment's goals as a JSON array (the matrix's `goals`). When
      it contains 'apply-on-pr' and/or 'destroy-on-pr' the head gains a
      Mode row as its first row and the plan tag gains a banner, both
      independent of any outcome — the warning is on the PR before the
      apply has happened. Malformed JSON is ignored.
      See docs/Apply-and-destroy-reporting.md §8.2, §8.5.
    required: false
    default: ""
  apply-console-file:
    description: |
      Tick-filtered apply console (parse-terraform-apply's
      `filtered-console-file`). Source of the apply tag body.
    required: false
    default: ""
  destroy-plan-console-file:
    description: Console of the destroy plan (terraform-plan's `console-output-file` for the -destroy invocation).
    required: false
    default: ""
  destroy-plan-txt-output-file:
    description: The destroy plan's 'terraform show' text (terraform-plan's `txt-output-file`). Preferred over the console when present, as for the plan.
    required: false
    default: ""
  destroy-console-file:
    description: Tick-filtered destroy console (parse-terraform-apply's `filtered-console-file` for the destroy invocation).
    required: false
    default: ""
  apply-extract-include-outputs:
    description: |
      'true' keeps the Outputs section in the apply and destroy tag bodies.
      Default 'false' strips it and appends '_(outputs section omitted)_'.

      terraform apply prints every non-sensitive output's actual VALUE in
      that section — terraform plan never does — so posting it publishes
      values the plan comment has always kept hidden, in repositories whose
      maintainers have only ever reviewed the plan comment's exposure.
      See docs/Apply-and-destroy-reporting.md P3.
    required: false
    default: "false"
  apply-warnings-markdown-file:
    description: Warning bodies from the apply console (parse-terraform-warnings, step-label 'apply'); appended to the apply tag body.
    required: false
    default: ""
  destroy-plan-warnings-markdown-file:
    description: Warning bodies from the destroy-plan console; appended to the destroy-plan tag body.
    required: false
    default: ""
  destroy-warnings-markdown-file:
    description: Warning bodies from the destroy console; appended to the destroy tag body.
    required: false
    default: ""
  apply-tag-comment-id:
    description: Comment id of this run's apply tag. Adds an '[apply log]' line to the Links row.
    required: false
    default: ""
  destroy-plan-tag-comment-id:
    description: Comment id of this run's destroy-plan tag. Adds a '[destroy plan log]' line to the Links row.
    required: false
    default: ""
  destroy-tag-comment-id:
    description: Comment id of this run's destroy tag. Adds a '[destroy log]' line to the Links row.
    required: false
    default: ""
  output-file-suffix:
    description: |
      Appended (after a '-') to the name of every body file this action
      writes. Pass a distinct value on each invocation within one job.

      The default workflow invokes this action several times per matrix job
      and the head-upsert step falls back from a later invocation's file to
      an earlier one's. Without distinct suffixes the later invocation
      overwrites the earlier file in place, and the fallback silently posts
      the wrong body. See docs/Apply-and-destroy-reporting.md P12.
    required: false
    default: ""
outputs:
  head-summary-file:
    description: |
      Absolute path of the per-env "head" comment body — long-lived,
      identified by an HTML marker on the PR, PATCHed in place across runs.
      Contains the H3 heading, the validation table (ungrouped mode only),
      and a job-log footer. Post with the `pr-comment` action's `body-file`
      input and marker `<!-- tf:head:env:<env-name> -->`.

      The body is published as a path, never as a string: a string output
      enters the steps context and from there the metadata artifact and
      envp. See docs/Apply-and-destroy-reporting.md §7.10.
    value: ${{ steps.create-validation-summary.outputs.head-summary-file }}
  plan-extract-file:
    description: |
      Absolute path of the per-env "plan tag" comment body — run-scoped,
      posted with a marker that embeds the run-id
      (`<!-- tf:tag:plan:<env>:run-id-<id>:attempt-<n> -->`), purged at the
      start of the next run. Contains the H3 heading and the plan-block
      (`<details>` collapser or its short-circuit variants). Empty plan
      output renders as 'Plan not available 🤷‍♀️'.
    value: ${{ steps.create-validation-summary.outputs.plan-extract-file }}
  apply-extract-file:
    description: |
      Absolute path of the apply tag body (`<!-- tf:tag:apply:<env>:run-id-…`).
      Always written; renders 'Apply not available 🤷‍♀️' when apply did not
      run — the workflow posts the tag only when it did. Shapes in
      docs/Apply-and-destroy-reporting.md §8.6; the failure shape is the
      only `<details open>` in the system.
    value: ${{ steps.create-validation-summary.outputs.apply-extract-file }}
  destroy-plan-extract-file:
    description: |
      Absolute path of the destroy-plan tag body
      (`<!-- tf:tag:destroy-plan:<env>:run-id-…`). A destroy plan is a plan:
      same five block shapes as the plan tag.
    value: ${{ steps.create-validation-summary.outputs.destroy-plan-extract-file }}
  destroy-extract-file:
    description: |
      Absolute path of the destroy tag body (`<!-- tf:tag:destroy:<env>:run-id-…`).
      Same shapes as the apply tag with the destroy wording.
    value: ${{ steps.create-validation-summary.outputs.destroy-extract-file }}
  step-summary-file:
    description: |
      Absolute path of the per-env block for the job's $GITHUB_STEP_SUMMARY
      (docs/Apply-and-destroy-reporting.md §8.7): the head's table in its
      ungrouped shape — a grouped env has no table in its PR head, but the
      job page has no per-group table to defer to — with the Links row
      replaced by a '[Job log](<url>)' footer. Consumed by
      annotate-terraform-outcome, on every event.
    value: ${{ steps.create-validation-summary.outputs.step-summary-file }}
runs:
  using: "composite"
  steps:
    - id: create-validation-summary
      shell: bash
      env:
        input_environment_name: ${{ inputs.environment-name }}
        input_plan_console_file: ${{ inputs.plan-console-file }}
        input_plan_txt_output_file: ${{ inputs.plan-txt-output-file }}
        input_status_init: ${{ inputs.status-init }}
        input_status_verify_lock: ${{ inputs.status-verify-lock }}
        input_status_fmt: ${{ inputs.status-fmt }}
        input_status_validate: ${{ inputs.status-validate }}
        input_status_lint: ${{ inputs.status-lint }}
        input_status_plan: ${{ inputs.status-plan }}
        input_pr_comment_group: ${{ inputs.pr-comment-group }}
        input_include_plan_details: ${{ inputs.include-plan-details }}
        input_plan_count_add: ${{ inputs.plan-count-add }}
        input_plan_count_change: ${{ inputs.plan-count-change }}
        input_plan_count_destroy: ${{ inputs.plan-count-destroy }}
        input_plan_count_import: ${{ inputs.plan-count-import }}
        input_plan_count_move: ${{ inputs.plan-count-move }}
        input_plan_count_remove: ${{ inputs.plan-count-remove }}
        input_plan_count_total: ${{ inputs.plan-count-total }}
        input_plan_has_output_only_changes: ${{ inputs.plan-has-output-only-changes }}
        input_plan_time: ${{ inputs.plan-time }}
        input_warning_count: ${{ inputs.warning-count }}
        input_warnings_markdown_file: ${{ inputs.warnings-markdown-file }}
        input_plan_tag_comment_id: ${{ inputs.plan-tag-comment-id }}
        input_status_apply: ${{ inputs.status-apply }}
        input_status_destroy_plan: ${{ inputs.status-destroy-plan }}
        input_status_destroy: ${{ inputs.status-destroy }}
        input_apply_time: ${{ inputs.apply-time }}
        input_destroy_plan_time: ${{ inputs.destroy-plan-time }}
        input_destroy_time: ${{ inputs.destroy-time }}
        input_apply_count_import: ${{ inputs.apply-count-import }}
        input_apply_count_add: ${{ inputs.apply-count-add }}
        input_apply_count_change: ${{ inputs.apply-count-change }}
        input_apply_count_destroy: ${{ inputs.apply-count-destroy }}
        input_apply_count_total: ${{ inputs.apply-count-total }}
        input_apply_completed: ${{ inputs.apply-completed }}
        input_destroy_plan_count_add: ${{ inputs.destroy-plan-count-add }}
        input_destroy_plan_count_change: ${{ inputs.destroy-plan-count-change }}
        input_destroy_plan_count_destroy: ${{ inputs.destroy-plan-count-destroy }}
        input_destroy_plan_count_import: ${{ inputs.destroy-plan-count-import }}
        input_destroy_plan_count_move: ${{ inputs.destroy-plan-count-move }}
        input_destroy_plan_count_remove: ${{ inputs.destroy-plan-count-remove }}
        input_destroy_plan_count_total: ${{ inputs.destroy-plan-count-total }}
        input_destroy_count_destroy: ${{ inputs.destroy-count-destroy }}
        input_destroy_count_total: ${{ inputs.destroy-count-total }}
        input_destroy_completed: ${{ inputs.destroy-completed }}
        input_apply_warning_count: ${{ inputs.apply-warning-count }}
        input_destroy_plan_warning_count: ${{ inputs.destroy-plan-warning-count }}
        input_destroy_warning_count: ${{ inputs.destroy-warning-count }}
        input_goals_json: ${{ inputs.goals-json }}
        input_apply_console_file: ${{ inputs.apply-console-file }}
        input_destroy_plan_console_file: ${{ inputs.destroy-plan-console-file }}
        input_destroy_plan_txt_output_file: ${{ inputs.destroy-plan-txt-output-file }}
        input_destroy_console_file: ${{ inputs.destroy-console-file }}
        input_apply_extract_include_outputs: ${{ inputs.apply-extract-include-outputs }}
        input_apply_warnings_markdown_file: ${{ inputs.apply-warnings-markdown-file }}
        input_destroy_plan_warnings_markdown_file: ${{ inputs.destroy-plan-warnings-markdown-file }}
        input_destroy_warnings_markdown_file: ${{ inputs.destroy-warnings-markdown-file }}
        input_apply_tag_comment_id: ${{ inputs.apply-tag-comment-id }}
        input_destroy_plan_tag_comment_id: ${{ inputs.destroy-plan-tag-comment-id }}
        input_destroy_tag_comment_id: ${{ inputs.destroy-tag-comment-id }}
        input_output_file_suffix: ${{ inputs.output-file-suffix }}
        input_job_check_run_id: ${{ job.check_run_id }}
      run: |
        # Build the validation summary PR comment body for this environment
        #
        # No `set -o allexport` on purpose. step_create_validation_summary.sh
        # captures up to ~65k chars of plan output into `plan_out` while
        # assembling the body. Under allexport that would auto-export, and
        # a single env var at that size sits just under Linux's per-string
        # execve limit (MAX_ARG_STRLEN = 128k on Ubuntu) — zero headroom
        # for the next subprocess fork. Keeping the script's vars
        # shell-local removes the only realistic ARG_MAX exposure here;
        # inputs still arrive via the env: block above, outputs (file
        # paths only) still flow through $GITHUB_OUTPUT, so nothing in
        # this action actually needs envp.
        source "${{ github.action_path }}/step_create_validation_summary.sh"
