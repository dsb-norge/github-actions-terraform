name: "Create common DSB terraform CI/CD variables"
description: |
  Given the required input this action returns common DSB terraform environment variables with values.
  Common DSB terraform environment variables are the values needed to successfully init, plan and apply terraform projects in DSB's infrastructure.

  The decisions are made by the decision engine in the repository's 'engine/' directory
  (docs/Decision-engine.md), which needs Python 3.10 or later on the runner.
author: "Peder Schmedling"
inputs:
  inputs-json:
    description: "All inputs given to the ci/cd workflow"
    required: true
outputs:
  matrix-json:
    description: "All terraform ci/cd variables as json"
    value: ${{ steps.create-matrix.outputs.matrix-json }}
runs:
  using: "composite"
  steps:
    - id: create-matrix
      shell: bash
      env:
        input_repository: ${{ github.repository }}
        input_event_name: ${{ github.event_name }}
        input_ref_name: ${{ github.ref_name }}
        input_default_branch: ${{ github.event.repository.default_branch }}
        GH_TOKEN: ${{ github.token }}
      run: |
        # Resolve the terraform ci/cd variables of every environment into the job matrix
        #
        # Heredoc capture (special chars survive verbatim). Intentionally NOT
        # exported — step_create_matrix.sh reads it as a shell-local via `source`.
        input_inputs_json=$(cat <<'EOF'
        ${{ inputs.inputs-json }}
        EOF
        )

        set -o allexport
        source "${{ github.action_path }}/step_create_matrix.sh"
