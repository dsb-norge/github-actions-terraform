name: "Create common DSB terraform CI/CD variables"
description: |
  Given the required input this action returns common DSB terraform environment variables with values.
  Common DSB terraform environment variables are the values needed to successfully init, plan and apply terraform projects in DSB's infrastructure.

  The step is the decision engine's create-matrix adapter, in the repository's 'engine/' directory
  (docs/Decision-engine.md). It needs Python 3.12 or later and yq on the runner.
author: "Peder Schmedling"
inputs:
  inputs-json:
    description: "All inputs given to the ci/cd workflow, as toJSON(inputs); anything that is not a JSON object is rejected"
    required: true
  mode:
    description: |
      'project' (the default) for the project workflow; 'module' for the module workflow, which
      decides its test stage alone and publishes the tests-* outputs and relevance-file only
      (docs/Module-ci.md §5).
    required: false
    default: "project"
outputs:
  matrix-json:
    description: "All terraform ci/cd variables as json, one row per affected environment, every stage's together; may be empty"
    value: ${{ steps.create-matrix.outputs.matrix-json }}
  matrix-stage-1-json:
    description: "The rows of stage 1 (docs/Environment-ordering.md); every affected environment when no depends-on orders them; may be empty"
    value: ${{ steps.create-matrix.outputs.matrix-stage-1-json }}
  matrix-stage-2-json:
    description: "The rows of stage 2; may be empty"
    value: ${{ steps.create-matrix.outputs.matrix-stage-2-json }}
  matrix-stage-3-json:
    description: "The rows of stage 3; may be empty"
    value: ${{ steps.create-matrix.outputs.matrix-stage-3-json }}
  stage-1-count:
    description: "How many environments stage 1 runs, as a string"
    value: ${{ steps.create-matrix.outputs.stage-1-count }}
  stage-2-count:
    description: "How many environments stage 2 runs, as a string"
    value: ${{ steps.create-matrix.outputs.stage-2-count }}
  stage-3-count:
    description: "How many environments stage 3 runs, as a string"
    value: ${{ steps.create-matrix.outputs.stage-3-count }}
  affected-count:
    description: "How many environments this change is relevant to, as a string (docs/Path-relevance.md)"
    value: ${{ steps.create-matrix.outputs.affected-count }}
  unaffected-count:
    description: "How many environments this change is not relevant to, as a string"
    value: ${{ steps.create-matrix.outputs.unaffected-count }}
  relevance-mode:
    description: "'diff' when relevance was decided from the changed files, 'all' when every environment runs"
    value: ${{ steps.create-matrix.outputs.relevance-mode }}
  relevance-reason:
    description: "Why the mode: 'diff', or the fail-open reason of mode 'all'"
    value: ${{ steps.create-matrix.outputs.relevance-reason }}
  changed-count:
    description: "How many files the change touched, as the API counted them; '0' when not fetched"
    value: ${{ steps.create-matrix.outputs.changed-count }}
  tests-matrix-json:
    description: "The test stage's matrix, one row per test file and provider set (docs/Terraform-tests.md §4.5); may be empty"
    value: ${{ steps.create-matrix.outputs.tests-matrix-json }}
  tests-count:
    description: "How many test jobs run, as a string"
    value: ${{ steps.create-matrix.outputs.tests-count }}
  tests-active:
    description: "'true' when the stage is on, the event runs tests and there is at least one row"
    value: ${{ steps.create-matrix.outputs.tests-active }}
  admission-refused:
    description: "'true' when the Dependabot admission refused the run (docs/Dependabot-admission.md §5.2), else 'false'."
    value: ${{ steps.create-matrix.outputs.admission-refused }}
  admission-reason:
    description: "Why the admission refused the run, in one line; empty when it did not."
    value: ${{ steps.create-matrix.outputs.admission-reason }}
  admission-admitted:
    description: "'true' when the Dependabot admission judged the run and admitted it, else 'false' (docs/Dependabot-admission.md D22)."
    value: ${{ steps.create-matrix.outputs.admission-admitted }}
  tests-required-missing:
    description: "Module mode: 'true' when a test file is required and there is none (docs/Module-ci.md D9)"
    value: ${{ steps.create-matrix.outputs.tests-required-missing }}
  relevance-file:
    description: |
      Path of relevance.json on the runner: every environment's verdict and resolved path rules, the
      counts, the relevance block, the pull request comment manifest and the decision record. Upload it
      for the jobs after the matrix; never pass its content as an output.
    value: ${{ steps.create-matrix.outputs.relevance-file }}
runs:
  using: "composite"
  steps:
    - id: create-matrix
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        MODE: ${{ inputs.mode }}
      run: |
        # Resolve the terraform ci/cd variables of every environment into the job matrix
        #
        # The inputs reach the adapter through a file, never a variable or argv. GitHub pastes
        # the expression into this script before bash parses it; the quoted heredoc keeps bash
        # from expanding anything in it, and toJSON output cannot contain the delimiter line
        # because JSON escapes a string's newlines. The adapter rejects anything that is not a
        # JSON object. Isolated mode (-I): docs/Decision-engine.md P21.
        inputs_file="$(mktemp)"
        cat >"${inputs_file}" <<'CREATE_TF_VARS_MATRIX_INPUTS_JSON'
        ${{ inputs.inputs-json }}
        CREATE_TF_VARS_MATRIX_INPUTS_JSON
        python3 -I -B "${{ github.action_path }}/../engine/run.py" create-matrix --inputs-file "${inputs_file}" \
          --mode "${MODE}"
