name: "Parse terraform plan file"
description: |
  Counts the resources a Terraform plan adds, changes, destroys, imports, moves and removes.
  The counts come from the JSON plan when 'plan-json-file' is given, and from the plan's
  console output otherwise. A JSON plan is also classified as drift, pending or clean, with
  a fingerprint of what it would do.
author: "Peder Schmedling"
inputs:
  plan-console-file:
    description: Path of file with plan output captured from console.
    required: true
  plan-json-file:
    description: |
      Path of the JSON plan, 'terraform show -json' of the saved plan: the terraform-plan
      action's 'json-output-file' output.

      Given, every count and 'has-output-only-changes' come from the JSON plan and the
      console output is not read for them. A JSON plan that does not exist, cannot be
      read, is not a Terraform JSON plan of format 1.x, or says it errored makes every
      count '?'; it never falls back to the console. A plan that is not complete
      ("complete": false, as with -target or deferred changes) is counted; whether it
      is the whole plan is 'plan-complete'.

      Empty, the default, counts from the console output as this action always did. The
      console text holds resource values, so a value that reads like a summary line can
      forge those counts; pass the JSON plan wherever the counts decide anything.
    required: false
    default: ""
outputs:
  counts-source:
    description: |
      Where the counts came from: "json" when 'plan-json-file' was given (whether or not
      the JSON plan could be counted; the counts are '?' when it could not), "console"
      otherwise.
    value: ${{ steps.parse-plan-output.outputs.counts-source }}
  plan-complete:
    description: |
      Whether the JSON plan is the whole plan: "true" only when it says
      "complete": true; "false" when it says false (as with -target or deferred
      changes) or does not say; "?" when the counts are '?'. Empty when the counts
      come from the console ('plan-json-file' empty), which cannot tell. The counts
      of an incomplete plan are still its counts; a consumer that must see the whole
      plan refuses anything but "true".
    value: ${{ steps.parse-plan-output.outputs.plan-complete }}
  count-add:
    description: |
      Number of resources to be added. From the JSON plan: managed resources whose
      actions hold "create", a replacement included.
    value: ${{ steps.parse-plan-output.outputs.add-count }}
  count-change:
    description: |
      Number of resources to be changed. From the JSON plan: managed resources whose
      actions are ["update"].
    value: ${{ steps.parse-plan-output.outputs.change-count }}
  count-destroy:
    description: |
      Number of resources to be destroyed. From the JSON plan: managed resources whose
      actions hold "delete", a replacement included.
    value: ${{ steps.parse-plan-output.outputs.destroy-count }}
  count-import:
    description: |
      Number of resources to be imported. From the JSON plan: managed resources with
      'change.importing', whatever their actions.
    value: ${{ steps.parse-plan-output.outputs.import-count }}
  count-move:
    description: |
      Number of resources to be moved. From the JSON plan: managed resources whose
      'previous_address' differs from their address, whatever their actions.
    value: ${{ steps.parse-plan-output.outputs.move-count }}
  count-remove:
    description: |
      Number of resources to be removed from state without being destroyed (a 'removed'
      block). From the JSON plan: managed resources whose actions hold "forget".
    value: ${{ steps.parse-plan-output.outputs.remove-count }}
  count-total:
    description: |
      Sum of all change-count outputs (add + change + destroy + import + move + remove).
      Useful for "does this plan have any resource changes at all?" without callers
      needing to sum the individual counts themselves (GitHub Actions expressions
      don't support arithmetic). New count categories added in future versions of
      this action will automatically roll into this total.

      Note: output-only changes are NOT reflected here (count-total stays 0). Use
      `has-output-only-changes` to detect that case.
    value: ${{ steps.parse-plan-output.outputs.total-count }}
  has-output-only-changes:
    description: |
      "true" when the plan reports changes to outputs but no resource changes,
      "false" otherwise. Lets consumers render output-only plans differently
      from truly-no-change plans even though both yield count-total=0.

      From the JSON plan: an 'output_changes' entry whose actions are not ["no-op"],
      together with count-total being 0.

      From the console: the "Changes to Outputs:" header together with count-total
      being 0. Terraform's "without changing any real infrastructure" sentence
      is not a reliable signal on its own: it is omitted whenever the plan also
      defers a data source read, which output-only plans commonly do.
    value: ${{ steps.parse-plan-output.outputs.has-output-only-changes }}
  plan-class:
    description: |
      What the JSON plan finds (docs/Drift-detection.md §4, D3): "drift" when a resource
      changed outside Terraform and the plan would change it back (an address in
      'resource_drift' that also has a planned action other than no-op and read);
      "pending" for any other change, outputs included; "clean" for none; "unknown"
      when the counts are '?' or the plan cannot be classified. Empty when the counts
      come from the console, which cannot tell drift from a change.
    value: ${{ steps.parse-plan-output.outputs.plan-class }}
  count-drift:
    description: |
      Number of resources that drifted and that the plan would change back. '?' when
      'plan-class' is unknown, empty when it is empty.
    value: ${{ steps.parse-plan-output.outputs.count-drift }}
  count-drift-ignored:
    description: |
      Number of resources that drifted with no planned change to revert them: attributes
      under ignore_changes, values a provider normalises. Never a finding. '?' when
      'plan-class' is unknown, empty when it is empty.
    value: ${{ steps.parse-plan-output.outputs.count-drift-ignored }}
  has-pending-changes:
    description: |
      "true" when the plan has a change of its own besides reverting drift: a change on
      a resource that did not drift or, without drift, an output change. "true" for
      every "pending" plan, "false" for "clean"; for "drift" it tells drift alone from
      drift beside an unapplied change. '?' when 'plan-class' is unknown, empty when it
      is empty.
    value: ${{ steps.parse-plan-output.outputs.has-pending-changes }}
  drift-addresses:
    description: |
      The addresses 'count-drift' counts, sorted, as a compact JSON list of as many as
      fit in 3000 bytes; 'count-drift' says how many there are in all. "[]" without
      drift; empty when 'plan-class' is unknown or empty.
    value: ${{ steps.parse-plan-output.outputs.drift-addresses }}
  plan-fingerprint:
    description: |
      SHA-256 of what the plan would do (docs/Drift-detection.md D4): equal fingerprints
      are the same finding. Empty for "clean", "unknown" and an empty 'plan-class'.
    value: ${{ steps.parse-plan-output.outputs.plan-fingerprint }}
runs:
  using: "composite"
  steps:
    - id: parse-plan-output
      shell: bash
      env:
        input_plan_console_file: ${{ inputs.plan-console-file }}
        input_plan_json_file: ${{ inputs.plan-json-file }}
      run: |
        # Count the plan's resource changes
        set -o allexport
        source "${{ github.action_path }}/step_parse_plan_output.sh"
