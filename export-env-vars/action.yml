name: "Export environment variables for use in subsequent action steps"
description: |
  This action makes environment variables available to subsequent action steps in workflow.
author: "Peder Schmedling"
inputs:
  extra-envs:
    description: |
      Key value pairs of environment variables to make available to all stages og all environments.

      JSON object with environment variables to export.
        key:    env name
        value:  value of env
    required: true
  extra-envs-from-secrets:
    description: |
      Key value pairs of environment variables to make available to all stages og all environments.
      The value of the environment variables will be retrieved from github secrets.

      JSON object with environment variables to export from secrets.
        Key   : env name
        Value : name of secret to export
    required: true
  secrets-json:
    description: |
      All secrets available to the ci/cd workflow.

      Example (replace '?' with '$'):
        - uses: ./.github/export-env-vars
          with:
            secrets-json: ?{{ toJSON(secrets) }}
            ...
    required: true
runs:
  using: "composite"
  steps:
    - id: export-envs
      shell: bash
      run: |
        # Make env vars and secrets available to subsequent actions
        #
        # JSON-contract inputs, captured through quoted heredocs as shell-locals:
        # step_export_envs.sh reads them via 'source'. No 'set -o allexport' on
        # purpose: secret values pass through shell variables on their way to
        # $GITHUB_ENV, and under allexport each of them would be exported into
        # the environment of every process the step forks; 'secrets-json' is
        # also large enough to matter for ARG_MAX. Nothing here needs envp, the
        # step's only output is the $GITHUB_ENV file.
        input_extra_envs=$(cat <<'EXPORT_ENV_VARS_EXTRA_ENVS_JSON'
        ${{ inputs.extra-envs }}
        EXPORT_ENV_VARS_EXTRA_ENVS_JSON
        )
        input_extra_envs_from_secrets=$(cat <<'EXPORT_ENV_VARS_EXTRA_ENVS_FROM_SECRETS_JSON'
        ${{ inputs.extra-envs-from-secrets }}
        EXPORT_ENV_VARS_EXTRA_ENVS_FROM_SECRETS_JSON
        )
        input_secrets_json=$(cat <<'EXPORT_ENV_VARS_SECRETS_JSON'
        ${{ inputs.secrets-json }}
        EXPORT_ENV_VARS_SECRETS_JSON
        )

        source "${{ github.action_path }}/step_export_envs.sh"
