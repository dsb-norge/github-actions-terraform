name: "Run terraform apply in directory"
description: |
  Runs 'terraform apply' for a given a terraform plan file.
author: "Peder Schmedling"
inputs:
  working-directory:
    description: From what directory to invoke terraform.
    required: true
  terraform-plan-file:
    description: Path of terraform plan output file to apply.
    required: true
  extra-envs-file:
    description: |
      Path to a JSON file with environment variables to apply to this action's
      invocations only, as produced by the 'resolve-goal-envs' action. A JSON
      null value unsets the variable rather than setting it to the empty
      string.

      A path rather than a payload so that the values — which may be secrets —
      never enter argv, envp, or this step's script text.

      The values are applied before this action's own exports, so an action-managed
      variable set by the step script at runtime (e.g. TF_PLUGIN_CACHE_DIR) wins,
      while one set in the step's env: block (e.g. TF_IN_AUTOMATION) is overridden
      by the caller. See docs/Per-goal-environment-variables.md §6.3.
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - id: check-prereqs
      shell: bash
      run: |
        # Make sure the plan file and the terraform binary are available

        set -o allexport; source "${{ github.action_path }}/helpers.sh"; set +o allexport;

        start-group "check prerequisite: plan file"
        given_path='${{ inputs.terraform-plan-file }}'
        log-info "configured plan file path is '${given_path}'"
        if [ ! -f "${given_path}" ]; then
          log-error "the configured plan file does not exists, unable to perform plan!"
          exit 1
        else
          log-info "the configured plan file exists."
        fi
        end-group

        start-group "check prerequisite: terraform binary"
        if ! command -v terraform version &>/dev/null; then
          log-error "terraform is not available on path, please install using the 'setup-terraform' action!"
          exit 1
        else
          log-info "using $(terraform version)"
        fi
        end-group
    - id: apply
      shell: bash
      env:
        TF_IN_AUTOMATION: "true"
        input_working_directory: ${{ inputs.working-directory }}
        input_terraform_plan_file: ${{ inputs.terraform-plan-file }}
        input_extra_envs_file: ${{ inputs.extra-envs-file }}
      run: |
        # Run 'terraform apply' on the saved plan file
        set -o allexport
        source "${{ github.action_path }}/step_apply.sh"
