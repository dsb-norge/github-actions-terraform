name: "Capture Matrix Job Metadata"
description: |
  Captures comprehensive metadata from all steps in a matrix job.
  Gathers step outputs, outcomes, conclusions, and matrix context into a single
  JSON file for artifact upload and later analysis.

  ## Behavior Notes

  - Runs with best-effort collection: missing data will not cause failure
  - Handles null/empty values gracefully
  - Designed to run with if: always() to capture data even on job failure
  - Excludes secret values from output
  - Automatically captures all steps from the steps context (future-proof)
  - Names the uploaded artifact and the JSON file from 'artifact-name',
    default 'matrix-job-meta-<entity>'

author: "Peder Schmedling"
inputs:
  entity-name:
    description: |
      Name of what this matrix job ran for: a deployment environment
      (e.g., "sandbox", "production") or any other matrix entity, such as a
      test file's slug. Recorded as 'metadata.environment' in the JSON and
      used in the default 'artifact-name'.

      Give this or 'environment-name'. When both are given and differ,
      'entity-name' wins and the step logs a warning. When neither is given,
      a random 'unknown-XXXXXX' name keeps the file name unique.
    required: false
    default: ""

  environment-name:
    description: |
      Alias of 'entity-name', kept for existing callers: the name of the
      current deployment environment (e.g., "sandbox", "production").
    required: false
    default: ""

  artifact-name:
    description: |
      Optional: the name of the uploaded artifact AND the basename of the JSON
      file inside it ('<artifact-name>.json'). Defaults to
      'matrix-job-meta-<entity>', which is what the environment aggregator,
      the run summary and the auto-merge evaluator glob for; a job whose
      metadata must stay out of their input sets a name outside that
      pattern. May not contain '/', ':', '"', '<', '>', '|', '*', '?', '\'
      or a line break; such a name fails the step.
    required: false
    default: ""

  matrix-context-json:
    description: |
      JSON object containing the full matrix context.
      Pass as: toJSON(matrix)
    required: true

  github-context-json:
    description: |
      JSON object containing github context (filtered for non-sensitive data).
      Pass as: toJSON(github)
    required: true

  steps-context-json:
    description: |
      JSON object containing the entire steps context.
      This captures all step outcomes, conclusions, and outputs automatically.
      Pass as: toJSON(steps)
    required: true

outputs:
  result-json-file:
    description: |
      Absolute path to the JSON file containing all captured metadata.
      Use this path with actions/upload-artifact to save the result.
    value: ${{ steps.capture.outputs.result-json-file }}
  artifact-name:
    description: |
      The name the metadata artifact was uploaded under: 'artifact-name' when
      given, else 'matrix-job-meta-<entity>'. Also the JSON file's basename
      without '.json'.
    value: ${{ steps.capture.outputs.artifact-name }}

runs:
  using: "composite"
  steps:
    - id: capture
      shell: bash
      env:
        input_entity_name: ${{ inputs.entity-name }}
        input_environment_name: ${{ inputs.environment-name }}
        input_artifact_name: ${{ inputs.artifact-name }}
      run: |
        # Capture step outcomes, outputs and matrix context to a JSON file
        #
        # JSON inputs are captured into shell-local variables (heredocs)
        # and intentionally NOT exported. step_capture.sh is sourced from
        # this same shell so it reads them as locals — they stay out of
        # envp.
        #
        # Why this matters: the steps context for an env with a non-trivial
        # plan carries the full create-validation-summary `plan-extract`
        # output (capped at ~65k chars). Exporting that pushed every
        # subsequent fork's envp past ARG_MAX — helpers.sh's first fork
        # (basename/dirname on line 4) died with E2BIG, the capture
        # sub-step silently failed, the upload-artifact sub-step skipped
        # on its `if:` guard, and that env's matrix-job-meta-*.json was
        # missing from the aggregator's input — its column dropped from
        # the per-group summary table. Observed in production on the env
        # with the largest plan output of the matrix.
        input_matrix_context_json=$(cat <<'CAPTURE_MATRIX_JOB_META_MATRIX_CONTEXT_JSON'
        ${{ inputs.matrix-context-json }}
        CAPTURE_MATRIX_JOB_META_MATRIX_CONTEXT_JSON
        )
        input_github_context_json=$(cat <<'CAPTURE_MATRIX_JOB_META_GITHUB_CONTEXT_JSON'
        ${{ inputs.github-context-json }}
        CAPTURE_MATRIX_JOB_META_GITHUB_CONTEXT_JSON
        )
        input_steps_context_json=$(cat <<'CAPTURE_MATRIX_JOB_META_STEPS_CONTEXT_JSON'
        ${{ inputs.steps-context-json }}
        CAPTURE_MATRIX_JOB_META_STEPS_CONTEXT_JSON
        )

        source "${GITHUB_ACTION_PATH}/step_capture.sh"
        exit_code=$?
        exit ${exit_code}

    - name: "📦 Upload matrix job metadata"
      id: upload-metadata
      if: steps.capture.outcome == 'success'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.capture.outputs.artifact-name }}
        path: ${{ steps.capture.outputs.result-json-file }}
      continue-on-error: true # never fail the job due to metadata upload
